<title>Lumen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : appli une colonne façon carnet de chevet, halo de lampe en haut, barre d'onglets fixe en bas. Dark-first. */
:root{
  --bg:#241544; --bg2:#3B1E68; --surface:#3A2468; --surface-2:#4A2F80; --line:#5D3E99;
  --fg:#FFF0FA; --muted:#CBB5E8; --lamp:#FF5FA2; --lamp-ink:#241634; --accent2:#FFD23F;
  --good:#6FE0A6; --bad:#FF7B6E; --glow:rgba(255,95,162,.22); --dotl:66%;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFF0F7; --bg2:#FBDDEC; --surface:#FFFFFF; --surface-2:#FBE3F0; --line:#F2BFD8;
  --fg:#3A1650; --muted:#7E5A93; --lamp:#D81F6E; --lamp-ink:#FFFFFF; --accent2:#E0A000;
  --good:#1D8657; --bad:#C23A2E; --glow:rgba(255,77,148,.16); --dotl:42%; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFF0F7; --bg2:#FBDDEC; --surface:#FFFFFF; --surface-2:#FBE3F0; --line:#F2BFD8;
  --fg:#3A1650; --muted:#7E5A93; --lamp:#D81F6E; --lamp-ink:#FFFFFF; --accent2:#E0A000;
  --good:#1D8657; --bad:#C23A2E; --glow:rgba(255,77,148,.16); --dotl:42%; color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(130% 520px at 50% -80px,var(--bg2),transparent 75%) no-repeat,var(--bg) radial-gradient(120% 340px at 50% -60px,var(--glow),transparent 70%) no-repeat;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
h1.big{font-size:clamp(28px,7.6vw,38px);font-weight:800;letter-spacing:-.025em}
h1.big em{font-style:normal;color:var(--lamp)}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
p{margin:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--lamp)}
.pills{display:flex;gap:6px}
.pill{font-family:var(--f-mono);font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.lv{border-color:var(--lamp);color:var(--lamp)}

.plan{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;padding:16px;background:var(--surface);border-radius:var(--r)}
.plan .n{font-family:var(--f-mono);font-size:12px;color:var(--lamp);padding-top:3px}
.plan .t{font-size:15px}
.plan .t b{font-family:var(--f-display);font-weight:700}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:15px 20px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:17px;background:var(--lamp);color:var(--lamp-ink);width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:14px}

.progress{display:flex;gap:4px;margin-bottom:16px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--lamp)}
.progress i.now{background:linear-gradient(90deg,var(--lamp) 50%,var(--line) 50%)}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--lamp);transition:width .25s linear}
.card{background:var(--surface);border-radius:var(--r);padding:20px}
.fact h2{font-size:25px;font-weight:700;letter-spacing:-.015em;margin:10px 0 12px}
.fact p{font-size:17px}
.q h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-top:10px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice{text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1.5px solid transparent;font-size:16px;transition:border-color .15s,background .15s,opacity .15s}
.choice:hover:not([disabled]){border-color:var(--line)}
.choice[disabled]{cursor:default}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface-2))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface-2))}
.choice.dim{opacity:.5}
.choice.gone{opacity:.25;text-decoration:line-through}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:12px;min-height:34px}
.joker{font-family:var(--f-mono);font-size:12px;padding:7px 12px;border-radius:99px;border:1px dashed var(--lamp);color:var(--lamp)}
.combo{font-family:var(--f-mono);font-size:12px;color:var(--lamp)}
.verdict{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.verdict b{font-family:var(--f-display)}
.verdict.ok b{color:var(--good)} .verdict.ko b{color:var(--bad)}
.verdict p{margin-top:6px;font-size:15.5px}
.gain{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}
.gain b{color:var(--lamp);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip.lamp{background:color-mix(in srgb,var(--lamp) 18%,transparent);color:var(--lamp)}
.dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 62% var(--dotl));flex:none;display:inline-block}
.quit{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:6px 0}
.hearts{font-family:var(--f-mono);font-size:13px;color:var(--bad);letter-spacing:2px}
.toast{background:color-mix(in srgb,var(--lamp) 16%,var(--surface));border:1px solid var(--lamp);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.toast b{font-family:var(--f-display);color:var(--lamp)}
/* Passage de niveau */
.lvup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(14,6,28,.55);backdrop-filter:blur(3px);animation:lvFade .25s ease-out}
.lvup.out{animation:lvFadeOut .26s ease-in forwards}
.lv-card{position:relative;width:min(320px,100%);background:linear-gradient(180deg,var(--surface-2),var(--surface));border:2px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--edge),0 24px 60px rgba(0,0,0,.45);padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:lvPop .55s cubic-bezier(.3,1.7,.5,1)}
.lv-rays{position:absolute;left:50%;top:84px;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.28) 0 12deg,transparent 12deg 30deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 9s linear infinite;pointer-events:none}
.lv-badge{position:relative;width:128px;margin-top:-62px;animation:lvBadge .9s .1s cubic-bezier(.3,1.6,.5,1) both}
.lv-badge svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(255,210,63,.55))}
.lv-kicker{position:relative;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2)}
.lv-title{position:relative;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;text-wrap:balance}
.lv-sub{position:relative;color:var(--muted);font-size:15px;margin-bottom:8px}
.lv-ok{position:relative;min-width:150px}
.lv-more{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:-2px 0 8px}
.lv-bits{position:absolute;left:50%;top:84px;width:0;height:0;pointer-events:none}
.lv-bits i{position:absolute;width:9px;height:14px;border-radius:3px;background:var(--c);border:2px solid #2B1D3A;opacity:0;animation:lvBit 1.1s var(--d) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes lvFade{from{opacity:0}}
@keyframes lvFadeOut{to{opacity:0}}
@keyframes lvPop{from{transform:scale(.6) translateY(30px);opacity:0}}
@keyframes lvBadge{from{transform:scale(.2) rotate(-25deg)}}
@keyframes lvBit{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 60px)) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.lvup,.lv-card,.lv-badge,.lv-rays,.lv-bits i{animation:none!important}.lv-bits{display:none}}
/* Personnages animés (atelier/toy.js) */
.toyc .fl{animation:tfloat 3.4s ease-in-out infinite}
@keyframes tfloat{50%{transform:translateY(-4px)}}
.toyc .tbreath{animation:tbreath 3.6s ease-in-out infinite;transform-origin:60px 104px}
@keyframes tbreath{50%{transform:scale(1.025,.975)}}
.toyc.t-jelly .tbreath{animation:tjelly 2.4s ease-in-out infinite}
@keyframes tjelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.07,.93)}60%{transform:scale(.96,1.04)}}
.tblink{animation:tblink 4.8s infinite;animation-delay:var(--bd,0s);transform-box:fill-box;transform-origin:center}
@keyframes tblink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.ta-sway{animation:tsway 2.8s ease-in-out infinite alternate}
@keyframes tsway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.ta-wag{animation:twag .45s ease-in-out infinite alternate}
@keyframes twag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.ta-ear{animation:tear 3.2s ease-in-out infinite}
@keyframes tear{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.ta-flap{animation:tflap .16s ease-in-out infinite alternate}
@keyframes tflap{to{transform:scaleY(.72)}}
.ta-wing{animation:twing 3s ease-in-out infinite}
@keyframes twing{0%,70%,100%{transform:rotate(0)}78%,86%{transform:rotate(-10deg)}82%{transform:rotate(4deg)}}
.ta-pulse{animation:tpulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tpulse{50%{opacity:.1;transform:scale(.86)}}
.ta-flick{animation:tflick .32s ease-in-out infinite alternate}
@keyframes tflick{to{transform:scale(.92,1.07) skewX(3deg)}}
.ta-ember{animation:tember 2.2s ease-out infinite}
@keyframes tember{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.ta-rain{animation:train 1.15s linear infinite}
@keyframes train{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(17px);opacity:0}}
.ta-spike{animation:tspike 2.6s ease-in-out infinite}
@keyframes tspike{50%{transform:scale(1.06) rotate(5deg)}}
.ta-twinkle{animation:ttw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ttw{50%{transform:scale(.3);opacity:.3}}
.ta-look{animation:tlook 5.2s ease-in-out infinite}
@keyframes tlook{0%,18%{transform:translateX(0)}28%,44%{transform:translateX(-2.6px)}54%,70%{transform:translate(2.6px,1px)}80%,100%{transform:translateX(0)}}
.ta-spore{animation:tspore 3.2s ease-out infinite}
@keyframes tspore{0%{transform:translateY(6px) scale(.5);opacity:0}25%{opacity:.95}100%{transform:translateY(-22px) scale(1.1);opacity:0}}
.toyc.t-beat .tbreath{animation:tbeat 1.3s ease-in-out infinite}
@keyframes tbeat{0%,40%,100%{transform:scale(1)}10%,30%{transform:scale(1.07)}20%{transform:scale(1.02)}}
.toyc.t-bounce .tbreath{animation:tbounce 1.6s cubic-bezier(.3,0,.5,1) infinite}
@keyframes tbounce{0%,100%{transform:translateY(0) scale(1.04,.96)}12%{transform:translateY(0) scale(.97,1.03)}50%{transform:translateY(-12px) scale(1)}}
.ta-globe{animation:tglobe 7s linear infinite}
@keyframes tglobe{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.ta-bubble{animation:tbubble 2.4s ease-in infinite}
.ta-snow{animation:tsnow 3.4s linear infinite}
@keyframes tsnow{0%{transform:translateY(-6px);opacity:0}15%{opacity:1}100%{transform:translate(4px,40px);opacity:0}}
.ta-dribble{animation:tdribble .9s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes tdribble{to{transform:translateY(-14px)}}
@keyframes tbubble{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.ta-blinkb{animation:tblinkb 1.4s steps(2,jump-none) infinite}
@keyframes tblinkb{50%{opacity:.35}}
.ta-pulse2{animation:tpulse2 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tpulse2{50%{transform:scale(1.15)}}
.ta-pop{animation:tpop 2.2s ease-out infinite}
@keyframes tpop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-12px) rotate(20deg)}}
.ta-drip{animation:tdrip 2.6s ease-in infinite}
@keyframes tdrip{0%,40%{transform:translateY(-8px);opacity:0}50%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.ta-coin{animation:tcoin 2.8s ease-in infinite}
@keyframes tcoin{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}55%{transform:translateY(18px);opacity:1}62%,100%{transform:translateY(20px);opacity:0}}
.ta-rays{animation:spin 14s linear infinite}
.ta-propel{animation:tprop .35s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tprop{50%{transform:scaleX(-1)}}
.ta-float2{animation:tfloat 2.6s ease-in-out infinite}
/* Somni : reste éveillé un moment, pique du nez, puis s'endort avec des zzz */
.so-open{animation:soOpen 11s infinite}
.so-closed,.so-zzz{opacity:0;animation:soSleep 11s infinite}
@keyframes soOpen{0%,50%{opacity:1}53%,94%{opacity:0}97%,100%{opacity:1}}
@keyframes soSleep{0%,50%{opacity:0}53%,94%{opacity:1}97%,100%{opacity:0}}
.so-z{animation:soZ 2.4s ease-out infinite;font-family:var(--f-display);font-weight:800}
@keyframes soZ{0%{transform:translate(0,4px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(-8px,-20px) scale(1.15);opacity:0}}
.so-head{animation:soNod 11s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes soNod{0%,50%{transform:rotate(0)}56%,92%{transform:rotate(-5deg) translateY(2px)}97%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.toyc *,.toyc .fl,.toyc .tbreath{animation:none!important}.so-closed,.so-zzz{opacity:0}.so-open{opacity:1}}

.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--lamp);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr;gap:10px}
.item .mk{font-family:var(--f-mono);font-size:13px;padding-top:2px}
.mk.ok{color:var(--good)} .mk.ko{color:var(--bad)} .mk.f{color:var(--lamp)}
.item b{font-family:var(--f-display);font-weight:700;font-size:15.5px;display:block}
.item span{font-size:14.5px;color:var(--muted);display:block}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent;min-width:0}
.mode:hover{border-color:var(--line)}
.mode h3{font-size:18px;font-weight:700}
.mode p{font-size:14px;color:var(--muted);line-height:1.4}
.mode .label{margin-top:auto;padding-top:6px}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.5;cursor:default}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme{text-align:left;background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent;min-width:0}
.theme:hover{border-color:var(--line)}
.theme.today{border-color:var(--lamp)}
.theme b{font-family:var(--f-display);font-size:15.5px;line-height:1.2}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lamp)}

.avap{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--surface);border-radius:var(--r);padding:18px 18px 16px}
.ev .yr{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--lamp);font-variant-numeric:tabular-nums;line-height:1}
.ev .yr.hid{color:var(--muted)}
.ev h2{font-size:19px;font-weight:700;margin-top:8px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yearq{display:flex;flex-direction:column;gap:10px}
.yrow{display:flex;gap:10px;align-items:stretch}
.yin{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.yin:focus{outline:3px solid var(--accent2);outline-offset:1px}

.filters{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px;margin:0 -4px}
.filters button{flex:none;font-family:var(--f-mono);font-size:12px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.entry{padding:16px 0;border-bottom:1px solid var(--line)}
.entry .q{font-family:var(--f-display);font-weight:700;font-size:16px;margin:6px 0 4px}
.entry .a{color:var(--lamp);font-weight:600;font-size:15px}
.entry p{margin-top:6px;font-size:14.5px;color:var(--muted)}
.empty{padding:28px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}

.acct{background:var(--surface);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lamp) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 12px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tl{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow .nm{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;min-width:0}
.trow .lv{font-family:var(--f-mono);font-size:12px;color:var(--lamp);text-align:right;white-space:nowrap}
.trow .meter{grid-column:1/-1;height:6px}
.trow .sub{grid-column:1/-1;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* --- v4 : profil, accueil, maison, badges --- */

.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Anecdotes, missions, carnet */
.anec{margin-top:10px!important;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--lamp) 10%,transparent);border-left:3px solid var(--lamp);color:var(--fg)!important;font-size:14.5px!important}

.mrow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;font-size:14.5px}

.nbhead{display:flex;align-items:baseline;gap:10px}

.nbt{font-family:var(--f-display);font-size:20px;display:flex;align-items:center;gap:8px}
.entry{border-left:3px solid hsl(var(--h,40) 60% 55%);padding-left:12px}

/* Images, accessoires */
.pic{display:grid;place-items:center;min-height:170px;margin:12px 0 2px;border-radius:14px;background:var(--surface-2);padding:16px}

.pic.sm .flag{width:96px;border-radius:4px}
.shape path{fill:var(--lamp);stroke:color-mix(in srgb,var(--lamp) 60%,#000);stroke-width:.8;stroke-linejoin:round}
.choices.flags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.flags .choice{display:grid;place-items:center;padding:10px}
.choices.flags .choice svg{width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.atw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg.s4 button{font-size:10.5px;padding:9px 2px}
.dress-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.dress-prev{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--lamp) 22%,var(--surface-2)),var(--surface) 70%)}

.sk.locked svg{filter:grayscale(.9) opacity(.55)}
/* Boutique et collection */
.seg.s3{grid-template-columns:repeat(3,1fr)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.skgrid.one{grid-template-columns:1fr}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:0}
.sk b{font-family:var(--f-display);font-size:15.5px}
.sk .muted{font-size:12.5px;line-height:1.3}
.sk .chip{font-size:11px}
.sk.own{border-color:color-mix(in srgb,var(--lamp) 35%,var(--line))}
.sk.secret{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--lamp) 18%,var(--surface)),var(--surface) 70%)}

.sk.lock .sil svg *{animation:none!important}

.sk .pad{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.sk.ultra .pad{border-color:var(--lamp)}
.sk .pad svg{width:17px;height:17px;fill:none;stroke:var(--lamp);stroke-width:2;stroke-linecap:round}
.sk.lock b{letter-spacing:.12em;color:var(--muted)}
.toast .sec{display:flex;align-items:center;gap:10px}
.toast .sec svg{flex:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border-radius:12px}
.seg button{padding:9px 4px;border-radius:9px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.scene-wrap{border-radius:18px;overflow:hidden;border:2px solid #2B2340;background:#8FD0F5}
.scene{display:block;width:100%;height:auto}
.scene .room{cursor:pointer}
.sc-t{font-family:var(--f-display);font-weight:800;font-size:14px;fill:#2B2340}
.sc-p{font-family:var(--f-mono);font-size:11px;fill:#2B2340}
.rt{font-family:var(--f-display);font-size:18px}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.shop b{font-family:var(--f-display);font-size:15.5px}
.shop svg{background:var(--surface-2);border-radius:10px;padding:2px}
.shop.own{opacity:.7}
.shop .btn.small{gap:6px;min-width:76px}
.btn[disabled]{opacity:.45;cursor:default}
.badge{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.badge b{font-family:var(--f-display);font-size:15px}
.badge .label{white-space:nowrap;font-size:10.5px}
.medal{width:28px;height:28px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--lamp-ink);font-size:14px}
.badge.own .medal{border:0;background:radial-gradient(circle at 35% 35%,#FFE7A0,#F2B83B 60%,#C98A1B)}
.pip{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 4px;margin-left:4px;border-radius:6px;border:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.pip.on{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.tabs[hidden]{display:none!important}

[hidden]{display:none!important}
.seg{grid-template-columns:repeat(5,1fr)!important}.seg button{font-size:10.5px!important;padding:9px 2px!important}
.about{all:unset;cursor:default;color:var(--muted);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.admin{border:1.5px dashed var(--lamp)}
/* --- Lumen : médailles --- */
.bdg{overflow:visible}
.bdg .spin{animation:spin 14s linear infinite;transform-origin:100px 100px}
.bdg .spin.slow{animation-duration:40s}
.bdg .pulse{animation:pulse 2.6s ease-in-out infinite;transform-origin:100px 100px}
.bdg .flick{animation:flick .9s ease-in-out infinite alternate;transform-origin:100px 100px}
.bdg .flick.d2{animation-duration:.7s;animation-delay:-.3s}
.bdg .tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bdg .ember{animation:ember 2.4s ease-in infinite}
.bdg .d2{animation-delay:-.8s}.bdg .d3{animation-delay:-1.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:.75;transform:scale(1.04)}}
@keyframes flick{from{transform:scale(1) rotate(0)}to{transform:scale(1.04) rotate(2deg)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes ember{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 6px;align-items:end}
.bt{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.bt b{font-family:var(--f-display);font-size:13px;line-height:1.2}
.bt span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.bt .bc{display:inline-flex;gap:4px;align-items:center}
.bt.lock svg{filter:grayscale(1) brightness(.75);opacity:.45}
.bt.lock svg *{animation:none!important}
details.tb summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}

details.tb[open] summary{margin-bottom:12px}
.nextb{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.nb-m{width:76px;display:grid;place-items:center}
.av svg{transition:transform .15s}
.av{padding:6px 2px 8px}
.me-av svg,.who svg{background:none}
.who svg{width:38px;height:auto}
/* --- Lumen : parc --- */
#parc{--ink:#1B1A33;--panel:rgba(24,24,52,.88);--line:rgba(255,255,255,.14);--fg:#F4EFE6;--muted:#B8B6D6;--lamp:#F2A947;--lamp-ink:#1A1405;position:fixed;inset:0;z-index:30;background:#161a3a;color:#F4EFE6;font-family:var(--f-display);color-scheme:dark}

#parc .roul-num.g{background:#1E8A4A}
#parc .table-felt{background:radial-gradient(ellipse at 50% 30%,#2A8A5A,#145A36);border:3px solid #8A5A2A;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px}
#parc .hand{display:flex;flex-direction:column;gap:6px}
#parc .cards{display:flex;gap:6px;flex-wrap:wrap;min-height:70px}
#parc .card{width:48px;height:68px;border-radius:7px;background:#FFFDF8;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:deal .25s ease-out}
#parc .card b{font-size:18px;line-height:1}
#parc .card i{font-style:normal;font-size:20px;line-height:1.1}
#parc .card.back{background:repeating-linear-gradient(45deg,#8A1E2A 0 6px,#A82838 6px 12px);border:2px solid #FFFDF8}
#parc .card.ghost{background:rgba(255,255,255,.1);box-shadow:none;border:1.5px dashed rgba(255,255,255,.35);animation:none}
@keyframes deal{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#parc .track{position:relative;background:#3E8A3A;border:3px solid #E0B040;border-radius:12px;padding:4px 0;overflow:hidden}
#parc .lane{position:relative;height:42px;border-bottom:1px dashed rgba(255,255,255,.25)}
#parc .lane:nth-child(odd){background:rgba(255,255,255,.06)}
#parc .hname{position:absolute;right:30px;top:12px;font-family:var(--f-mono);font-size:10.5px;color:rgba(255,255,255,.7)}
#parc .horse{position:absolute;top:4px;transition:none}
#parc .finish{position:absolute;right:20px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(0deg,#fff 0 6px,#111 6px 12px)}
#parc .horses{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
#parc .hpick{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;padding:7px 4px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);font-size:13px;font-weight:700}
#parc .hpick i{width:14px;height:14px;border-radius:50%}
#parc .hpick span{font-family:var(--f-mono);font-size:12px;color:#FFE36A}
#parc .hpick[aria-pressed="true"]{border-color:#FFE36A}
@media (max-width:520px){#parc .bcard{width:104px}
#parc .bcard img{width:80px;height:80px}}
/* Lancement */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#6A2E5E 0%,#3A1640 50%,#170A1E 100%);transition:opacity .7s ease}
.emb{position:relative;width:108px;height:108px;border-radius:26px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 40px rgba(255,170,80,.35);opacity:0;transform:scale(.4) rotate(-12deg);animation:emb .7s .15s cubic-bezier(.25,1.6,.45,1) forwards}
.emb svg{width:100%;height:100%;display:block}
@keyframes emb{to{opacity:1;transform:none}}
#splash.out{opacity:0;pointer-events:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px;text-align:center}
.halo{position:absolute;width:340px;height:340px;max-width:90vw;max-height:90vw;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55),rgba(255,180,70,.12) 45%,transparent 70%);animation:halo 2.2s ease-out both}
@keyframes halo{0%{transform:scale(.2);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:.85}}
.logo{position:relative;font-size:clamp(56px,16vw,96px);font-weight:800;letter-spacing:-.04em;color:#FFF3D6;text-shadow:0 0 28px rgba(255,200,100,.65)}
.logo span{display:inline-block;opacity:0;transform:translateY(18px) scale(.8);animation:letter .55s cubic-bezier(.2,1.6,.4,1) forwards}
.logo span.u{color:#FFB45A}
@keyframes letter{to{opacity:1;transform:none}}
.tag{position:relative;font-family:var(--f-text);font-style:italic;font-size:19px;letter-spacing:.06em;color:#F3D9B8;opacity:0;animation:fadein .6s 1.2s forwards}
@keyframes fadein{to{opacity:1}}
.crew{position:relative;display:flex;gap:6px;align-items:flex-end;height:84px}
.crew > div{opacity:0;transform:translateY(30px) scale(.6);animation:pop .5s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.load{position:relative;width:200px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:fadein .4s 1.4s forwards}
.load i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#FF5FA2,#FFD23F);border-radius:3px;transition:width .5s ease}

@media (prefers-reduced-motion:reduce){ .logo span,.crew > div,.halo,.tag,.load,.emb{animation:none;opacity:1;transform:none} .bdg *{animation:none!important} }

/* ================= Habillage « jeu mobile » ================= */
:root{--press:color-mix(in srgb,var(--lamp) 62%,#000);--edge:color-mix(in srgb,var(--surface) 55%,#000);--r:20px}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--edge:color-mix(in srgb,var(--line) 70%,#C47AA0)}}
:root[data-theme="light"]{--edge:color-mix(in srgb,var(--line) 70%,#C47AA0)}
.gi{flex:none;display:block;overflow:visible}
/* Boutons qui s'enfoncent */
.btn{border-radius:16px;box-shadow:0 5px 0 var(--press);transform:translateY(0);transition:transform .08s,box-shadow .08s;letter-spacing:.01em;margin-bottom:5px}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--press)}
.btn.ghost{box-shadow:0 4px 0 var(--edge);background:var(--surface);border:1.5px solid var(--line)}
.btn.ghost:active:not([disabled]){box-shadow:0 1px 0 var(--edge)}
.btn.small{border-radius:12px;box-shadow:0 3px 0 var(--press);margin-bottom:3px}
.btn.small.ghost{box-shadow:0 3px 0 var(--edge)}
.btn[disabled]{opacity:.5;cursor:default}
/* Cartes en relief */
.card,.mode,.theme,.stat,.acct,.sk,.ev{box-shadow:0 4px 0 var(--edge)}
.card{border-radius:var(--r)}
/* Barre du haut : HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin:-18px calc(-1*max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hav{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--lamp) calc(var(--p)*1%),var(--line) 0);flex:none}
.hav>svg{background:var(--surface);border-radius:50%;width:44px!important;height:44px!important;padding:2px}
.hlv{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--lamp);color:var(--lamp-ink);font-family:var(--f-display);font-weight:800;font-size:12.5px;display:grid;place-items:center;border:2px solid var(--bg)}
.who{gap:12px;font-size:17px}
.who>span:last-child{font-weight:800}
.pills{gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:15px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--surface);border:0;box-shadow:0 3px 0 var(--edge)}
.pill.streak .gi{width:22px;height:22px}
.pill.streak.off{opacity:.55}
.pill.coins{padding-right:5px;color:var(--fg)}
.bigcoin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4C0 0 18%,#FFD045 40%,#E8A21A 75%,#B8780C);box-shadow:inset 0 0 0 1.5px #8A5A08,inset 0 -2px 0 rgba(0,0,0,.18);flex:none}
.plus{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:16px;line-height:1;box-shadow:0 2px 0 color-mix(in srgb,var(--good) 60%,#000)}
/* Barre d'onglets façon jeu */
.tabs{background:transparent;border-top:0;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tabs nav{background:var(--surface);border-radius:24px;padding:6px;box-shadow:0 -2px 0 var(--line) inset,0 6px 0 var(--edge),0 10px 30px rgba(0,0,0,.25);gap:2px}
.tabs button{border-radius:18px;padding:6px 2px 6px;gap:2px;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:0;transition:background .15s}
.tabs .ti{position:relative;display:grid;place-items:center;height:42px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tabs .ti svg.gi{width:42px!important;height:42px!important;overflow:visible;filter:saturate(.8)}
.tabs .ti>svg:not(.gi){width:36px;height:auto;filter:saturate(.8)}
.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--lamp) 20%,var(--surface-2));color:var(--lamp)}
.tabs button[aria-current="page"] .ti{transform:translateY(-10px) scale(1.14)}
.tabs button[aria-current="page"] .ti .gi,.tabs button[aria-current="page"] .ti>svg{filter:none}
.app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
/* Tuiles de modes avec grande icône */
.mode{position:relative;padding:14px 14px 14px;gap:4px;border-radius:var(--r);transition:transform .08s,box-shadow .08s}
.mode:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mode .mi{display:block;margin-bottom:4px}
.mode .mi .gi{width:46px;height:46px;transition:transform .2s}
.mode:hover:not([disabled]) .mi .gi{transform:rotate(-6deg) scale(1.06)}
.mode.wide{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.mode.wide .mi{grid-row:span 3;margin:0}
.mode.wide .mi .gi{width:54px;height:54px}
.mode.hl{box-shadow:0 4px 0 var(--press)}
/* Thèmes avec pictogramme */
.thi{display:inline-grid;place-items:center;flex:none;border-radius:30%;background:linear-gradient(160deg,hsl(var(--h) 70% 62%),hsl(var(--h) 62% 44%));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3),0 2px 0 hsl(var(--h) 50% 28%)}
.thi svg{width:62%;height:62%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.theme{border-radius:18px;padding:12px;gap:6px;transition:transform .08s,box-shadow .08s}
.theme:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.theme.today{box-shadow:0 4px 0 var(--press)}
.meter{height:7px;border-radius:4px;background:color-mix(in srgb,var(--line) 80%,transparent)}
.meter i{border-radius:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--lamp) 70%,#fff),var(--lamp))}
/* Défi du jour */
.hero{position:relative;overflow:hidden;border-radius:24px;box-shadow:0 5px 0 var(--press)}
.hero-ic{position:absolute;right:14px;top:14px;transform:rotate(8deg)}
.hero h2,.hero>.label{padding-right:72px}
/* Segments avec icônes */
.seg.gseg{border-radius:18px;padding:5px;gap:4px;box-shadow:0 3px 0 var(--edge)}
.seg.gseg button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:13px;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:0}
.seg.gseg button .gi{filter:saturate(.3) opacity(.7);transition:transform .2s}
.seg.gseg button[aria-pressed="true"]{background:var(--surface-2);box-shadow:0 2px 0 var(--edge)}
.seg.gseg button[aria-pressed="true"] .gi{filter:none;transform:scale(1.12)}
/* Questions */
.q h2{font-size:22px}
.choices{counter-reset:ch}
.choice{position:relative;padding:15px 16px 15px 54px;border-radius:16px;background:var(--surface-2);border:2px solid transparent;box-shadow:0 4px 0 var(--edge);font-family:var(--f-display);font-weight:600;font-size:16.5px;transition:transform .08s,box-shadow .08s,border-color .15s,background .15s}
.choice::before{counter-increment:ch;content:counter(ch,upper-alpha);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--muted);font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--edge)}
.choice:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.choice.right{box-shadow:0 4px 0 color-mix(in srgb,var(--good) 55%,#000);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.choice.right::before{content:"✓";background:var(--good);color:#fff}
.choice.wrong{box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000);animation:shake .4s}
.choice.wrong::before{content:"✗";background:var(--bad);color:#fff}
.choices.flags .choice{padding:10px}
.choices.flags .choice::before{display:none}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.joker{display:inline-flex;align-items:center;gap:6px;border:0;background:color-mix(in srgb,#8A6AF2 18%,var(--surface-2));color:var(--fg);font-family:var(--f-display);font-weight:700;padding:5px 12px 5px 6px;box-shadow:0 3px 0 var(--edge)}
.combo{font-family:var(--f-display);font-weight:800;font-size:14px;padding:4px 10px;border-radius:99px;background:linear-gradient(90deg,#FF8A2A,#FFD045);color:#3A1A00;animation:pop .4s}
.progress{gap:5px}
.progress i{height:8px;border-radius:4px}
.timer{height:10px;border-radius:5px}
.timer i{background:linear-gradient(90deg,#FFD045,var(--lamp))}
.hearts{font-size:22px;letter-spacing:3px}
.verdict{border-radius:16px;border-width:2px;animation:fade .25s both}
.verdict.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.verdict.ko{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.verdict b{font-size:18px}
.gain b{display:inline-block;animation:rise .6s cubic-bezier(.3,1.6,.5,1) both;font-family:var(--f-display);font-weight:800;font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}
.score{text-shadow:0 4px 0 var(--press)}
/* Toasts façon récompense */
.toast{border-width:2px;border-radius:16px;box-shadow:0 4px 0 var(--press);animation:toast .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes toast{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
/* Missions */
.mrow .mk{width:26px;height:26px;border-width:2px}
@media (prefers-reduced-motion:reduce){.choice.right,.choice.wrong,.toast,.gain b,.combo{animation:none}}

/* Citations, mot du jour, succès, difficulté */
.qlab{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp);margin-top:12px}
.quote{margin:8px 0 0;padding:14px 16px;border-left:4px solid var(--lamp);border-radius:12px;background:color-mix(in srgb,var(--lamp) 8%,var(--surface-2));font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.35}
.motj .mot{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--lamp)}
.motj p{font-size:15.5px}
.motj .btn{align-self:flex-start}
.succgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.succ{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:14px;background:var(--surface-2);box-shadow:0 3px 0 var(--edge)}
.succ b{font-family:var(--f-display);font-size:14px}
.succ span{font-size:12px;color:var(--muted);line-height:1.3}
.succ:not(.own){opacity:.7}
.succ:not(.own) b{letter-spacing:.15em}
.succ.own{background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--lamp) 22%,var(--surface-2)),var(--surface-2) 70%)}
.succ-ic{flex:none}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.diff button span{font-size:14px}
.seg.diff button small{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:500}
/* ---------- Look Bonbon : onglets en relief animés (validé) ---------- */
.tabs .ti>svg{position:relative;z-index:1}
.tabs .glow{position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--lamp) 55%,transparent),transparent);opacity:0;transform:scale(.5);transition:.35s;pointer-events:none}
.tabs button[aria-current="page"] .glow{opacity:1;transform:scale(1)}
.tabs button[aria-current="page"]{background:transparent;color:var(--fg);position:relative}
.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:2px;left:50%;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:var(--lamp)}
.tabs button[aria-current="page"] .ti svg{filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
svg.g3 g,svg.g3 path,svg.g3 circle{transform-box:fill-box}
svg.g3 .smoke circle,svg.g3 .pop{opacity:0}
@keyframes g3squash{0%{transform:none}18%{transform:scale(1.18,.8) translateY(4px)}42%{transform:scale(.9,1.16) translateY(-12px)}68%{transform:scale(1.06,.95)}100%{transform:none}}
@keyframes g3wiggle{0%{transform:none}15%{transform:rotate(-16deg) scale(1.12)}30%{transform:rotate(14deg) scale(1.12)}45%{transform:rotate(-10deg) scale(1.08)}60%{transform:rotate(7deg)}80%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes g3spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes g3puff{0%{opacity:0;transform:translateY(4px) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1.5)}}
@keyframes g3coin{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}60%{transform:translateY(-26px) scale(1.1)}100%{opacity:0;transform:translateY(-34px)}}
@keyframes g3wave{0%,100%{transform:rotate(0)}20%{transform:rotate(-30deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-30deg)}80%{transform:rotate(5deg)}}
.tabs button.tap .ti>svg{animation:g3squash .6s cubic-bezier(.3,1.4,.5,1)}
.tabs button.tap[data-k="play"] .ti>svg{animation:g3wiggle .7s ease-out}
.tabs button.tap[data-k="parc"] .wheel{animation:g3spin .9s cubic-bezier(.2,.8,.3,1);transform-origin:50% 50%}
.tabs button.tap[data-k="home"] .smoke circle{animation:g3puff .9s ease-out}
.tabs button.tap[data-k="home"] .smoke circle:nth-child(2){animation-delay:.18s}
.tabs button.tap[data-k="home"] .smoke circle:nth-child(3){animation-delay:.34s}
.tabs button.tap[data-k="shop"] .pop{animation:g3coin .8s ease-out;transform-origin:50% 50%}
.tabs button.tap[data-k="user"] .arm{animation:g3wave .8s ease-in-out;transform-origin:0% 100%}
.fx-spark{position:fixed;pointer-events:none;z-index:60;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:fxspark .65s ease-out forwards}
@keyframes fxspark{0%{transform:translate(-50%,-50%) scale(.2) rotate(0)}40%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(180deg);opacity:0}}
.fx-ring{position:fixed;width:20px;height:20px;border-radius:50%;border:3px solid var(--lamp);pointer-events:none;z-index:59;animation:fxring .5s ease-out forwards}
@keyframes fxring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
.mode .mi svg.g3,.mode svg.g3{overflow:visible}
@media (prefers-reduced-motion:reduce){.tabs button.tap *,.fx-spark,.fx-ring{animation:none!important}.fx-spark,.fx-ring{display:none}}
/* Ambiance stressante (Survie dernière vie, fin de Chrono) */
body.stress::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 90px 16px rgba(255,40,70,.62);animation:stressPulse var(--stress,1s) ease-in-out infinite}
@keyframes stressPulse{50%{box-shadow:inset 0 0 30px 2px rgba(255,40,70,.18)}}
@media (prefers-reduced-motion:reduce){body.stress::after{animation:none}}
/* Le Portail (événement surprise) */
.portal-ic{flex:none;width:44px;height:44px;border-radius:50%;background:conic-gradient(from 0deg,#8A5AFF,#FF5FA2,#FFD23F,#5AD8FF,#8A5AFF);border:3px solid #2B1D3A;box-shadow:0 0 18px rgba(160,110,255,.8);animation:portalSpin 2.4s linear infinite;position:relative}
.portal-ic::after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(#1A0A2E 30%,#3A1A6A);border:2px solid #2B1D3A}
.portal-ic.big{width:58px;height:58px}
@keyframes portalSpin{to{transform:rotate(360deg)}}
.am-inv.portal{border-color:#A07AFF;box-shadow:0 0 0 3px rgba(160,122,255,.35),0 10px 30px rgba(0,0,0,.5)}
.portal-card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;border:2px solid #A07AFF;color:inherit;background:linear-gradient(120deg,rgba(138,90,255,.35),rgba(255,95,162,.25));box-shadow:0 4px 0 #5A3AB8,0 0 24px rgba(160,122,255,.35);margin-bottom:4px;font:inherit}
.portal-card span span{font-size:13.5px;opacity:.85}
.portal-card:active{transform:translateY(3px);box-shadow:0 1px 0 #5A3AB8}
