<title>Lumen · Potions (maquette)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : appli une colonne façon carnet de chevet, halo de lampe en haut, barre d'onglets fixe en bas. Dark-first. */
:root{
  --bg:#241544; --bg2:#3B1E68; --surface:#3A2468; --surface-2:#4A2F80; --line:#5D3E99;
  --fg:#FFF0FA; --muted:#CBB5E8; --lamp:#FF5FA2; --lamp-ink:#241634; --accent2:#FFD23F;
  --good:#6FE0A6; --bad:#FF7B6E; --glow:rgba(255,95,162,.22); --dotl:66%;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFF0F7; --bg2:#FBDDEC; --surface:#FFFFFF; --surface-2:#FBE3F0; --line:#F2BFD8;
  --fg:#3A1650; --muted:#7E5A93; --lamp:#D81F6E; --lamp-ink:#FFFFFF; --accent2:#E0A000;
  --good:#1D8657; --bad:#C23A2E; --glow:rgba(255,77,148,.16); --dotl:42%; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFF0F7; --bg2:#FBDDEC; --surface:#FFFFFF; --surface-2:#FBE3F0; --line:#F2BFD8;
  --fg:#3A1650; --muted:#7E5A93; --lamp:#D81F6E; --lamp-ink:#FFFFFF; --accent2:#E0A000;
  --good:#1D8657; --bad:#C23A2E; --glow:rgba(255,77,148,.16); --dotl:42%; color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(130% 520px at 50% -80px,var(--bg2),transparent 75%) no-repeat,var(--bg) radial-gradient(120% 340px at 50% -60px,var(--glow),transparent 70%) no-repeat;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
h1.big{font-size:clamp(28px,7.6vw,38px);font-weight:800;letter-spacing:-.025em}
h1.big em{font-style:normal;color:var(--lamp)}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
p{margin:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--lamp)}
.pills{display:flex;gap:6px}
.pill{font-family:var(--f-mono);font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.lv{border-color:var(--lamp);color:var(--lamp)}

.plan{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;padding:16px;background:var(--surface);border-radius:var(--r)}
.plan .n{font-family:var(--f-mono);font-size:12px;color:var(--lamp);padding-top:3px}
.plan .t{font-size:15px}
.plan .t b{font-family:var(--f-display);font-weight:700}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:15px 20px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:17px;background:var(--lamp);color:var(--lamp-ink);width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:14px}

.progress{display:flex;gap:4px;margin-bottom:16px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--lamp)}
.progress i.now{background:linear-gradient(90deg,var(--lamp) 50%,var(--line) 50%)}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--lamp);transition:width .25s linear}
.card{background:var(--surface);border-radius:var(--r);padding:20px}
.fact h2{font-size:25px;font-weight:700;letter-spacing:-.015em;margin:10px 0 12px}
.fact p{font-size:17px}
.q h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-top:10px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice{text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1.5px solid transparent;font-size:16px;transition:border-color .15s,background .15s,opacity .15s}
.choice:hover:not([disabled]){border-color:var(--line)}
.choice[disabled]{cursor:default}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface-2))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface-2))}
.choice.dim{opacity:.5}
.choice.gone{opacity:.25;text-decoration:line-through}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:12px;min-height:34px}
.joker{font-family:var(--f-mono);font-size:12px;padding:7px 12px;border-radius:99px;border:1px dashed var(--lamp);color:var(--lamp)}
.combo{font-family:var(--f-mono);font-size:12px;color:var(--lamp)}
.verdict{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.verdict b{font-family:var(--f-display)}
.verdict.ok b{color:var(--good)} .verdict.ko b{color:var(--bad)}
.verdict p{margin-top:6px;font-size:15.5px}
.gain{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}
.gain b{color:var(--lamp);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip.lamp{background:color-mix(in srgb,var(--lamp) 18%,transparent);color:var(--lamp)}
.dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 62% var(--dotl));flex:none;display:inline-block}
.quit{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:6px 0}
.hearts{font-family:var(--f-mono);font-size:13px;color:var(--bad);letter-spacing:2px}
.toast{background:color-mix(in srgb,var(--lamp) 16%,var(--surface));border:1px solid var(--lamp);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.toast b{font-family:var(--f-display);color:var(--lamp)}
/* Passage de niveau */
.lvup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(14,6,28,.55);backdrop-filter:blur(3px);animation:lvFade .25s ease-out}
.lvup.out{animation:lvFadeOut .26s ease-in forwards}
.lv-card{position:relative;width:min(320px,100%);background:linear-gradient(180deg,var(--surface-2),var(--surface));border:2px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--edge),0 24px 60px rgba(0,0,0,.45);padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:lvPop .55s cubic-bezier(.3,1.7,.5,1)}
.lv-rays{position:absolute;left:50%;top:84px;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.28) 0 12deg,transparent 12deg 30deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 9s linear infinite;pointer-events:none}
.lv-badge{position:relative;width:128px;margin-top:-62px;animation:lvBadge .9s .1s cubic-bezier(.3,1.6,.5,1) both}
.lv-badge svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(255,210,63,.55))}
.lv-kicker{position:relative;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2)}
.lv-title{position:relative;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;text-wrap:balance}
.lv-sub{position:relative;color:var(--muted);font-size:15px;margin-bottom:8px}
.lv-ok{position:relative;min-width:150px}
.lv-more{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:-2px 0 8px}
.lv-bits{position:absolute;left:50%;top:84px;width:0;height:0;pointer-events:none}
.lv-bits i{position:absolute;width:9px;height:14px;border-radius:3px;background:var(--c);border:2px solid #2B1D3A;opacity:0;animation:lvBit 1.1s var(--d) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes lvFade{from{opacity:0}}
@keyframes lvFadeOut{to{opacity:0}}
@keyframes lvPop{from{transform:scale(.6) translateY(30px);opacity:0}}
@keyframes lvBadge{from{transform:scale(.2) rotate(-25deg)}}
@keyframes lvBit{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 60px)) rotate(var(--r))}}
.bdup .bd-art{position:relative;z-index:1;margin:-6px 0 4px;animation:bdSpin 1s cubic-bezier(.25,1.4,.5,1) both;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.bdup .bd-art::after{content:"";position:absolute;inset:12%;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);mix-blend-mode:overlay;animation:bdShine 1.4s .9s ease-out both;pointer-events:none}
.bdup .bd-tier{position:relative;z-index:1;margin-top:2px}
@keyframes bdSpin{0%{transform:scale(.2) rotateY(0) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotateY(540deg) rotate(4deg);opacity:1}100%{transform:scale(1) rotateY(720deg) rotate(0)}}
@keyframes bdShine{from{transform:translateX(-80%)}to{transform:translateX(80%)}}
@media (prefers-reduced-motion:reduce){.lvup,.lv-card,.lv-badge,.lv-rays,.lv-bits i,.bd-art,.bd-art::after{animation:none!important}.lv-bits{display:none}}
/* Personnages animés (atelier/toy.js) */
.toyc .fl{animation:tfloat 3.4s ease-in-out infinite}
@keyframes tfloat{50%{transform:translateY(-4px)}}
.toyc .tbreath{animation:tbreath 3.6s ease-in-out infinite;transform-origin:60px 104px}
@keyframes tbreath{50%{transform:scale(1.025,.975)}}
.toyc.t-jelly .tbreath{animation:tjelly 2.4s ease-in-out infinite}
@keyframes tjelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.07,.93)}60%{transform:scale(.96,1.04)}}
.tblink{animation:tblink 4.8s infinite;animation-delay:var(--bd,0s);transform-box:fill-box;transform-origin:center}
@keyframes tblink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.ta-sway{animation:tsway 2.8s ease-in-out infinite alternate}
@keyframes tsway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.ta-wag{animation:twag .45s ease-in-out infinite alternate}
@keyframes twag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.ta-ear{animation:tear 3.2s ease-in-out infinite}
@keyframes tear{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.ta-flap{animation:tflap .16s ease-in-out infinite alternate}
@keyframes tflap{to{transform:scaleY(.72)}}
.ta-wing{animation:twing 3s ease-in-out infinite}
@keyframes twing{0%,70%,100%{transform:rotate(0)}78%,86%{transform:rotate(-10deg)}82%{transform:rotate(4deg)}}
.ta-pulse{animation:tpulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tpulse{50%{opacity:.1;transform:scale(.86)}}
.ta-flick{animation:tflick .32s ease-in-out infinite alternate}
@keyframes tflick{to{transform:scale(.92,1.07) skewX(3deg)}}
.ta-ember{animation:tember 2.2s ease-out infinite}
@keyframes tember{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.ta-rain{animation:train 1.15s linear infinite}
@keyframes train{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(17px);opacity:0}}
.ta-spike{animation:tspike 2.6s ease-in-out infinite}
@keyframes tspike{50%{transform:scale(1.06) rotate(5deg)}}
.ta-twinkle{animation:ttw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ttw{50%{transform:scale(.3);opacity:.3}}
.ta-look{animation:tlook 5.2s ease-in-out infinite}
@keyframes tlook{0%,18%{transform:translateX(0)}28%,44%{transform:translateX(-2.6px)}54%,70%{transform:translate(2.6px,1px)}80%,100%{transform:translateX(0)}}
.ta-spore{animation:tspore 3.2s ease-out infinite}
@keyframes tspore{0%{transform:translateY(6px) scale(.5);opacity:0}25%{opacity:.95}100%{transform:translateY(-22px) scale(1.1);opacity:0}}
.toyc.t-beat .tbreath{animation:tbeat 1.3s ease-in-out infinite}
@keyframes tbeat{0%,40%,100%{transform:scale(1)}10%,30%{transform:scale(1.07)}20%{transform:scale(1.02)}}
.toyc.t-bounce .tbreath{animation:tbounce 1.6s cubic-bezier(.3,0,.5,1) infinite}
@keyframes tbounce{0%,100%{transform:translateY(0) scale(1.04,.96)}12%{transform:translateY(0) scale(.97,1.03)}50%{transform:translateY(-12px) scale(1)}}
.ta-globe{animation:tglobe 7s linear infinite}
@keyframes tglobe{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.ta-bubble{animation:tbubble 2.4s ease-in infinite}
.ta-snow{animation:tsnow 3.4s linear infinite}
@keyframes tsnow{0%{transform:translateY(-6px);opacity:0}15%{opacity:1}100%{transform:translate(4px,40px);opacity:0}}
.ta-dribble{animation:tdribble .9s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes tdribble{to{transform:translateY(-14px)}}
@keyframes tbubble{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.ta-blinkb{animation:tblinkb 1.4s steps(2,jump-none) infinite}
@keyframes tblinkb{50%{opacity:.35}}
.ta-pulse2{animation:tpulse2 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tpulse2{50%{transform:scale(1.15)}}
.ta-pop{animation:tpop 2.2s ease-out infinite}
@keyframes tpop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-12px) rotate(20deg)}}
.ta-drip{animation:tdrip 2.6s ease-in infinite}
@keyframes tdrip{0%,40%{transform:translateY(-8px);opacity:0}50%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.ta-coin{animation:tcoin 2.8s ease-in infinite}
@keyframes tcoin{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}55%{transform:translateY(18px);opacity:1}62%,100%{transform:translateY(20px);opacity:0}}
.ta-rays{animation:spin 14s linear infinite}
.ta-propel{animation:tprop .35s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tprop{50%{transform:scaleX(-1)}}
.ta-float2{animation:tfloat 2.6s ease-in-out infinite}
/* Somni : reste éveillé un moment, pique du nez, puis s'endort avec des zzz */
.so-open{animation:soOpen 11s infinite}
.so-closed,.so-zzz{opacity:0;animation:soSleep 11s infinite}
@keyframes soOpen{0%,50%{opacity:1}53%,94%{opacity:0}97%,100%{opacity:1}}
@keyframes soSleep{0%,50%{opacity:0}53%,94%{opacity:1}97%,100%{opacity:0}}
.so-z{animation:soZ 2.4s ease-out infinite;font-family:var(--f-display);font-weight:800}
@keyframes soZ{0%{transform:translate(0,4px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(-8px,-20px) scale(1.15);opacity:0}}
.so-head{animation:soNod 11s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes soNod{0%,50%{transform:rotate(0)}56%,92%{transform:rotate(-5deg) translateY(2px)}97%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.toyc *,.toyc .fl,.toyc .tbreath{animation:none!important}.so-closed,.so-zzz{opacity:0}.so-open{opacity:1}}

.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--lamp);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr;gap:10px}
.item .mk{font-family:var(--f-mono);font-size:13px;padding-top:2px}
.mk.ok{color:var(--good)} .mk.ko{color:var(--bad)} .mk.f{color:var(--lamp)}
.item b{font-family:var(--f-display);font-weight:700;font-size:15.5px;display:block}
.item span{font-size:14.5px;color:var(--muted);display:block}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent;min-width:0}
.mode:hover{border-color:var(--line)}
.mode h3{font-size:18px;font-weight:700}
.mode p{font-size:14px;color:var(--muted);line-height:1.4}
.mode .label{margin-top:auto;padding-top:6px}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.5;cursor:default}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme{text-align:left;background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent;min-width:0}
.theme:hover{border-color:var(--line)}
.theme.today{border-color:var(--lamp)}
.theme b{font-family:var(--f-display);font-size:15.5px;line-height:1.2}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lamp)}

.avap{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--surface);border-radius:var(--r);padding:18px 18px 16px}
.ev .yr{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--lamp);font-variant-numeric:tabular-nums;line-height:1}
.ev .yr.hid{color:var(--muted)}
.ev h2{font-size:19px;font-weight:700;margin-top:8px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yearq{display:flex;flex-direction:column;gap:10px}
.yrow{display:flex;gap:10px;align-items:stretch}
.yin{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.yin:focus{outline:3px solid var(--accent2);outline-offset:1px}

.filters{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px;margin:0 -4px}
.filters button{flex:none;font-family:var(--f-mono);font-size:12px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.entry{padding:16px 0;border-bottom:1px solid var(--line)}
.entry .q{font-family:var(--f-display);font-weight:700;font-size:16px;margin:6px 0 4px}
.entry .a{color:var(--lamp);font-weight:600;font-size:15px}
.entry p{margin-top:6px;font-size:14.5px;color:var(--muted)}
.empty{padding:28px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}

.acct{background:var(--surface);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lamp) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 12px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tl{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow .nm{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;min-width:0}
.trow .lv{font-family:var(--f-mono);font-size:12px;color:var(--lamp);text-align:right;white-space:nowrap}
.trow .meter{grid-column:1/-1;height:6px}
.trow .sub{grid-column:1/-1;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
.tabs nav{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:620px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}

.tabs button[aria-current="page"]{color:var(--lamp)}
.fade{animation:fade .26s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn,.timer i{transition:none}}

/* --- v4 : profil, accueil, maison, badges --- */
.who{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:16px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who svg{flex:none;background:var(--surface);border-radius:50%;padding:2px}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE7A0,#F2B83B 60%,#C98A1B);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);flex:none;vertical-align:-1px}
.pill.coins{display:inline-flex;align-items:center;gap:6px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea.field{resize:none;font-family:var(--f-mono);font-size:13px}
.err{color:var(--bad);font-size:14.5px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.av{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:14px;background:var(--surface);border:2px solid transparent;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.av[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp);background:color-mix(in srgb,var(--lamp) 10%,var(--surface))}
.av svg{transition:transform .15s}
.av:hover svg,.av[aria-pressed="true"] svg{transform:translateY(-3px) rotate(-3deg)}
.me{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.me-av{width:84px;height:84px;border-radius:24px;background:var(--surface);display:grid;place-items:center}
.me-name{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--lamp) 22%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--lamp) 45%,transparent);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--lamp)}
.hero .btn.small{align-self:flex-start}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode.hl{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 10%,var(--surface))}
/* Anecdotes, missions, carnet */
.anec{margin-top:10px!important;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--lamp) 10%,transparent);border-left:3px solid var(--lamp);color:var(--fg)!important;font-size:14.5px!important}
.anec b{color:var(--lamp)!important;font-family:var(--f-display)}
.mis{gap:12px}
.mrow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.mrow .mk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
.mrow .mk.ok{background:var(--good);border-color:var(--good);color:var(--bg)}
.mrow.done>div span{color:var(--muted);text-decoration:line-through}
.rescue{border:1.5px solid var(--lamp)}
.rescue b{font-family:var(--f-display);font-size:16px}
.nbhead{display:flex;align-items:baseline;gap:10px}
.nbhead b{font-family:var(--f-display);font-size:34px;color:var(--lamp)}
.nbhead span{color:var(--muted)}
.nbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nbk{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px 12px 12px 22px;border-radius:6px 14px 14px 6px;background:linear-gradient(135deg,hsl(var(--h) 45% 30%),hsl(var(--h) 40% 22%));color:#fff;min-height:110px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.nbk .spine{position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:6px 0 0 6px;background:hsl(var(--h) 50% 18%)}
.nbk b{font-family:var(--f-display);font-size:15px;line-height:1.2}
.nbk .label{color:rgba(255,255,255,.75)}
.nbk .meter{background:rgba(255,255,255,.18)}
.nbk:disabled{opacity:.35}
.nbt{font-family:var(--f-display);font-size:20px;display:flex;align-items:center;gap:8px}
.entry{border-left:3px solid hsl(var(--h,40) 60% 55%);padding-left:12px}
.entry.todo{opacity:.8}
/* Images, accessoires */
.pic{display:grid;place-items:center;min-height:170px;margin:12px 0 2px;border-radius:14px;background:var(--surface-2);padding:16px}
.pic.sm{min-height:0;padding:10px;margin:8px 0;justify-items:start;background:none}
.pic .flag{width:min(240px,100%);height:auto;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.15)}
.pic.sm .flag{width:96px;border-radius:4px}
.shape path{fill:var(--lamp);stroke:color-mix(in srgb,var(--lamp) 60%,#000);stroke-width:.8;stroke-linejoin:round}
.choices.flags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.flags .choice{display:grid;place-items:center;padding:10px}
.choices.flags .choice svg{width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.atw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg.s5{grid-template-columns:repeat(5,1fr)}
.seg.s5 button{font-size:9.5px;padding:9px 1px}
/* Titres sous le pseudo : plaque nette, majuscules, dégradé propre à chaque titre */
.ttl{display:inline-block;align-self:flex-start;max-width:100%;padding:2px 9px 2.5px;border-radius:7px;background:linear-gradient(180deg,var(--ta),var(--tb));color:var(--tf);font:800 10.5px/1.35 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1.5px solid rgba(43,29,58,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 rgba(43,29,58,.35);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.ttl.sm{font-size:9.5px;padding:1px 7px 1.5px}
.ttl.xs{font-size:8.5px;padding:1px 6px;border-radius:6px;letter-spacing:.07em}
.ttl.lg{font-size:13px;padding:5px 12px 5.5px;border-radius:9px}
.ttl.loser{animation:ttlWob 2.4s ease-in-out infinite}
@keyframes ttlWob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.ttl.loser{animation:none}}
.who-n{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.ttl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ttl-row:last-child{border-bottom:0}
.ttl-row .btn{width:auto;flex:none}
.am-f .ttl{align-self:center}
.sl-seat .ttl{display:block;margin:2px auto 0;width:max-content;max-width:94px}
.sl-pcol .ttl{align-self:center}
.seg.s4 button{font-size:10.5px;padding:9px 2px}
.dress-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.dress-prev{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--lamp) 22%,var(--surface-2)),var(--surface) 70%)}
@media (max-width:420px){.dress-top{grid-template-columns:1fr;justify-items:center;text-align:center}}
.sk.locked svg{filter:grayscale(.9) opacity(.55)}
/* Boutique et collection */
.seg.s3{grid-template-columns:repeat(3,1fr)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.skgrid.one{grid-template-columns:1fr}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:0}
.sk b{font-family:var(--f-display);font-size:15.5px}
.sk .muted{font-size:12.5px;line-height:1.3}
.sk .chip{font-size:11px}
.sk.own{border-color:color-mix(in srgb,var(--lamp) 35%,var(--line))}
.sk.secret{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--lamp) 18%,var(--surface)),var(--surface) 70%)}
.sk.ultra{border:1.5px solid var(--lamp);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--lamp) 26%,var(--surface)),var(--surface) 75%)}
.sk.lock .sil svg{filter:brightness(0) drop-shadow(0 0 1px rgba(255,255,255,.18));opacity:.92}
.sk.lock .sil svg *{animation:none!important}
.sk.lock.ultra .sil svg{filter:brightness(0) drop-shadow(0 0 6px color-mix(in srgb,var(--lamp) 70%,transparent))}
.sk .pad{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.sk.ultra .pad{border-color:var(--lamp)}
.sk .pad svg{width:17px;height:17px;fill:none;stroke:var(--lamp);stroke-width:2;stroke-linecap:round}
.sk.lock b{letter-spacing:.12em;color:var(--muted)}
.toast .sec{display:flex;align-items:center;gap:10px}
.toast .sec svg{flex:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border-radius:12px}
.seg button{padding:9px 4px;border-radius:9px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.scene-wrap{border-radius:18px;overflow:hidden;border:2px solid #2B2340;background:#8FD0F5}
.scene{display:block;width:100%;height:auto}
.scene .room{cursor:pointer}
.sc-t{font-family:var(--f-display);font-weight:800;font-size:14px;fill:#2B2340}
.sc-p{font-family:var(--f-mono);font-size:11px;fill:#2B2340}
.rt{font-family:var(--f-display);font-size:18px}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.shop b{font-family:var(--f-display);font-size:15.5px}
.shop svg{background:var(--surface-2);border-radius:10px;padding:2px}
.shop.own{opacity:.7}
.shop .btn.small{gap:6px;min-width:76px}
.btn[disabled]{opacity:.45;cursor:default}
.badge{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.badge b{font-family:var(--f-display);font-size:15px}
.badge .label{white-space:nowrap;font-size:10.5px}
.medal{width:28px;height:28px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--lamp-ink);font-size:14px}
.badge.own .medal{border:0;background:radial-gradient(circle at 35% 35%,#FFE7A0,#F2B83B 60%,#C98A1B)}
.pip{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 4px;margin-left:4px;border-radius:6px;border:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.pip.on{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.tabs[hidden]{display:none!important}

[hidden]{display:none!important}
.seg{grid-template-columns:repeat(5,1fr)!important}.seg button{font-size:10.5px!important;padding:9px 2px!important}
.about{all:unset;cursor:default;color:var(--muted);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.admin{border:1.5px dashed var(--lamp)}
/* --- Lumen : médailles --- */
.bdg{overflow:visible}
.bdg .spin{animation:spin 14s linear infinite;transform-origin:100px 100px}
.bdg .spin.slow{animation-duration:40s}
.bdg .pulse{animation:pulse 2.6s ease-in-out infinite;transform-origin:100px 100px}
.bdg .flick{animation:flick .9s ease-in-out infinite alternate;transform-origin:100px 100px}
.bdg .flick.d2{animation-duration:.7s;animation-delay:-.3s}
.bdg .tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bdg .ember{animation:ember 2.4s ease-in infinite}
.bdg .d2{animation-delay:-.8s}.bdg .d3{animation-delay:-1.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:.75;transform:scale(1.04)}}
@keyframes flick{from{transform:scale(1) rotate(0)}to{transform:scale(1.04) rotate(2deg)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes ember{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 6px;align-items:end}
.bt{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.bt b{font-family:var(--f-display);font-size:13px;line-height:1.2}
.bt span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.bt .bc{display:inline-flex;gap:4px;align-items:center}
.bt.lock svg{filter:grayscale(1) brightness(.75);opacity:.45}
.bt.lock svg *{animation:none!important}
details.tb summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}
details.tb summary::-webkit-details-marker{display:none}
details.tb summary .nm{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700}
details.tb[open] summary{margin-bottom:12px}
.nextb{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.nb-m{width:76px;display:grid;place-items:center}
.av svg{transition:transform .15s}
.av{padding:6px 2px 8px}
.me-av svg,.who svg{background:none}
.who svg{width:38px;height:auto}
/* ---------- Casino : jeux (ex-parc), décor de taverne ---------- */
#casino .coin{display:inline-block;width:13px;height:13px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#FFE7A0,#F2B83B 60%,#C98A1B);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#casino .muted{color:#D8C8D8;font-size:14px;margin:0;line-height:1.45}
#casino .label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#D8C8D8}
#casino .betbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px}
#casino .betbar > button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);font-size:18px;font-weight:800}
#casino .betv{display:inline-flex;gap:6px;align-items:center;font-size:20px;min-width:70px;justify-content:center}
#casino .chips{display:flex;gap:6px;margin-left:auto}
#casino .chips button{border-radius:99px;border:2px dashed rgba(255,255,255,.4);background:#5A1A2A;padding:5px 9px;font-family:var(--f-mono);font-size:12px}
#casino .chips button[aria-pressed="true"]{border-color:#FFE36A;background:#8A2A3A}
#casino .go{background:linear-gradient(180deg,#FFE36A,#E0A21A);color:#3A1A04;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:17px}
#casino .gmsg{min-height:22px;margin:0;font-weight:700;color:#FFE36A;text-align:center}
#casino .pickrow{display:flex;gap:10px}
#casino .pick{flex:1;border-radius:12px;padding:12px;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08)}
#casino .pick.red{background:#C8202E}
#casino .pick.black{background:#151018}
#casino .pick[aria-pressed="true"]{border-color:#FFE36A;box-shadow:0 0 0 3px rgba(255,227,106,.3)}
#casino .roul-num{align-self:center;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;background:#3A2A30;border:4px solid #E0B040}
#casino .roul-num.r{background:#C8202E}
#casino .roul-num.b{background:#151018}
#casino .roul-num.g{background:#1E8A4A}
#casino .table-felt{background:radial-gradient(ellipse at 50% 30%,#2A8A5A,#145A36);border:3px solid #8A5A2A;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px}
#casino .hand{display:flex;flex-direction:column;gap:6px}
#casino .cards{display:flex;gap:6px;flex-wrap:wrap;min-height:70px}
#casino .card{width:48px;height:68px;border-radius:7px;background:#FFFDF8;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:deal .25s ease-out}
#casino .card b{font-size:18px;line-height:1}
#casino .card i{font-style:normal;font-size:20px;line-height:1.1}
#casino .card.back{background:repeating-linear-gradient(45deg,#8A1E2A 0 6px,#A82838 6px 12px);border:2px solid #FFFDF8}
#casino .card.ghost{background:rgba(255,255,255,.1);box-shadow:none;border:1.5px dashed rgba(255,255,255,.35);animation:none}
#casino .track{position:relative;background:#3E8A3A;border:3px solid #E0B040;border-radius:12px;padding:4px 0;overflow:hidden}
#casino .lane{position:relative;height:42px;border-bottom:1px dashed rgba(255,255,255,.25)}
#casino .lane:nth-child(odd){background:rgba(255,255,255,.06)}
#casino .hname{position:absolute;right:30px;top:12px;font-family:var(--f-mono);font-size:10.5px;color:rgba(255,255,255,.7)}
#casino .horse{position:absolute;top:4px;transition:none}
#casino .finish{position:absolute;right:20px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(0deg,#fff 0 6px,#111 6px 12px)}
#casino .horses{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
#casino .hpick{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;padding:7px 4px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);font-size:13px;font-weight:700}
#casino .hpick i{width:14px;height:14px;border-radius:50%}
#casino .hpick span{font-family:var(--f-mono);font-size:12px;color:#FFE36A}
#casino .hpick[aria-pressed="true"]{border-color:#FFE36A}
@keyframes deal{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
/* Lancement */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#6A2E5E 0%,#3A1640 50%,#170A1E 100%);transition:opacity .7s ease}
.emb{position:relative;width:108px;height:108px;border-radius:26px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 40px rgba(255,170,80,.35);opacity:0;transform:scale(.4) rotate(-12deg);animation:emb .7s .15s cubic-bezier(.25,1.6,.45,1) forwards}
.emb svg{width:100%;height:100%;display:block}
@keyframes emb{to{opacity:1;transform:none}}
#splash.out{opacity:0;pointer-events:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px;text-align:center}
.halo{position:absolute;width:340px;height:340px;max-width:90vw;max-height:90vw;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55),rgba(255,180,70,.12) 45%,transparent 70%);animation:halo 2.2s ease-out both}

.logo{position:relative;font-size:clamp(56px,16vw,96px);font-weight:800;letter-spacing:-.04em;color:#FFF3D6;text-shadow:0 0 28px rgba(255,200,100,.65)}

.cp-d{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:6px;border-top:1px solid rgba(255,255,255,.08)}
.cp-rk svg{width:72px;height:72px;margin:-4px;display:block}
.cp-rk.off svg{filter:grayscale(1) brightness(.6);opacity:.4}
.cp-rk.win{filter:drop-shadow(0 0 8px rgba(255,210,63,.7))}
.cp-dn{display:flex;flex-direction:column;align-items:center;text-align:center;font:800 13.5px var(--f-display)}.cp-dn small{font:600 11px var(--f-mono,"IBM Plex Mono",monospace);color:#C8B8E8}
.who .hav,.who .hpr,.who .hlv{overflow:visible}
.hpr{position:absolute;left:-9px;bottom:-8px;width:30px;height:30px;pointer-events:none}
.hpr svg{width:100%;height:100%;display:block}
.pr-card{position:relative;display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;padding:14px 18px 14px 8px;border-radius:var(--r);background:linear-gradient(#2A1850,#160A2C);color:#fff;border:3px solid #2B1D3A;box-shadow:0 4px 0 var(--edge);overflow:hidden}
.pr-card .label{color:#FFE58A}.pr-card .muted{color:#D8C8F0}
.pr-emb svg{width:132px;height:132px;display:block}
.pr-name{font-family:var(--f-display);font-size:22px;line-height:1.1}
.pr-lv{font-family:var(--f-display);font-weight:800;font-size:16px;color:#FFE58A}
.pr-card.legend{background:radial-gradient(circle at 20% 40%,#2A2A3A,#000 75%);border-color:#E8F4FF;box-shadow:0 0 26px rgba(232,244,255,.25),0 4px 0 #000}
.pr-card.legend .pr-lv,.pr-card.legend .label{color:#F4FAFF;text-shadow:0 0 8px rgba(232,244,255,.6)}
.pm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.pm-dom{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}
.pm-dom svg{width:122%;max-width:none;height:auto;display:block;margin:-6% -11% -4%}
.pm-dom b{font-size:12.5px;line-height:1.15;font-family:var(--f-display)}
.pm-dom span{font:600 11px var(--f-mono,"IBM Plex Mono",monospace);color:var(--muted)}
.pm-dom small{display:none}
.pm-dom.off svg{filter:grayscale(1) brightness(.7);opacity:.45}
@media (max-width:420px){.pm-grid{grid-template-columns:repeat(4,1fr)}.pr-card{grid-template-columns:104px 1fr}.pr-emb svg{width:104px;height:104px}}
.lv-badge.lv-pres{width:190px;margin-top:-96px}
.lv-badge.lv-pres svg{filter:none}
.who{gap:12px;font-size:17px}
.who>span:last-child{font-weight:800}
.pills{gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:15px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--surface);border:0;box-shadow:0 3px 0 var(--edge)}
.pill.streak .gi{width:22px;height:22px}
.pill.streak.off{opacity:.55}
.pill.coins{padding-right:5px;color:var(--fg)}
.bigcoin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4C0 0 18%,#FFD045 40%,#E8A21A 75%,#B8780C);box-shadow:inset 0 0 0 1.5px #8A5A08,inset 0 -2px 0 rgba(0,0,0,.18);flex:none}
.plus{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:16px;line-height:1;box-shadow:0 2px 0 color-mix(in srgb,var(--good) 60%,#000)}
/* Barre d'onglets façon jeu */
.tabs{background:transparent;border-top:0;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tabs nav{background:var(--surface);border-radius:24px;padding:6px;box-shadow:0 -2px 0 var(--line) inset,0 6px 0 var(--edge),0 10px 30px rgba(0,0,0,.25);gap:2px}
.tabs button{border-radius:18px;padding:6px 2px 6px;gap:2px;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:0;transition:background .15s}
.tabs .ti{position:relative;display:grid;place-items:center;height:42px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tabs .ti svg.gi{width:42px!important;height:42px!important;overflow:visible;filter:saturate(.8)}
.tabs .ti>svg:not(.gi){width:36px;height:auto;filter:saturate(.8)}
.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--lamp) 20%,var(--surface-2));color:var(--lamp)}
.tabs button[aria-current="page"] .ti{transform:translateY(-10px) scale(1.14)}
.tabs button[aria-current="page"] .ti .gi,.tabs button[aria-current="page"] .ti>svg{filter:none}
.app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
/* Tuiles de modes avec grande icône */
.mode{position:relative;padding:14px 14px 14px;gap:4px;border-radius:var(--r);transition:transform .08s,box-shadow .08s}
.mode:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mode .mi{display:block;margin-bottom:4px}
.mode .mi .gi{width:46px;height:46px;transition:transform .2s}
.mode:hover:not([disabled]) .mi .gi{transform:rotate(-6deg) scale(1.06)}
.mode.wide{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.mode.wide .mi{grid-row:span 3;margin:0}
.mode.wide .mi .gi{width:54px;height:54px}
.mode.hl{box-shadow:0 4px 0 var(--press)}
/* Thèmes avec pictogramme */
.thi{display:inline-grid;place-items:center;flex:none;border-radius:30%;background:linear-gradient(160deg,hsl(var(--h) 70% 62%),hsl(var(--h) 62% 44%));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3),0 2px 0 hsl(var(--h) 50% 28%)}
.thi svg{width:62%;height:62%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.theme{border-radius:18px;padding:12px;gap:6px;transition:transform .08s,box-shadow .08s}
.theme:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.theme.today{box-shadow:0 4px 0 var(--press)}
.meter{height:7px;border-radius:4px;background:color-mix(in srgb,var(--line) 80%,transparent)}
.meter i{border-radius:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--lamp) 70%,#fff),var(--lamp))}
/* Défi du jour */
.hero{position:relative;overflow:hidden;border-radius:24px;box-shadow:0 5px 0 var(--press)}
.hero-ic{position:absolute;right:14px;top:14px;transform:rotate(8deg)}
.hero h2,.hero>.label{padding-right:72px}
/* Segments avec icônes */
.seg.gseg{border-radius:18px;padding:5px;gap:4px;box-shadow:0 3px 0 var(--edge)}
.seg.gseg button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:13px;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:0}
.seg.gseg button .gi{filter:saturate(.3) opacity(.7);transition:transform .2s}
.seg.gseg button[aria-pressed="true"]{background:var(--surface-2);box-shadow:0 2px 0 var(--edge)}
.seg.gseg button[aria-pressed="true"] .gi{filter:none;transform:scale(1.12)}
/* Questions */
.q h2{font-size:22px}
.choices{counter-reset:ch}
.choice{position:relative;padding:15px 16px 15px 54px;border-radius:16px;background:var(--surface-2);border:2px solid transparent;box-shadow:0 4px 0 var(--edge);font-family:var(--f-display);font-weight:600;font-size:16.5px;transition:transform .08s,box-shadow .08s,border-color .15s,background .15s}
.choice::before{counter-increment:ch;content:counter(ch,upper-alpha);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--muted);font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--edge)}
.choice:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.choice.right{box-shadow:0 4px 0 color-mix(in srgb,var(--good) 55%,#000);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.choice.right::before{content:"✓";background:var(--good);color:#fff}
.choice.wrong{box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000);animation:shake .4s}
.choice.wrong::before{content:"✗";background:var(--bad);color:#fff}
.choices.flags .choice{padding:10px}
.choices.flags .choice::before{display:none}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.joker{display:inline-flex;align-items:center;gap:6px;border:0;background:color-mix(in srgb,#8A6AF2 18%,var(--surface-2));color:var(--fg);font-family:var(--f-display);font-weight:700;padding:5px 12px 5px 6px;box-shadow:0 3px 0 var(--edge)}
.combo{font-family:var(--f-display);font-weight:800;font-size:14px;padding:4px 10px;border-radius:99px;background:linear-gradient(90deg,#FF8A2A,#FFD045);color:#3A1A00;animation:pop .4s}
.progress{gap:5px}
.progress i{height:8px;border-radius:4px}
.timer{height:10px;border-radius:5px}
.timer i{background:linear-gradient(90deg,#FFD045,var(--lamp))}
.hearts{font-size:22px;letter-spacing:3px}
.verdict{border-radius:16px;border-width:2px;animation:fade .25s both}
.verdict.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.verdict.ko{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.verdict b{font-size:18px}
.gain b{display:inline-block;animation:rise .6s cubic-bezier(.3,1.6,.5,1) both;font-family:var(--f-display);font-weight:800;font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}
.score{text-shadow:0 4px 0 var(--press)}
/* Toasts façon récompense */
.toast{border-width:2px;border-radius:16px;box-shadow:0 4px 0 var(--press);animation:toast .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes toast{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
/* Missions */
.mrow .mk{width:26px;height:26px;border-width:2px}
@media (prefers-reduced-motion:reduce){.choice.right,.choice.wrong,.toast,.gain b,.combo{animation:none}}

/* Citations, mot du jour, succès, difficulté */
.qlab{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp);margin-top:12px}
.quote{margin:8px 0 0;padding:14px 16px;border-left:4px solid var(--lamp);border-radius:12px;background:color-mix(in srgb,var(--lamp) 8%,var(--surface-2));font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.35}
.motj .mot{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--lamp)}
.motj p{font-size:15.5px}
.motj .btn{align-self:flex-start}
.succgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.succ{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:14px;background:var(--surface-2);box-shadow:0 3px 0 var(--edge)}
.succ b{font-family:var(--f-display);font-size:14px}
.succ span{font-size:12px;color:var(--muted);line-height:1.3}
.succ:not(.own){opacity:.7}
.succ:not(.own) b{letter-spacing:.15em}
.succ.own{background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--lamp) 22%,var(--surface-2)),var(--surface-2) 70%)}
.succ-ic{flex:none}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.diff button span{font-size:14px}
.seg.diff button small{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:500}
/* ---------- Look Bonbon : onglets en relief animés (validé) ---------- */
.tabs .ti>svg{position:relative;z-index:1}
.tabs .glow{position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--lamp) 55%,transparent),transparent);opacity:0;transform:scale(.5);transition:.35s;pointer-events:none}
.tabs button[aria-current="page"] .glow{opacity:1;transform:scale(1)}
.tabs button[aria-current="page"]{background:transparent;color:var(--fg);position:relative}
.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:2px;left:50%;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:var(--lamp)}
.tabs button[aria-current="page"] .ti svg{filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
svg.g3 g,svg.g3 path,svg.g3 circle{transform-box:fill-box}
svg.g3 .smoke circle,svg.g3 .pop{opacity:0}
@keyframes g3squash{0%{transform:none}18%{transform:scale(1.18,.8) translateY(4px)}42%{transform:scale(.9,1.16) translateY(-12px)}68%{transform:scale(1.06,.95)}100%{transform:none}}
@keyframes g3wiggle{0%{transform:none}15%{transform:rotate(-16deg) scale(1.12)}30%{transform:rotate(14deg) scale(1.12)}45%{transform:rotate(-10deg) scale(1.08)}60%{transform:rotate(7deg)}80%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes g3spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes g3puff{0%{opacity:0;transform:translateY(4px) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1.5)}}
@keyframes g3coin{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}60%{transform:translateY(-26px) scale(1.1)}100%{opacity:0;transform:translateY(-34px)}}
@keyframes g3wave{0%,100%{transform:rotate(0)}20%{transform:rotate(-30deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-30deg)}80%{transform:rotate(5deg)}}
.tabs button.tap .ti>svg{animation:g3squash .6s cubic-bezier(.3,1.4,.5,1)}
.tabs button.tap[data-k="play"] .ti>svg{animation:g3wiggle .7s ease-out}
.tabs button.tap[data-k="parc"] .wheel{animation:g3spin .9s cubic-bezier(.2,.8,.3,1);transform-origin:50% 50%}
.tabs button.tap[data-k="home"] .smoke circle{animation:g3puff .9s ease-out}
.tabs button.tap[data-k="home"] .smoke circle:nth-child(2){animation-delay:.18s}
.tabs button.tap[data-k="home"] .smoke circle:nth-child(3){animation-delay:.34s}
.tabs button.tap[data-k="shop"] .pop{animation:g3coin .8s ease-out;transform-origin:50% 50%}
.tabs button.tap[data-k="user"] .arm{animation:g3wave .8s ease-in-out;transform-origin:0% 100%}
.fx-spark{position:fixed;pointer-events:none;z-index:60;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:fxspark .65s ease-out forwards}
@keyframes fxspark{0%{transform:translate(-50%,-50%) scale(.2) rotate(0)}40%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(180deg);opacity:0}}
.fx-ring{position:fixed;width:20px;height:20px;border-radius:50%;border:3px solid var(--lamp);pointer-events:none;z-index:59;animation:fxring .5s ease-out forwards}
@keyframes fxring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
.mode .mi svg.g3,.mode svg.g3{overflow:visible}
@media (prefers-reduced-motion:reduce){.tabs button.tap *,.fx-spark,.fx-ring{animation:none!important}.fx-spark,.fx-ring{display:none}}
/* Ambiance stressante (Survie dernière vie, fin de Chrono) */
body.stress::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 90px 16px rgba(255,40,70,.62);animation:stressPulse var(--stress,1s) ease-in-out infinite}
@keyframes stressPulse{50%{box-shadow:inset 0 0 30px 2px rgba(255,40,70,.18)}}
@media (prefers-reduced-motion:reduce){body.stress::after{animation:none}}
/* Le Portail (événement surprise) */
/* Portail : une faille rouge, ténébreuse et dangereuse (refonte demandée par Erwan, novembre 2026) */
.portal-ic{flex:none;position:relative;width:44px;height:44px;border-radius:50%;isolation:isolate}
.portal-ic::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#1A0002,#E0102A 12%,#2A0004 24%,#FF3A3A 36%,#120001 50%,#B8001A 64%,#2A0004 76%,#FF2030 88%,#1A0002);
  -webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 68%,transparent 72%);mask:radial-gradient(circle,transparent 30%,#000 32%,#000 68%,transparent 72%);animation:portalSpin 3s linear infinite;filter:blur(.4px)}
.portal-ic::after{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,#FFF0F2 0,#FF8A9A 18%,#E0102A 38%,#5A0008 62%,#0A0002 78%);box-shadow:0 0 18px 6px rgba(255,20,40,.75),0 0 40px 10px rgba(160,0,20,.45);animation:portalCore 1.8s ease-in-out infinite}
.portal-ic.big{width:62px;height:62px}
@keyframes portalSpin{to{transform:rotate(360deg)}}
@keyframes portalCore{50%{transform:scale(1.12);box-shadow:0 0 26px 9px rgba(255,30,50,.9),0 0 56px 14px rgba(160,0,20,.55)}}
.am-inv.portal{background:linear-gradient(160deg,#1E0408,#070103);color:#F6E2E4;border-color:#8A0A18;box-shadow:0 0 0 2px rgba(255,30,50,.35),0 0 34px rgba(200,0,30,.45),0 10px 30px rgba(0,0,0,.6)}
.am-inv.portal .am-x{color:#F6E2E4}
.portal-card{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;min-height:104px;padding:16px;border-radius:18px;border:2px solid #6A0A14;color:#F8E6E8;text-align:left;
  background:radial-gradient(90px 90px at 46px 50%,rgba(255,40,60,.55),transparent 70%),radial-gradient(120% 140% at 0% 100%,#3A0008,transparent 60%),linear-gradient(180deg,#160306,#050102 85%);
  box-shadow:0 4px 0 #2A0006,0 0 26px rgba(200,10,30,.35);animation:portalDanger 2.6s ease-in-out infinite}
@keyframes portalDanger{50%{box-shadow:0 4px 0 #2A0006,0 0 38px rgba(255,20,40,.6)}}
.portal-card b{font:800 17px var(--f-display);color:#FFE8EA;text-shadow:0 0 12px rgba(255,40,60,.7)}
.portal-card span span{font-size:13.5px;color:#E2B4BA;opacity:1}
.portal-card:active{transform:translateY(3px);box-shadow:0 1px 0 #2A0006}
.portal-card .portal-figs{position:absolute;left:18px;bottom:6px;z-index:2;pointer-events:none}
.portal-card .portal-ember{position:absolute;bottom:-4px;width:3px;height:3px;border-radius:50%;background:#FF4A5A;box-shadow:0 0 6px #FF2030;animation:portalEmber 3.2s linear infinite;opacity:0}
@keyframes portalEmber{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(8px,-110px);opacity:0}}
.portal-card .portal-ic{z-index:1}
/* Écran de jeu du portail : tout passe en noir et rouge sang */
body.in-portal{--surface:#1A060A;--surface-2:#2A0A10;--ink:#F6E6E8;--muted:#C8969E;--line:#5A1420;--lamp:#FF3A4A;--lamp-ink:#fff;color:#F6E6E8;
  background:radial-gradient(120% 55% at 50% 0%,#6A0012,#160306 55%,#050102) fixed!important}
body.in-portal .card{background:linear-gradient(180deg,#1E070C,#12030A);border-color:#5A1420;box-shadow:0 4px 0 #2A0006,0 0 22px rgba(160,0,20,.25)}
body.in-portal .choice{background:#22080E;color:#F6E6E8;border-color:#6A1A26}
body.in-portal .tabs,body.in-portal .top{background:rgba(10,2,4,.85)}
body.in-portal .pill{color:#F6E6E8;background:#22080E;border-color:#5A1420}
.am-inv.portal .btn:not(.ghost){background:linear-gradient(#E0102A,#8A0010);color:#fff;box-shadow:0 4px 0 #3A0006}
.am-inv.portal .btn.ghost{background:transparent;color:#F6E2E4;border-color:#8A0A18}
@media (prefers-reduced-motion:reduce){.portal-ic::before,.portal-ic::after,.portal-card,.portal-ember{animation:none!important}}
/* Mode en ligne : onglet JcJ (amis.js) */
.am-trophy{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;color:inherit;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 4px}
.am-trophy svg{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}.am-trophy:active svg{transform:scale(.9)}
.am-modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.am-mode{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:inherit;box-shadow:0 3px 0 var(--line);margin-bottom:3px}
.am-mode svg{grid-row:1/3}.am-mode b{font-size:14px;line-height:1.15}.am-mode span{font-size:11.5px;opacity:.75;line-height:1.2}
.am-mode:last-child:nth-child(odd){grid-column:1/3}
.am-mode.on,.am-th.on{border-color:var(--lamp);background:var(--glow);box-shadow:0 3px 0 var(--lamp)}
.am-mode:active,.am-th:active{transform:translateY(3px);box-shadow:none}
.am-themes{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:76px;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.am-themes::-webkit-scrollbar{display:none}
.am-th{scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 7px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:inherit;box-shadow:0 3px 0 var(--line);margin-bottom:3px}
.am-th span:last-child{font-size:11px;line-height:1.15;text-align:center;font-weight:600}
.am-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.am-tabs .chip-btn{flex:none}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod span{font:600 12px var(--f-mono);opacity:.85}
.pod .step{width:100%;margin-top:4px;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font:800 26px var(--f-title,inherit);color:#2B1D3A;border:2.5px solid #2B1D3A;box-shadow:0 4px 0 #2B1D3A}
.pod.p1 .step{height:86px;background:linear-gradient(#FFE58A,#F2B320)}.pod.p2 .step{height:62px;background:linear-gradient(#F1F4FA,#AEB8CC)}.pod.p3 .step{height:46px;background:linear-gradient(#FFC59A,#D27A3E)}
.pod.me b{color:var(--lamp)}
.chip-btn{padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink,inherit);font:600 14px var(--f-title,inherit);box-shadow:0 3px 0 var(--line);margin-bottom:3px;transition:transform .1s}
.chip-btn.on{background:var(--lamp);border-color:var(--lamp);color:#fff;box-shadow:0 3px 0 var(--press,#B8346F)}
.chip-btn:active{transform:translateY(3px);box-shadow:none}
.am-friends{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.am-f{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:inherit;font-size:13px}
.am-f span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am-f.on{border-color:var(--lamp);box-shadow:0 0 0 3px var(--glow)}
.st-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#FF5A5F;border:2px solid #2B1D3A;vertical-align:middle;flex:none}
.st-dot.on,.am-st.on .st-dot{background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.25);animation:stPulse 2s ease-in-out infinite}
@keyframes stPulse{50%{box-shadow:0 0 0 6px rgba(61,220,132,0)}}
.am-st{display:inline-flex;align-items:center;gap:4px;font:600 9.5px var(--f-mono);text-transform:uppercase;letter-spacing:0;white-space:nowrap;opacity:.9}
.am-st.off{opacity:.7}.am-f{width:90px}.am-f .am-st{max-width:none;overflow:visible}
@media (prefers-reduced-motion:reduce){.st-dot.on,.am-st.on .st-dot{animation:none}}
.am-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.am-row:first-of-type{border-top:0}.am-row.me{background:var(--glow);border-radius:10px;padding:6px 8px}
.am-row svg{flex:none}.grow{flex:1;min-width:0}
.am-pos{width:22px;text-align:center;font:700 15px var(--f-mono)}.am-pos.gold{color:var(--accent2)}
.am-pts{font-size:18px;min-width:28px;text-align:right}
.am-err{color:var(--bad);font-weight:600;margin:0}
.banner-am{border:2px solid var(--lamp)}
.duelbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;margin-bottom:10px;border-radius:12px;background:var(--surface-2);font-size:14px}
.duelbar b{font-size:18px;color:var(--accent2)}.duelbar .vs{font:11px var(--f-mono);text-transform:uppercase;opacity:.7}
.am-inv{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;width:min(92vw,420px);display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--lamp);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:amIn .35s cubic-bezier(.3,1.6,.5,1)}
.am-inv span{opacity:.8;font-size:14px}
.am-inv{padding-right:40px}.am-x{position:absolute;top:6px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--surface-2);color:inherit;font-size:20px;line-height:1}
.am-re{border:0;background:none;color:var(--lamp);font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:2px 0}
@keyframes amIn{from{transform:translate(-50%,-30px);opacity:0}}
.tabs nav button>span:last-child{font-size:11px}


.am-crowned{position:relative;display:inline-block;line-height:0;flex:none}
.am-crowned .am-crown{position:absolute;left:50%;top:calc(var(--z) * -0.16);width:calc(var(--z) * .5);height:auto;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));animation:amCrown 2.4s ease-in-out infinite}
@keyframes amCrown{0%,100%{transform:translateX(-50%) rotate(-8deg)}50%{transform:translateX(-50%) translateY(-2px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.am-crowned .am-crown{animation:none}}

/* ---------- La Tour (onglet) : univers sombre, ciel d'orage, tour de pierre à étages, portes à rideaux rouges ---------- */
.tabs nav{grid-template-columns:repeat(7,1fr)}
.tabs button{font-size:10px}
.tw{position:relative;isolation:isolate;margin:-6px -4px 0;padding:14px 12px 18px;border-radius:22px;color:#EDE6FF;overflow:hidden;
  --surface:#2A1D48;--surface-2:#3A2A60;--line:#4E3C7A;--ink:#F3EEFF;--fg:#F3EEFF;--muted:#B8A8DC;
  background:radial-gradient(120% 60% at 50% 0%,#7A1E3E 0%,#3A1450 32%,#160C2E 70%,#0B0618 100%)}
.tw .muted,.tw-muted{color:#B8A8DC}
body.in-tour{background:radial-gradient(140% 70% at 50% 0%,#3A1450,#0B0618 70%) fixed!important}
body.in-tour .tw{background:transparent}
.tw-fl,.tw-fl.cp{background-image:repeating-linear-gradient(0deg,transparent 0 12px,rgba(10,6,20,.22) 12px 13.5px),repeating-linear-gradient(90deg,transparent 0 24px,rgba(10,6,20,.16) 24px 25.5px),linear-gradient(90deg,#3A3150 0%,#6A5E86 18%,#7C7098 50%,#6A5E86 82%,#3A3150 100%)}
.tw-fl.done{background-image:repeating-linear-gradient(0deg,transparent 0 12px,rgba(10,6,20,.2) 12px 13.5px),repeating-linear-gradient(90deg,transparent 0 24px,rgba(10,6,20,.14) 24px 25.5px),linear-gradient(90deg,#4A3A5E 0%,#8A7AA8 18%,#9C8CBA 50%,#8A7AA8 82%,#4A3A5E 100%)}
.tw-sky{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.tw-sky::before{content:"";position:absolute;left:50%;top:-140px;width:520px;height:300px;margin-left:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,90,140,.55),rgba(170,40,110,.25) 55%,transparent);filter:blur(6px);animation:twVortex 9s linear infinite}
.tw-sky::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% -30%,rgba(255,255,255,.03) 0 2px,transparent 2px 14px)}
@keyframes twVortex{to{transform:rotate(360deg)}}
.tw-bolt{position:absolute;top:0;width:3px;height:180px;background:linear-gradient(#fff,#C9A2FF 60%,transparent);filter:drop-shadow(0 0 8px #C9A2FF);opacity:0;animation:twBolt 7s infinite}
.tw-bolt.b1{left:12%;animation-delay:1.2s}.tw-bolt.b2{right:10%;left:auto;height:140px;animation-delay:4.6s}
@keyframes twBolt{0%,92%,100%{opacity:0}93%{opacity:1}94%{opacity:.2}95.5%{opacity:.9}97%{opacity:0}}
.tw-rock{position:absolute;width:22px;height:16px;background:linear-gradient(#5A4A72,#241A38);clip-path:polygon(10% 30%,45% 0,90% 20%,100% 70%,60% 100%,0 80%);animation:twFloat 6s ease-in-out infinite}
.tw-rock.r1{left:6%;top:180px}.tw-rock.r2{right:7%;top:300px;width:30px;height:20px;animation-delay:-2s}.tw-rock.r3{left:10%;top:520px;width:16px;height:12px;animation-delay:-4s}.tw-rock.r4{right:12%;top:700px;animation-delay:-1s}
@keyframes twFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(8deg)}}
.tw-head{display:flex;flex-direction:column;align-items:center;gap:2px;margin:86px 0 10px;text-align:center}
.tw-h1{margin:0;font:900 40px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(#FFE6F2,#FF7AB8 55%,#B03AD8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2B1040) drop-shadow(0 0 18px rgba(255,90,170,.45))}
.tw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tw-stats div{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:14px;background:rgba(20,10,40,.6);border:1px solid rgba(201,162,255,.25)}
.tw-stats span{font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#B8A8DC}
.tw-stats b{font:900 24px "Bricolage Grotesque",sans-serif;display:flex;align-items:center;gap:4px}
.tw-panel{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:linear-gradient(180deg,rgba(46,28,84,.92),rgba(22,12,44,.92));border:1.5px solid rgba(201,162,255,.3);box-shadow:0 6px 0 rgba(0,0,0,.35);margin-bottom:12px}
.tw-goal{align-items:center;text-align:center}
.tw-goal b{font:900 20px "Bricolage Grotesque",sans-serif}
.tw-band{display:inline-block;font:700 11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#FFB0D2;background:rgba(255,95,162,.14);border:1px solid rgba(255,95,162,.35);border-radius:999px;padding:3px 10px}
.tw-go{margin-top:6px;background:linear-gradient(180deg,#FF6AA8,#C2185B);box-shadow:0 5px 0 #6A0A30,0 0 22px rgba(255,90,160,.45)}
.tw-shaft{position:relative;max-height:62vh;overflow-y:auto;overscroll-behavior:contain;margin:0 auto 12px;width:min(340px,100%);padding:0 0 4px;scrollbar-width:none;border-radius:16px;-webkit-mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent)}
.tw-shaft::-webkit-scrollbar{display:none}
.tw-fl{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;height:52px;margin:0 22px;padding:0 10px;background:linear-gradient(90deg,#3A3150 0%,#6A5E86 18%,#7C7098 50%,#6A5E86 82%,#3A3150 100%);border-left:3px solid #1A1228;border-right:3px solid #1A1228;border-bottom:3px solid #1A1228;box-shadow:inset 0 3px 0 rgba(255,255,255,.12),inset 0 -6px 10px rgba(0,0,0,.35)}
.tw-fl::before{content:"";position:absolute;left:50%;bottom:0;width:30px;height:38px;margin-left:-15px;border-radius:15px 15px 0 0;background:linear-gradient(90deg,#7A0E22,#D42A3E 25%,#8A1226 50%,#D42A3E 75%,#7A0E22);border:2.5px solid #1A1228;border-bottom:0;box-shadow:inset 0 0 8px rgba(0,0,0,.5)}
.tw-fl b{position:relative;z-index:1;font:900 15px "Bricolage Grotesque",sans-serif;color:#F3EEFF;text-shadow:0 2px 0 #1A1228;min-width:26px;text-align:center}
.tw-win{width:14px;height:18px;border-radius:7px 7px 2px 2px;background:#1A1228;border:2px solid #2A1E3E}
.tw-fl.done .tw-win{background:radial-gradient(circle at 50% 70%,#FFE36A,#F08A1E 70%);box-shadow:0 0 10px rgba(255,200,90,.6)}
.tw-fl.done{background:linear-gradient(90deg,#4A3A5E 0%,#8A7AA8 18%,#9C8CBA 50%,#8A7AA8 82%,#4A3A5E 100%)}
.tw-fl.done::before{background:linear-gradient(#FFE9A0,#F2A41E);box-shadow:0 0 14px rgba(255,210,90,.75)}
.tw-fl.lock{filter:saturate(.45) brightness(.62)}
.tw-fl.lock::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.18) 10px 12px);pointer-events:none}
.tw-fl.here{filter:none;z-index:2;box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 0 0 3px #FF5FA2,0 0 26px rgba(255,95,162,.75);animation:twHere 2s ease-in-out infinite}
@keyframes twHere{50%{box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 0 0 3px #FF8AC0,0 0 38px rgba(255,95,162,.95)}}
.tw-fl.cp{height:66px;margin:0 6px;background:linear-gradient(90deg,#2E2442 0%,#5E5080 15%,#8274A6 50%,#5E5080 85%,#2E2442 100%);border-top:4px solid #C9A24A}
.tw-fl.cp::before{width:40px;height:50px;margin-left:-20px;border-radius:20px 20px 0 0}
.tw-fl-body{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.tw-fl-body span{font:700 10.5px "IBM Plex Mono",monospace;letter-spacing:.04em;color:#FFE6A6;background:rgba(20,10,40,.7);padding:3px 7px;border-radius:8px;border:1px solid rgba(255,210,100,.35);margin-right:auto;margin-left:4px}
.tw-coinic{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4B0,#F2B320 55%,#A8740A);border:2px solid #4A3000;box-shadow:0 0 10px rgba(255,210,90,.6)}
.tw-ok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff;background:#2BB673;border:2px solid #0E4A2A}
.tw-fl.top{height:84px;margin:96px 2px 0;background:linear-gradient(90deg,#3A1A3A,#9A5AB8 25%,#E0B8FF 50%,#9A5AB8 75%,#3A1A3A);border-top:5px solid #FFD23F}
.tw-spire{position:absolute;left:50%;bottom:100%;width:0;height:0;margin-left:-34px;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:70px solid #5A3A86;filter:drop-shadow(0 0 10px rgba(255,90,170,.6))}
.tw-spire::after{content:"";position:absolute;left:-3px;bottom:60px;width:6px;height:220px;background:linear-gradient(transparent,rgba(255,200,240,.9));filter:blur(2px);animation:twBeam 3s ease-in-out infinite}
@keyframes twBeam{50%{opacity:.55}}
.tw-spire-crown{position:absolute;left:-12px;top:22px;font-size:22px}
.tw-base{height:26px;margin:0 2px;border-radius:0 0 12px 12px;background:linear-gradient(#2A2038,#120C1E)}
.tw-me{position:absolute;right:-18px;bottom:2px;z-index:3;filter:drop-shadow(0 0 8px rgba(255,95,162,.9));animation:twBob 1.6s ease-in-out infinite}
.tw-me.sm{right:-14px}
@keyframes twBob{50%{transform:translateY(-4px)}}
.tw-row-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tw-rk{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px}
.tw-rk.me{background:rgba(255,95,162,.14);outline:1.5px solid rgba(255,95,162,.5)}
.tw-pos{width:24px;text-align:center;font:900 16px "Bricolage Grotesque",sans-serif;color:#B8A8DC}
.tw-pos.p1{color:#FFD23F}.tw-pos.p2{color:#E0E4F0}.tw-pos.p3{color:#F0A86A}
.tw-rk-n{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.tw-rk-n .tw-muted{font-size:12px}
.tw-rk-f{font:900 15px "Bricolage Grotesque",sans-serif;color:#FFB0D2;white-space:nowrap}
.tw-play{padding-top:12px}
.tw-floor{font:800 15px "Bricolage Grotesque",sans-serif;letter-spacing:.04em}
.tw-floor b{font-size:30px;color:#FF8AC0;margin:0 2px}.tw-floor i{font-style:normal;color:#8A7AB0}
.tw-climb{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.tw-climb i{height:8px;border-radius:4px;background:#2E2250}
.tw-climb i.ok{background:linear-gradient(90deg,#F08A1E,#FFD23F)}
.tw-climb i.now{background:#FF5FA2;box-shadow:0 0 10px #FF5FA2}
.tw-climb i.cp{outline:2px solid #C9A24A;outline-offset:1px}
.tw-q{margin-top:10px;background:linear-gradient(180deg,#2E1F52,#1C1236)!important;border:1.5px solid rgba(201,162,255,.35);color:#F3EEFF}
.tw-q .choice{background:#3A2A62;color:#F3EEFF;border-color:#58468A}
.tw-fx{position:fixed;inset:0;z-index:85;display:grid;place-items:center;overflow:hidden;animation:fade .25s ease both}
.tw-fx.out{animation:lvFadeOut .28s ease-in forwards}
.tw-door{background:#0B0618}
.tw-light{position:absolute;inset:0;background:radial-gradient(closest-side,#FFF2C8,#FFB0D2 40%,transparent 75%);animation:twGlow 1.1s ease-out both}
@keyframes twGlow{from{transform:scale(.2);opacity:0}to{transform:scale(1.4);opacity:1}}
.tw-leaf{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#5A0A1A,#C82A3E 30%,#7A0E22 60%,#C82A3E);border:3px solid #1A0810;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.tw-leaf.l{left:0;animation:twLeafL .9s cubic-bezier(.5,0,.3,1) forwards}.tw-leaf.r{right:0;animation:twLeafR .9s cubic-bezier(.5,0,.3,1) forwards}
@keyframes twLeafL{to{transform:translateX(-100%)}}@keyframes twLeafR{to{transform:translateX(100%)}}
.tw-door-txt{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;color:#2B1040;opacity:0;animation:podTitle .4s .45s forwards}
.tw-door-txt span{font:800 18px "Bricolage Grotesque",sans-serif}.tw-door-txt b{font:900 44px "Bricolage Grotesque",sans-serif;text-transform:uppercase}
.tw-climber{position:absolute;bottom:12%;left:50%;margin-left:-43px;z-index:2;animation:twWalk 1.1s ease-in forwards}
@keyframes twWalk{0%{transform:translateY(40px)}100%{transform:translateY(-40px) scale(.7);opacity:.3}}
.tw-cp,.tw-fall,.tw-summit{background:rgba(8,4,18,.82);backdrop-filter:blur(3px);padding:20px}
.tw-cp-card,.tw-fall-card,.tw-summit-card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;width:min(360px,100%);padding:22px 18px;border-radius:22px;color:#F3EEFF;background:linear-gradient(180deg,#3A2466,#1A0F34);border:2px solid #C9A24A;box-shadow:0 0 40px rgba(255,170,60,.35),0 10px 0 rgba(0,0,0,.4);animation:podTitle .5s cubic-bezier(.3,1.6,.5,1) both}
.tw-fall-card{border-color:#FF4D6D;box-shadow:0 0 40px rgba(255,60,90,.35),0 10px 0 rgba(0,0,0,.4)}
.tw-fall{animation:twShake .5s}
@keyframes twShake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tw-cp-num{font:900 64px/1 "Bricolage Grotesque",sans-serif;background:linear-gradient(#FFF4B0,#F2B320 60%,#A8740A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3A2000)}
.tw-kicker{font:700 11px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#FFB0D2}
.tw-cp-title{font:900 22px "Bricolage Grotesque",sans-serif}
.tw-cp-sub{font-size:14px;color:#C9BCEA}
.tw-cp-gain{display:flex;align-items:center;gap:6px;font:900 40px "Bricolage Grotesque",sans-serif;color:#FFD23F;text-shadow:0 3px 0 #3A2000;animation:podTitle .5s .3s cubic-bezier(.3,1.8,.5,1) both}
.tw-cp-gain .coin{width:30px;height:30px}
.tw-cp-next{font:700 12px "IBM Plex Mono",monospace;color:#B8A8DC}
.tw-cp-card .btn,.tw-fall-card .btn,.tw-summit-card .btn{max-width:300px}
.tw-coin{position:absolute;top:-30px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4B0,#F2B320 55%,#A8740A);border:2px solid #4A3000;animation:podConf 2s linear forwards}
.tw-beam{position:absolute;left:50%;top:0;bottom:0;width:140px;margin-left:-70px;background:linear-gradient(90deg,transparent,rgba(255,220,250,.7),transparent);filter:blur(8px);animation:twBeam 2.4s ease-in-out infinite}
.tw-summit-card{border-color:#FFD23F;box-shadow:0 0 60px rgba(255,210,90,.6),0 10px 0 rgba(0,0,0,.4)}
.tw-summit-title{font:900 44px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;background:linear-gradient(#FFF6C8,#FFD23F 50%,#E08A00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3A2000)}
.tw-crown{font-size:44px;animation:podJoy .7s ease-in-out infinite}
.tw-summit-av{animation:podDrop .9s cubic-bezier(.35,1.5,.5,1) both}
.tw-ic-bolt{animation:twIcBolt 3s infinite}
@keyframes twIcBolt{0%,85%,100%{opacity:0}88%,94%{opacity:1}}

/* Trophée démoniaque et écran de classement de la Tour */

.tw-pod{display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;text-align:center}

.tw-pod.p1 .tw-pod-step{height:78px;background:linear-gradient(#FF9A3A,#C21E1E);box-shadow:0 0 20px rgba(255,90,30,.6),inset 0 -6px 0 rgba(0,0,0,.25)}

@media (prefers-reduced-motion:reduce){.dtro *{animation:none!important}}

/* ---------- Boss de la semaine ---------- */
.bs-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:2px solid color-mix(in srgb,var(--lamp) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,#C21E1E 18%,var(--surface)),var(--surface));text-align:left;color:inherit;cursor:pointer}

.bs-stage.sm{min-height:170px}
.bs-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--bc) 45%,transparent),transparent 65%);animation:bsGlow 3s ease-in-out infinite}

.bs-art{position:relative}
.bs-idle{animation:bsIdle 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bsIdle{50%{transform:translateY(-4px) scaleY(1.02)}}
.bs-art .bs-eye{animation:bsEye 2s ease-in-out infinite}

.bs-stage.hit .bs-art{animation:bsHit .45s ease-out}
