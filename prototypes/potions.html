@keyframes bsHit{0%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-4deg);filter:brightness(2) saturate(.3)}45%{transform:translateX(10px) rotate(3deg)}70%{transform:translateX(-5px)}100%{transform:none}}
@keyframes bsFlash{to{opacity:0}}
.bs-dmg{position:absolute;top:18%;right:22%;font:900 42px "Bricolage Grotesque",sans-serif;color:#FFD23F;text-shadow:0 3px 0 #8A1414,0 0 16px rgba(255,80,40,.8);animation:bsDmg 1s ease-out forwards}
@keyframes bsDmg{0%{transform:translateY(10px) scale(.4);opacity:0}25%{transform:translateY(0) scale(1.25);opacity:1}100%{transform:translateY(-36px) scale(1);opacity:0}}
.bs-stage.dead .bs-art{filter:grayscale(1) brightness(.5);transform:rotate(-8deg) translateY(16px)}
.bs-hp{position:relative;height:22px;border-radius:12px;background:#2A1430;border:2px solid #1E1030;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}

.bs-hp span{position:relative;display:grid;place-items:center;height:100%;font:800 12.5px "IBM Plex Mono",monospace;color:#fff;text-shadow:0 1px 2px #000}

.bs-days{display:flex;flex-direction:column;gap:4px}

.bs-days .on{outline:2px solid var(--lamp);background:color-mix(in srgb,var(--lamp) 16%,var(--surface-2))}
.bs-days .past{opacity:.5}
.bs-defeat{position:fixed;inset:0;z-index:88;display:grid;place-items:center;background:rgba(10,4,18,.85);animation:fade .3s both}

@keyframes bsDie{0%{transform:none}30%{transform:translateX(-10px) rotate(-4deg)}60%{transform:translateX(10px) rotate(4deg);filter:brightness(2)}100%{transform:translateY(40px) rotate(-12deg) scale(.85);filter:grayscale(1) brightness(.4);opacity:.6}}

@media (prefers-reduced-motion:reduce){.bs-glow,.bs-idle,.bs-art .bs-eye,.bs-stage.hit .bs-art,.bs-dmg,.bs-defeat-card .bs-art{animation:none!important}}

/* ---------- Arène de combat du Boss ---------- */
.ar{display:flex;flex-direction:column;gap:10px}
.ar-scene{position:relative;height:min(47vh,430px);min-height:340px;border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 2px rgba(201,162,255,.25)}

.ar-bg .ar-line{animation:arLine 2.6s ease-in-out infinite}
@keyframes arLine{50%{stroke-opacity:.45}}
.ar-bg .ar-core{animation:arCore 1.8s ease-in-out infinite}
@keyframes arCore{50%{fill-opacity:.6}}
.ar-bg .ar-orb{transform-box:fill-box;transform-origin:center;animation:arOrb 3s ease-in-out infinite}
@keyframes arOrb{50%{transform:scale(1.06);filter:brightness(1.3)}}
.ar-bg .ar-orbring{transform-box:fill-box;transform-origin:center;animation:arSpin 14s linear infinite}
.ar-bg .ar-glow{animation:arCore 3.4s ease-in-out infinite}

@keyframes arCrys{to{opacity:.7;filter:brightness(1.4)}}
.ar-ember{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:#FFB060;box-shadow:0 0 8px #FF7A2A;z-index:1;animation:arEmber 5s linear infinite;opacity:0}

.ar-top{position:absolute;left:10px;right:10px;top:8px;z-index:5;display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:14px;background:linear-gradient(180deg,rgba(10,4,20,.82),rgba(10,4,20,.55));border:1px solid rgba(201,162,255,.25)}
.ar-bname{font:900 15px "Bricolage Grotesque",sans-serif;color:#fff;text-shadow:0 2px 0 #000}
.ar-mydmg{font:700 11.5px "IBM Plex Mono",monospace;color:#FFD23F}
.ar-boss{position:absolute;left:50%;top:21%;transform:translateX(-50%);width:46%;max-width:210px;z-index:2;display:grid;place-items:center}
.ar-boss svg{width:100%;height:auto}
.ar-bshadow{position:absolute;bottom:6%;left:12%;right:12%;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)}
.ar-hero{position:absolute;bottom:5%;width:27%;max-width:118px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center}
.ar-hero:not(.atk){transform:translateX(-50%)}
.ar-hero.atk{z-index:6}
.ar-body{position:relative;animation:arBob 2.4s ease-in-out infinite}
.ar-hero[data-i="0"] .ar-body{animation-delay:-.8s}.ar-hero[data-i="2"] .ar-body{animation-delay:-1.6s}
@keyframes arBob{50%{transform:translateY(-5px)}}
.ar-body svg:first-child{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.ar-hero.me .ar-body svg:first-child{filter:drop-shadow(0 0 10px rgba(255,95,162,.8)) drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.ar-sword{position:absolute;right:-12%;bottom:18%;width:34%;height:auto;transform-origin:50% 92%;transform:rotate(-20deg);filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
.ar-hshadow{position:absolute;bottom:8px;left:18%;right:18%;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
.ar-tag{margin-top:-4px;max-width:100%;padding:1px 8px;border-radius:8px;background:rgba(10,4,20,.75);color:#fff;font:800 11px "Bricolage Grotesque",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,255,255,.2)}
.ar-hero.me .ar-tag{background:var(--lamp)}
.ar-fx{position:absolute;inset:0;z-index:7;pointer-events:none}
.ar-slash{position:absolute;width:180px;height:180px}
.ar-slash .ar-arc{stroke-dasharray:420;stroke-dashoffset:420;animation:arSlash .45s ease-out forwards;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px var(--bc))}
@keyframes arSlash{60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-420;opacity:0}}
.ar-burst{position:absolute;width:100px;height:100px;animation:arBurst .5s ease-out forwards}
@keyframes arBurst{0%{transform:scale(.2) rotate(0);opacity:1}100%{transform:scale(1.6) rotate(40deg);opacity:0}}
.ar-spark{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:#FFE36A;box-shadow:0 0 8px #FFB020;animation:arSpark .6s ease-out forwards}
@keyframes arSpark{to{transform:translate(var(--sx),var(--sy)) scale(.3);opacity:0}}
.ar-dmg{position:absolute;transform:translateX(-50%);font:900 46px "Bricolage Grotesque",sans-serif;color:#FFD23F;text-shadow:0 3px 0 #8A1414,0 0 18px rgba(255,80,40,.9);animation:arDmg 1s ease-out forwards}
@keyframes arDmg{0%{transform:translate(-50%,10px) scale(.4);opacity:0}25%{transform:translate(-50%,0) scale(1.3);opacity:1}100%{transform:translate(-50%,-50px) scale(1);opacity:0}}
.ar-redflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 80%,rgba(255,40,40,.55),transparent 70%);animation:fade .25s reverse forwards}
.ar-victory{position:absolute;inset:0;z-index:8;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle,rgba(255,220,120,.35),transparent 70%);animation:fade .4s .8s both}
.ar-victory b{font:900 52px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;background:linear-gradient(#FFF6C8,#FFD23F 50%,#E08A00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5A2A00)}

.ar-panel{padding:12px 14px;margin-top:-30px;position:relative;z-index:3;border:1.5px solid rgba(201,162,255,.35)}

@media (min-width:700px){.ar-scene{height:min(60vh,520px)}}
@media (prefers-reduced-motion:reduce){.ar-bg *,.ar-ember,.ar-body,.ar-slash .ar-arc,.ar-burst,.ar-spark,.ar-dmg{animation:none!important}}

/* ---------- Quêtes du jour et de la semaine ---------- */
.qs-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;color:inherit;cursor:pointer;border:2px solid color-mix(in srgb,var(--lamp) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,#7A3AC8 16%,var(--surface)),var(--surface))}

.qs-chestbox .muted{color:#C9BCEA}

@keyframes qsWiggle{0%,60%,100%{transform:none}70%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
.qs-chest .qs-aura{animation:arCore 1.6s ease-in-out infinite}
.qs-chest.locked{filter:saturate(.55) brightness(.85)}
.qs-open{background:linear-gradient(180deg,#FFD23F,#E08A00);color:#2B1D3A;box-shadow:0 4px 0 #8A5A00}
.qs-list{gap:2px}
.qs-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.qs-row:last-child{border-bottom:0}
.qs-row.done .qs-mid b{text-decoration:line-through;opacity:.6}
.qs-ic{flex:none;display:grid;place-items:center;width:46px;height:46px}
.qs-ic svg{max-width:46px;max-height:46px}
.qs-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qs-mid b{font-size:14.5px;line-height:1.25}
.qs-bar{position:relative;height:16px;border-radius:9px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.qs-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FF5FA2,#C98AFF);border-radius:9px;transition:width .5s}

.qs-rw{flex:none;min-width:52px;text-align:right}

.qs-chest-card .qs-chest-anim{animation:qsShake .9s ease-in-out both,qsHide .01s .9s forwards}
@keyframes qsShake{0%,100%{transform:none}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}60%{transform:rotate(-6deg) scale(1.1)}80%{transform:rotate(5deg) scale(1.12)}}

@media (prefers-reduced-motion:reduce){.qs-chest,.qs-chestbox,.qs-chest-anim,.qs-chest-open,.qs-burst{animation:none!important}.qs-chest-open{opacity:1}}
/* ---------- Salons privés : La Bombe et le Quiz à plusieurs ---------- */

.sl-seat.out{opacity:.35;filter:grayscale(1)}
.sl-seat.hit{animation:slHit .5s}
@keyframes slHit{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-6deg)}50%{transform:translateX(8px) rotate(6deg)}}
.sl-bubble{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:26px;animation:slPop 1.8s forwards;pointer-events:none}
@keyframes slPop{0%{transform:translate(-50%,10px) scale(.4);opacity:0}15%{transform:translate(-50%,0) scale(1.2);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}
.sl-bomb{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;z-index:2}
.sl-bomb svg{animation:slBeat var(--beat,1s) ease-in-out infinite}
@keyframes slBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sl-spark{animation:slSpark .25s steps(2) infinite}
@keyframes slSpark{50%{transform:scale(.6) rotate(30deg)}}
.sl-boom{position:absolute;inset:0;display:grid;place-items:center;font:900 64px "Bricolage Grotesque",sans-serif;color:#FFD23F;text-shadow:0 4px 0 #C2185B,0 0 30px #FF5FA2;animation:slBoom 1.1s forwards;pointer-events:none;z-index:3}
@keyframes slBoom{0%{transform:scale(.2);opacity:0}20%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0}}
.sl-flash{position:fixed;inset:0;background:#fff;animation:slFlash .5s forwards;pointer-events:none;z-index:70}
@keyframes slFlash{from{opacity:.8}to{opacity:0}}
.sl-fuse{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap}
.sl-fuse i{width:26px;height:8px;border-radius:4px;background:#F4A261}.sl-fuse i.burnt{background:var(--line)}
.sl-emo{display:flex;gap:6px;justify-content:center}
.sl-emo button{font-size:22px;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.sl-q{padding:14px}.sl-q h2{font-size:18px;margin:6px 0}
.sl-status{margin:10px 0 0;text-align:center}
.sl-you{color:var(--lamp)}.sl-good{color:#2BB673}.sl-bad{color:#FF4D6D}
.sl-board{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13.5px}
.av-ref{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-weight:700}
.av-ref span{min-width:0}.av-ref b{flex:none;font:900 22px "Bricolage Grotesque",sans-serif;color:var(--lamp)}
.av-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.av-btn{justify-content:center;font:800 18px "Bricolage Grotesque",sans-serif;min-height:64px}
.av-btn::before{display:none!important}
.pm-bonus{outline:3px solid var(--accent2);outline-offset:-3px}
.pm-form{display:flex;gap:8px;margin-top:10px}
.pm-form input{flex:1;min-width:0;border-radius:14px;border:2px solid var(--line);padding:12px;background:var(--surface);color:var(--ink);font:800 22px "Bricolage Grotesque",sans-serif;text-align:center}
.pm-form .btn{width:auto;padding:0 18px}
.pm-tries{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.pm-try{font:700 14px "IBM Plex Mono",monospace;background:var(--surface-2);border-radius:10px;padding:4px 8px}
.pm-try.ok{background:color-mix(in srgb,var(--good) 25%,var(--surface-2))}
.pm-year{font:900 48px "Bricolage Grotesque",sans-serif;text-align:center;color:var(--lamp);margin-top:8px;animation:podTitle .45s cubic-bezier(.3,1.6,.5,1)}
.pm-who{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;font-size:13.5px}
.pm-who span{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-radius:10px;padding:3px 8px}
.sl-board span{background:var(--surface);border-radius:10px;padding:3px 8px}.sl-board .me{outline:2px solid var(--lamp)}

.choice.picked{background:#FFFFFF;color:#2B1D3A;border-color:var(--lamp);box-shadow:0 4px 0 color-mix(in srgb,var(--lamp) 55%,#000);opacity:1}
.choice.picked::before{background:var(--lamp);color:#fff}
.sl-pod{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 30%,#4A2C7A,#1E1236 75%);color:#fff;animation:fade .3s ease both;overflow:hidden}
.sl-pod h2{font:900 30px/1.1 "Bricolage Grotesque",sans-serif;margin:0;text-align:center;text-wrap:balance;opacity:0;animation:podTitle .5s 2.6s cubic-bezier(.3,1.6,.5,1) forwards}
.sl-pod .sub{opacity:0;animation:fade .4s 3s forwards;text-align:center}
.sl-podium{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.sl-pcol{display:flex;flex-direction:column;align-items:center;width:100px}
.sl-pcol .who{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transform:translateY(-110vh)}
.sl-pcol .who b{font:800 14px "Bricolage Grotesque",sans-serif;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-pcol .step{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:start center;padding-top:6px;font:900 30px "Bricolage Grotesque",sans-serif;color:#2B1D3A;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transform:scaleY(0);transform-origin:bottom;animation:podStep .45s cubic-bezier(.3,1.5,.5,1) forwards}
.sl-pcol.r1 .step{height:120px;background:linear-gradient(#FFE36A,#F2B320)}.sl-pcol.r2 .step{height:86px;background:linear-gradient(#EEF0F6,#B8BED0)}.sl-pcol.r3 .step{height:62px;background:linear-gradient(#F4C08A,#C8783A)}
.sl-pcol.r3 .step{animation-delay:.2s}.sl-pcol.r2 .step{animation-delay:.35s}.sl-pcol.r1 .step{animation-delay:.5s}
.sl-pcol.r3 .who{animation:podDrop .7s 1s cubic-bezier(.4,1.4,.5,1) forwards}
.sl-pcol.r2 .who{animation:podDrop .7s 1.5s cubic-bezier(.4,1.4,.5,1) forwards}
.sl-pcol.r1 .who{animation:podDrop .9s 2.1s cubic-bezier(.35,1.5,.5,1) forwards,podJoy .6s 3.2s ease-in-out 4}
.sl-pcol.r1 .crown{font-size:28px;line-height:1;opacity:0;animation:podTitle .4s 2.9s cubic-bezier(.3,1.8,.5,1) forwards}
.sl-conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;opacity:0;animation:podConf 2.8s linear forwards}
@keyframes podDrop{0%{opacity:1;transform:translateY(-110vh)}70%{transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes podStep{to{transform:scaleY(1)}}
@keyframes podTitle{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:none}}
@keyframes podJoy{0%,100%{transform:none}50%{transform:translateY(-14px) rotate(-4deg)}}
@keyframes podConf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.sl-pod *{animation-duration:.01s!important;animation-delay:0s!important}}
@media (prefers-reduced-motion:reduce){.sl-bomb svg,.sl-spark,.sl-boom,.sl-seat.hit,.sl-bubble{animation:none}}

/* ---------- Multi : les deux portes ---------- */
.mh-door{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px;text-align:left;color:#FFF6DE;cursor:pointer;border-radius:22px;border:3px solid #1E1030;box-shadow:0 6px 0 #1E1030;background:linear-gradient(135deg,#4A2A8A,#1E1040)}
.mh-door.mh-guild{background:linear-gradient(135deg,#8A4A1E,#3A1E0C);border-color:#2E1A0C;box-shadow:0 6px 0 #2E1A0C,inset 0 0 0 2px rgba(255,210,63,.25)}
.mh-door:active{transform:translateY(3px);box-shadow:0 3px 0 #1E1030}
.mh-arch{flex:none;display:grid;place-items:center;width:84px;height:92px;border-radius:42px 42px 12px 12px;background:radial-gradient(circle at 50% 35%,rgba(255,200,97,.45),rgba(0,0,0,.25));border:3px solid rgba(255,246,222,.35)}
.mh-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.mh-txt b{font:800 20px "Fredoka","Nunito",sans-serif}
.mh-txt span{font-size:13.5px;color:#EADCC8;line-height:1.3}
.mh-n{position:absolute;top:10px;right:12px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#FF5FA2;color:#fff;font:800 13px "IBM Plex Mono",monospace;display:grid;place-items:center;border:2px solid #1E1030;font-style:normal}

/* ---------- Guildes : la taverne ---------- */
.gd-hq{display:flex;flex-direction:column;gap:0}
.gd-tav{position:relative;width:100%;aspect-ratio:360/270;border-radius:22px 22px 0 0;overflow:hidden;border:3px solid #2E1A0C;border-bottom:0;background:#2E1A0C}
.gd-bg,.gd-table{position:absolute;inset:0;width:100%;height:100%}
.gd-table{z-index:2;pointer-events:none}
.gd-wallemb{position:absolute;left:50%;top:1%;transform:translateX(-50%);width:15%;z-index:0;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.gd-wallemb svg{width:100%;height:auto}
.gd-seat{position:absolute;z-index:1;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.gd-seat.front{z-index:3}
.gd-seat .gd-stool{width:78%;height:auto;margin-top:-16%;position:relative;z-index:-1}
.gd-who{position:relative;width:100%;animation:gdBob 3.2s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
.gd-who svg,.gd-who .am-crowned{width:100%!important;height:auto!important;display:block}
.gd-seat.on .gd-who{filter:drop-shadow(0 0 6px rgba(255,200,97,.8))}
.gd-seat.off .gd-who{filter:saturate(.45) brightness(.7);animation:none}
.gd-zz{position:absolute;right:-4%;top:0;font:800 15px "Fredoka",sans-serif;color:#C9D8FF;animation:gdZz 2.4s ease-in-out infinite}
.gd-zz small{font-size:10px}
@keyframes gdZz{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
@keyframes gdBob{0%,100%{transform:none}50%{transform:translateY(-3%) rotate(-1.5deg)}}
.gd-plate{max-width:150%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:800 11px "Nunito",sans-serif;color:#FFF6DE;background:rgba(30,16,8,.82);border:1.5px solid #C8A060;border-radius:8px;padding:1px 7px;margin-bottom:3px;display:flex;align-items:center;gap:3px}
.gd-seat.front .gd-plate{order:3;margin:3px 0 0}
.gd-crown{font-style:normal;color:#FFD23F}.gd-crown.off{color:#C9D8FF;font-size:9px}
.gd-seat.gd-freeseat .gd-stool{margin-top:0;opacity:.85}
.gd-seat.gd-freeseat .gd-plate{opacity:.6;font-weight:700}
.gd-free{flex:none;width:clamp(30px,10vw,44px);height:clamp(30px,10vw,44px);padding:0;line-height:1;display:grid;place-items:center;border-radius:50%;border:2.5px dashed #FFD98A;background:rgba(255,217,138,.12);color:#FFD98A;font:800 24px "Fredoka",sans-serif;cursor:pointer;margin-bottom:-8%;animation:gdPulse 2s ease-in-out infinite}
@keyframes gdPulse{50%{background:rgba(255,217,138,.3)}}
.gd-flame{animation:gdFlame .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.gd-flick{animation:gdFlick 2.2s ease-in-out infinite}
@keyframes gdFlame{to{transform:scaleY(1.15) scaleX(.9)}}
@keyframes gdFlick{0%,100%{opacity:1}40%{opacity:.75}70%{opacity:.9}}

/* Plaque sous la taverne */
.gd-plaque{font-family:"Nunito",sans-serif;position:relative;z-index:4;margin-top:-4px;padding:12px 14px 14px;color:#3A2410;border:3px solid #2E1A0C;border-top:0;background:linear-gradient(180deg,#8A5428 0 8px,#F3E3C0 8px,#E8D2A4);display:flex;flex-direction:column;gap:8px}
.gd-plaque h1{margin:0;text-align:center;font:800 24px "Fredoka","Nunito",sans-serif;color:#3A2410;letter-spacing:.5px}
.gd-stats{display:flex;align-items:center;gap:8px}
.gd-lv{flex:none;font:800 13px "IBM Plex Mono",monospace;color:#FFF6DE;background:linear-gradient(#8A5428,#4A2A12);border:2px solid #2E1A0C;border-radius:10px;padding:3px 8px}
.gd-xp,.gd-bar{position:relative;flex:1;height:18px;border-radius:9px;background:#4A2A12;border:2px solid #2E1A0C;overflow:hidden}
.gd-xp i,.gd-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4A8AE8,#8AD8FF);transition:width .6s}
.gd-bar i{background:linear-gradient(90deg,#E08A00,#FFD23F)}
.gd-obj.done .gd-bar i{background:linear-gradient(90deg,#2BB673,#7FD8BE)}
.gd-xp span,.gd-bar span{position:relative;display:grid;place-items:center;height:100%;font:800 10.5px "IBM Plex Mono",monospace;color:#fff;text-shadow:0 1px 0 #1E1030}
.gd-bar.sm{height:10px;border-width:1.5px}
.gd-meta{display:flex;justify-content:center;gap:16px;font:800 13px "Nunito",sans-serif}
.gd-meta span{display:inline-flex;align-items:center;gap:4px}
.gd-desc{margin:0;text-align:center;font-style:italic;font-size:13.5px;color:#5A3A1E}

/* Onglets en bois + parchemin */
.gd-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 -3px;padding:0 4px;position:relative;z-index:2}
.gd-tabs button{padding:9px 2px 7px;border-radius:12px 12px 0 0;border:2.5px solid #2E1A0C;border-bottom:0;background:linear-gradient(#6A3C1A,#4A2A12);color:#E8D2A4;font:800 12.5px "Nunito",sans-serif;cursor:pointer}
.gd-tabs button.on{background:linear-gradient(#C8823A,#8A5428);color:#FFF6DE;padding-top:11px;margin-top:-4px}
.gd-parch{font-family:"Nunito",sans-serif;position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:3px solid #2E1A0C;color:#3A2410;background:linear-gradient(180deg,#F7EAD0,#E8D2A4);box-shadow:inset 0 0 24px rgba(138,84,40,.35),0 5px 0 #2E1A0C}
.gd-parch .card{background:transparent;border:0;box-shadow:none;padding:0;color:inherit}
.gd-parch .muted,.gd-parch .label{color:#7A5430}
.gd-parch b{color:#3A2410}
.gd-parch .chip-btn{display:inline-flex;width:auto;min-height:0;padding:5px 10px;border-radius:10px;font:800 12.5px "Nunito",sans-serif;background:#FFF6DE;color:#3A2410;border:2px solid #8A5428;box-shadow:none}
.gd-parch .row{flex-wrap:wrap}
.gd-parch .am-tabs{display:flex;flex-wrap:wrap;gap:6px}
.gd-parch b,.gd-sec b{font-family:"Nunito",sans-serif;font-weight:800}
.gd-parch .chip-btn.on{background:#8A5428;color:#FFF6DE}
.gd-parch .am-row{background:linear-gradient(90deg,#F7D98A,#E8B65A);border:2px solid #8A5A20;border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 rgba(90,52,24,.4)}
.gd-parch .btn.ghost{color:#3A2410;border-color:#8A5428}
.gd-sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid rgba(138,84,40,.35);padding-bottom:4px}
.gd-sec span{font-size:12px;color:#7A5430}
.gd-obj{display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:14px;background:rgba(255,246,222,.65);border:2px solid rgba(138,84,40,.45)}
.gd-obj b{font-size:14px}
.gd-obj.done{background:rgba(43,182,115,.15);border-color:#2BB673}
.gd-mine{font-size:12px;color:#7A5430;font-weight:700}
.gd-chest{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:linear-gradient(135deg,#4A1E8A,#1A0A30);border:2px solid #2E1A0C}
.gd-chest b{color:#FFD23F}.gd-chest span{color:#E0D4FF;font-size:12.5px}
.gd-feat{display:grid;grid-template-columns:1fr 80px 54px;align-items:center;gap:8px;font-size:13px}
.gd-feat b{text-align:right;font:800 12px "IBM Plex Mono",monospace}
.gd-feat.done span{text-decoration:line-through;opacity:.7}
.gd-note{margin:0;font-size:12.5px;color:#7A5430;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gd-rk{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.gd-rk.me{background:rgba(255,210,63,.35);outline:2px solid #E0A82A}
.gd-pick{display:flex;flex-wrap:wrap;gap:6px}
.gd-opt{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.gd-opt.on{border-color:#FFD23F;box-shadow:0 0 0 3px rgba(255,210,63,.4)}
.gd-opt:disabled{opacity:.45;cursor:default}
.gd-lock{position:absolute;bottom:-2px;font:800 9px "IBM Plex Mono",monospace;background:#1E1030;color:#fff;border-radius:6px;padding:0 4px}
.gd-col{width:36px;height:36px;border-radius:50%;border:2px solid #1E1030}
.gd-in,.gd-ta{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px "Nunito",sans-serif}
.gd-ta{min-height:64px;resize:vertical}
.gd-fx-emb{display:grid;place-items:center}
.gd-emb .gd-glow{animation:gdFlick 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.gd-who,.gd-flame,.gd-flick,.gd-zz,.gd-free{animation:none!important}}

/* ---------- Boutique du jour, raretés et collection ---------- */
.bq-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bq-title{font:800 20px var(--f-display)}
.bq-timer{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--surface-2);font-size:12.5px}
.bq-timer b{font:800 13px "IBM Plex Mono",monospace;color:var(--lamp)}
.bq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bq-grid.col{grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:600px){.bq-grid.col{grid-template-columns:repeat(4,1fr)}}
.bq-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 8px 12px;border-radius:18px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 22%,var(--surface)),var(--surface) 70%);border:2.5px solid var(--rc);box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 55%,#000)}
.bq-card.r-leg,.bq-card.r-myth{box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 55%,#000),0 0 18px color-mix(in srgb,var(--rc) 45%,transparent)}
.bq-card.r-myth::before,.bq-card.r-leg::before{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:250% 100%;animation:bqShine 3.2s linear infinite;pointer-events:none}
@keyframes bqShine{from{background-position:150% 0}to{background-position:-100% 0}}
.bq-art{display:grid;place-items:center;min-height:76px}
.bq-card.no .bq-art svg{filter:brightness(.55) saturate(.4)}
.bq-card.hid .bq-art svg{filter:brightness(0) opacity(.55)}
.bq-grid:not(.col) .bq-card.no .bq-art svg{filter:none}
.bq-r{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--rc);color:#fff;font:800 10.5px "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase}
.bq-n{font-size:14px;line-height:1.2}
.bq-how{font-size:11.5px;font-weight:800;color:var(--rc)}
.bq-cond{font-size:11.5px;line-height:1.25;color:var(--muted)}
.bq-meter{width:100%}
.bq-pv{font:700 11px "IBM Plex Mono",monospace;color:var(--muted)}
.bq-today{position:absolute;top:-8px;right:-4px;z-index:1;font-style:normal;font:800 10px "Nunito",sans-serif;background:#FF5FA2;color:#fff;padding:2px 7px;border-radius:8px;border:2px solid var(--surface)}
.bq-week{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:2.5px solid var(--rc);background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 22%,var(--surface)),var(--surface));box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 55%,#000)}
.bq-scroll{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(135deg,#4A2A12,#2A160A);color:#FFF4D8;border:2px solid #1E1008}
.bq-scroll .muted{color:#E8D2A4}
.bq-col-top{display:flex;flex-direction:column;gap:6px}
.bq-filters{display:flex;flex-wrap:wrap;gap:6px}
.bq-filters .chip-btn{padding:6px 10px;font:800 12.5px "Nunito",sans-serif}
.bq-card .bq-n,.bq-cond,.bq-how{font-family:"Nunito",sans-serif}
@media (prefers-reduced-motion:reduce){.bq-card::before{animation:none!important}}

/* ---------- Calendrier de connexion et potions ---------- */
.cal-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;color:inherit;cursor:pointer;border:2px solid var(--line)}
.cal-card.ready{border-color:#E2283A;box-shadow:0 0 0 3px rgba(226,40,58,.18);animation:calPulse 2s ease-in-out infinite}
@keyframes calPulse{50%{box-shadow:0 0 0 3px rgba(226,40,58,.18),0 0 22px rgba(255,210,63,.45)}}
.cal-card-ic{flex:none}
.cal-veil{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(14,6,24,.62);backdrop-filter:blur(3px);animation:calIn .25s ease-out}
@keyframes calIn{from{opacity:0}}
.cal-box{position:relative;width:min(440px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 14px 16px;border-radius:24px;color:#3A2410;
  background:linear-gradient(180deg,#F7EAD0,#E8D2A4);border:3px solid #2E1A0C;box-shadow:inset 0 0 28px rgba(138,84,40,.35),0 8px 0 #2E1A0C;animation:calPop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes calPop{from{transform:scale(.85);opacity:0}}
.cal-box .am-x{color:#3A2410}
.cal-title{font:800 22px var(--f-display);text-align:center}
.cal-sub{font-size:12.5px;text-align:center;color:#7A5430!important}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;margin:4px 0}
.cal-t{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border-radius:12px;background:linear-gradient(#FFF6DE,#F0DDB4);border:2px solid #8A5428;box-shadow:0 3px 0 #8A5428;min-height:84px;justify-content:space-between}
.cal-t.big{grid-column:span 2;background:linear-gradient(#FFE58A,#E8B820);border-color:#8A6400;box-shadow:0 3px 0 #8A6400,0 0 14px rgba(255,210,63,.5)}
.cal-d{font:800 10.5px "IBM Plex Mono",monospace;color:#7A5430}
.cal-l{font:800 9.5px "Nunito",sans-serif;line-height:1.1;text-align:center;color:#5A3A1E}
.cal-ic{display:grid;place-items:center;min-height:30px}
.cal-t.lock{filter:grayscale(.55) brightness(.92);opacity:.78}
.cal-t.got{background:linear-gradient(#E6F6EA,#BFE6CC);border-color:#2E8A4A;box-shadow:0 3px 0 #2E8A4A}
.cal-t.got .cal-ic{opacity:.45}
.cal-ok{position:absolute;inset:auto auto 50% 50%;transform:translate(-50%,50%);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#2BB673;color:#fff;font-weight:900;border:2px solid #0E4A2A}
.cal-lk{position:absolute;top:2px;right:3px;font-size:10px}
.cal-t.now,.cal-t.today{border-color:#E2283A;box-shadow:0 3px 0 #8A101E,0 0 0 3px rgba(226,40,58,.25),0 0 18px rgba(255,210,63,.65);transform:translateY(-2px)}
.cal-t.now{animation:calNow 1.4s ease-in-out infinite}
@keyframes calNow{50%{transform:translateY(-4px) scale(1.04)}}
.cal-t.opening{animation:calOpen .55s ease-in-out forwards}
@keyframes calOpen{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1)}}
.cal-coins{position:relative;display:inline-block;width:var(--z);height:var(--z)}
.cal-coins i{position:absolute;left:12%;width:76%;height:34%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF6B0,#FFD23F 45%,#C8860A);border:2px solid #7A5000}
.cal-coins i:nth-child(1){bottom:0}.cal-coins i:nth-child(2){bottom:26%}.cal-coins i:nth-child(3){bottom:52%}
.cal-go{width:100%;margin-top:4px}
.cal-burst{position:absolute;inset:0;z-index:3;display:grid;place-items:center;overflow:hidden;border-radius:22px;background:radial-gradient(circle,rgba(255,236,160,.75),rgba(247,234,208,.2) 60%);animation:calIn .2s}
.cal-burst.out{opacity:0;transition:opacity .35s}
.cal-win{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 20px;border-radius:20px;background:#FFF6DE;border:3px solid #2E1A0C;box-shadow:0 6px 0 #2E1A0C;animation:calPop .4s cubic-bezier(.3,1.7,.5,1);text-align:center;max-width:80%}
.cal-win b{font:800 20px var(--f-display);color:#3A2410}.cal-win span{font-size:12.5px;color:#7A5430}
.pill.pot{display:inline-flex;align-items:center;gap:3px;padding:4px 6px}
.pot-i{display:inline-flex;align-items:center;gap:2px}
.pot-n{font:800 11px "IBM Plex Mono",monospace;color:var(--ink,#2B1D3A)}
.pot-i.on b{font:800 11px "IBM Plex Mono",monospace;color:#9A4AD8}
.pot-i.on svg{filter:drop-shadow(0 0 4px rgba(255,210,63,.9))}
.pot-svg.off{filter:grayscale(1) opacity(.45)}
.pot-box{align-items:stretch;gap:12px}
.pot-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,246,222,.75);border:2px solid rgba(138,84,40,.45)}
.pot-st{font-size:12px;font-weight:800;color:#7A5430}
@media (prefers-reduced-motion:reduce){.cal-card,.cal-t.now,.cal-t.opening,.cal-box,.cal-win{animation:none!important}}

/* ---------- Boutons de retour, de fermeture et accès direct aux quêtes (novembre 2026) ---------- */
.quit{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 15px;border-radius:999px;cursor:pointer;
  font:800 13.5px "Nunito",sans-serif;letter-spacing:0;color:var(--ink);background:var(--surface);border:2px solid color-mix(in srgb,var(--lamp) 55%,var(--line));
  box-shadow:0 3px 0 color-mix(in srgb,var(--lamp) 40%,transparent),0 2px 10px rgba(30,10,50,.18)}
.quit:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--lamp) 40%,transparent)}
.quit:focus-visible,.am-x:focus-visible,.qs-go:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.am-x{width:36px;height:36px;display:grid;place-items:center;font-size:22px;font-weight:900;color:var(--ink);background:var(--surface);border:2px solid color-mix(in srgb,var(--lamp) 50%,var(--line));box-shadow:0 2px 8px rgba(30,10,50,.25);cursor:pointer}
.am-inv.portal .am-x{background:#2A0A10;color:#FFE8EA;border-color:#C8101E}
.cal-box .am-x{background:#FFF6DE;color:#3A2410;border-color:#8A5428}
.qs-rw{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:76px}
.qs-go{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;border:0;cursor:pointer;font:800 12.5px "Nunito",sans-serif;color:#fff;
  background:linear-gradient(180deg,#FF6FB0,#C83A8A);box-shadow:0 3px 0 #8A1E5A;white-space:nowrap}
.qs-go span{font-weight:900}
.qs-go:active{transform:translateY(2px);box-shadow:0 1px 0 #8A1E5A}
.qs-done{font:800 11px "Nunito",sans-serif;color:#2BB673}
.qs-lock{max-width:110px;text-align:right;font:700 11px/1.2 "Nunito",sans-serif;color:var(--muted)}

/* ---------- Événements temporaires (evenements.js) ---------- */
.me{position:relative}
.ev-hbtn{position:absolute;top:-4px;right:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 8px 4px;border-radius:14px;border:2px solid #2B1D3A;background:linear-gradient(#5A1E6A,#2A0C38);color:#FFD88A;font:800 10.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 3px 0 #2B1D3A,0 0 18px rgba(255,120,40,.45);cursor:pointer;animation:evPulse 2.4s ease-in-out infinite}
.ev-hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #2B1D3A}
.ev-dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#FF5FA2;border:2px solid #2B1D3A}
@keyframes evPulse{50%{box-shadow:0 3px 0 #2B1D3A,0 0 28px rgba(255,120,40,.75)}}
.me .stack{padding-right:64px}
.ev-card{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;padding:0;overflow:hidden;text-align:left;background:linear-gradient(100deg,#2A0C38,#5A1E4A);color:#FFF4E8;border:2px solid #2B1D3A;cursor:pointer}
.ev-card-art{height:82px;overflow:hidden}.ev-card-art svg{width:100%;height:100%;display:block}
.ev-card-txt{display:flex;flex-direction:column;gap:2px;padding:8px 10px 8px 0;min-width:0}
.ev-card-txt b{font-family:var(--f-display);font-size:18px}.ev-card-txt span:last-child{font-size:12.5px;opacity:.85}
.ev-card .tw-kicker,.ev-banner .tw-kicker{color:#FFB84A}
.ev-hub{gap:12px}
.ev-banner{position:relative;border-radius:20px;overflow:hidden;border:2.5px solid #2B1D3A;box-shadow:0 5px 0 #2B1D3A;aspect-ratio:36/19}
.ev-banner-art{width:100%;height:100%;display:block}
.ev-banner-txt{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(transparent,rgba(10,4,18,.85));color:#FFF4E8}
.ev-title{font-family:var(--f-display);font-size:26px;line-height:1.05;text-shadow:0 2px 0 #2B1D3A}
.ev-time{display:inline-flex;align-items:center;gap:6px;font-size:13px;opacity:.95}
.ev-desc{margin:0;font-size:14.5px;line-height:1.45}
.ev-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ev-stats div{background:var(--surface);border:2px solid var(--line,rgba(0,0,0,.1));border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ev-stats span{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;opacity:.75}
.ev-stats b{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:19px}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev-ch{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 8px 12px;border-radius:18px;background:linear-gradient(#3A1448,#1E0A28);color:#FFF4E8;border:2.5px solid #2B1D3A;box-shadow:0 4px 0 #2B1D3A;text-align:center}
.ev-ch.own{background:linear-gradient(#6A3A0E,#3A1A08);box-shadow:0 4px 0 #2B1D3A,0 0 0 2px #E8960A inset}
.ev-ch-art{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,60,.35),transparent 70%)}
.ev-ch:not(.own) .ev-ch-art svg{filter:saturate(.75) brightness(.9)}
.ev-ch-n{font-family:var(--f-display);font-size:15px;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.ev-pips{display:flex;gap:4px}.ev-pips i{width:14px;height:18px;clip-path:polygon(50% 0,100% 30%,80% 100%,20% 100%,0 30%);background:rgba(255,255,255,.18)}
.ev-pips i.on{background:linear-gradient(#FFC46A,#FF6A2A 60%,#8A2AD8)}
.ev-ch-p{font:600 12px var(--f-mono);opacity:.9}
.ev-ch .chip{font-size:12px}
.ev-how{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.ev-warn{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:2px dashed #E8960A}
.ev-frag{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:#2A0C38;color:#FFF4E8;border:2px solid #FFB84A;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:evFragIn .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px)}
.ev-frag span{overflow:hidden;text-overflow:ellipsis}.ev-frag i{font-style:normal;opacity:.8;font-family:var(--f-mono);font-size:12px}
.ev-frag .ev-shard{animation:evSpin .9s ease-out}
.ev-frag.big{border-color:#FF5FA2}.ev-frag.out{opacity:0;transform:translate(-50%,10px);transition:.4s}
@keyframes evFragIn{from{opacity:0;transform:translate(-50%,24px) scale(.8)}}
@keyframes evSpin{from{transform:rotate(-200deg) scale(.3)}}
.ev-unlock .ev-ul-box{position:relative;overflow:hidden;width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px 18px;border-radius:24px;background:linear-gradient(#3A1448,#14061E);color:#FFF4E8;border:3px solid #2B1D3A;box-shadow:0 6px 0 #2B1D3A}
.ev-ul-rays{position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(255,180,80,.16) 0 10deg,transparent 10deg 20deg);animation:evRays 14s linear infinite}
.ev-ul-box>*:not(.ev-ul-rays){position:relative}
.ev-ul-art{animation:evPop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes evRays{to{transform:rotate(360deg)}}@keyframes evPop{from{transform:scale(.3);opacity:0}}
.ev-bat{animation:evBat 3.2s ease-in-out infinite}.ev-glow{animation:evGlow 2.2s ease-in-out infinite}.ev-star{animation:evGlow 3s ease-in-out infinite}
@keyframes evBat{50%{transform:translate(6px,-5px)}}@keyframes evGlow{50%{opacity:.55}}
.ev-toks{display:flex;flex-direction:column;gap:10px}
.ev-tok{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.joker.tok{background:linear-gradient(#7AE0FF,#2A7AD8);color:#fff}
.joker.tok svg{margin-right:2px}

/* Barre du haut sur petit écran : le pseudo reste toujours lisible (au moins le début, avec « … ») */

.who-n{flex:1 1 auto;min-width:58px}.who-n>span:first-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

.ta-spin{transform-box:fill-box;transform-origin:center;animation:taSpin 2.4s linear infinite}@keyframes taSpin{to{transform:rotate(360deg)}}
.ta-buzz{animation:taBuzz .18s steps(2) infinite}@keyframes taBuzz{50%{transform:translate(.6px,-.6px)}}

/* ---------- Familiers ---------- */
.seg.s6{grid-template-columns:repeat(6,1fr)}.seg.s6 button{font-size:8.6px;padding:9px 0}
.me-av,.pet-wrap,.pet-stage{position:relative;display:inline-block}
.pet-by{position:absolute;right:-18px;bottom:-4px;pointer-events:none;animation:petIdle 2.6s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(20,8,40,.25))}
.pet-by.big{right:-30px;bottom:0}
.pet-by.win{animation:petWin .6s ease-in-out infinite alternate}
@keyframes petIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes petWin{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(6deg)}}
.pet-top,.pet-me{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:6px}
.pet-me{grid-template-columns:auto 1fr auto;gap:22px}
.pet-stage{padding-right:20px}
.pet-card .pet-art{border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 28%,transparent),transparent 70%)}
.ev-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}.ev-seg button{font:800 13.5px var(--f-display);padding:10px 6px;border-radius:12px}
.ev-card.fam{background:linear-gradient(100deg,#2A1A6A,#7A3AB8)}
.ev-goal-t{font-size:12.5px;opacity:.9;min-height:2.4em}
.ev-meter{width:100%}.ev-meter i{background:linear-gradient(90deg,#FFC46A,#FF5FA2)}
/* ---------- Paris en duel ---------- */
.bet-box{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:14px;background:linear-gradient(100deg,rgba(255,210,63,.16),rgba(255,95,162,.12));border:2px dashed #E0A82A}
.bet-pot{display:flex;align-items:center;gap:6px;font-weight:800}
.bet-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:#FFD23F;color:#2B1D3A;font:800 12px var(--f-mono);border:2px solid #2B1D3A}

.bet-res.win{color:#2AA85A}.bet-res.lose{color:#E2283A}

/* ---------- Aventure (aventure.js) : îles, carte de la Forêt, panneau de niveau, combats ---------- */
body.in-adv{overflow:hidden;background:#0E3A78}
body.in-adv .app{max-width:none;padding:0}
body.in-adv .app > .fade{animation:none;transform:none}
.av-scr{position:fixed;inset:0;display:flex;flex-direction:column;z-index:3;color:#fff}
.av-scr.av-sea{background:#0E3A78}
.av-scr.av-w1{background:#2A5A2E}
.av-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.av-scroll::-webkit-scrollbar{display:none}
.av-isl-svg,.av-map-svg{display:block;width:100%;max-width:580px;height:auto;margin:0 auto}
.av-itop{position:relative;z-index:2;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(#0B2C5E,rgba(11,44,94,0))}

.av-top{position:relative;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;display:flex;align-items:center;gap:8px;background:linear-gradient(#3A7A36,#2A5A2E);border-bottom:4px solid #2B1D3A;box-shadow:inset 0 -6px 0 #6E4428}
.av-t{flex:1;min-width:0;line-height:1.08}
.av-t b{display:block;font:800 18px var(--f-display);text-shadow:0 2px 0 #2B1D3A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-t span{font:600 11.5px var(--f-mono);opacity:.9}
.av-rb{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid #2B1D3A;box-shadow:0 4px 0 #2B1D3A;display:grid;place-items:center;font:800 19px var(--f-display);color:#FFF4DA;background:linear-gradient(#C68A52,#8A5A30);text-shadow:0 2px 0 rgba(43,29,58,.6);cursor:pointer}
.av-rb:active{transform:translateY(3px);box-shadow:0 1px 0 #2B1D3A}
.av-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:2.5px solid #2B1D3A;background:#FFF6E0;color:#2B1D3A;font:700 12.5px var(--f-mono);box-shadow:0 2px 0 #2B1D3A;white-space:nowrap}
.av-chip .coin,.av-rw .coin,.af-rw .coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF0A8,#FFC93A 55%,#D88A1A);border:2px solid #2B1D3A;flex:none}
.av-star-i{width:16px;height:16px;flex:none}
.av-isl,.av-node,.av-tav{cursor:pointer}
.av-isl{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.av-isl:active{transform:scale(.97)}
.av-wave{animation:avwv 3.2s ease-in-out infinite}@keyframes avwv{50%{transform:translateX(7px)}}
.av-spin{animation:avspin 6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes avspin{to{transform:rotate(360deg)}}
.av-bob{animation:avbob 2.4s ease-in-out infinite}@keyframes avbob{50%{transform:translateY(-6px)}}
.av-pulse{animation:avpulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes avpulse{50%{opacity:.45;transform:scale(1.12)}}
.av-lava{animation:avlava 1.8s ease-in-out infinite}@keyframes avlava{50%{opacity:.55}}
.av-fog{animation:avfog 7s ease-in-out infinite}@keyframes avfog{50%{transform:translateX(10px);opacity:.8}}
.av-ring{animation:avring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes avring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.6);opacity:0}}
.av-ff{animation:avff 4s ease-in-out infinite}@keyframes avff{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:1;transform:translate(6px,-10px)}}

.av-fall{animation:avfall .7s linear infinite}@keyframes avfall{to{stroke-dashoffset:-30}}
.av-flame{animation:avflame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes avflame{to{transform:scale(1.1,.88)}}
@media (prefers-reduced-motion:reduce){.av-scr *,#av-fight *{animation-duration:.01s!important;animation-iteration-count:1!important}}
/* Panneau d'un niveau */
.av-sheet{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 10px;display:flex;justify-content:center;animation:avsheet .32s cubic-bezier(.2,1.2,.4,1)}

.af{position:absolute;inset:0;display:flex;flex-direction:column;max-width:580px;margin:0 auto}

.af-arena{position:relative;flex:1;min-height:220px;overflow:hidden}

.af-waves{position:absolute;left:4%;top:5%;display:flex;gap:5px;z-index:3;background:rgba(14,8,32,.6);padding:5px 8px;border-radius:99px;border:2px solid #2B1D3A;font:700 12px var(--f-mono)}

.af-waves i.dead{background:#3FCB6A}.af-waves i.now{background:#FFD23F;box-shadow:0 0 8px #FFD23F}
.af-waves i.chief{border-radius:3px;transform:rotate(45deg) scale(.9)}
.af-hero.atk{animation:afatk .42s ease-out}@keyframes afatk{40%{transform:translateX(95%) translateY(-6%) rotate(8deg)}}
.af-hero.hurt{animation:afhurt .45s}@keyframes afhurt{20%,60%{transform:translateX(-6%);filter:brightness(1.6) sepia(1) hue-rotate(-50deg) saturate(5)}40%{transform:translateX(3%)}}
.af-mon.hit{animation:afhit .4s}@keyframes afhit{25%{transform:translateX(7%) rotate(5deg);filter:brightness(3)}60%{transform:translateX(-3%)}}
.af-mon.atk{animation:afmatk .45s ease-in}@keyframes afmatk{45%{transform:translateX(-70%) scale(1.06)}}
.af-mon.die{animation:afdie .55s forwards}@keyframes afdie{30%{transform:scale(1.15);filter:brightness(3)}100%{transform:scale(.1) translateY(30%);opacity:0}}
.af-mon.enter{animation:afenter .5s cubic-bezier(.2,1.4,.4,1)}@keyframes afenter{from{transform:translateX(120%)}}
.af-mon.morph{animation:afmorph .7s}@keyframes afmorph{0%{filter:brightness(4)}40%{transform:scale(1.15)}100%{filter:none}}
.af-slash{position:absolute;right:10%;bottom:22%;width:38%;pointer-events:none;opacity:0;z-index:4}
.af-slash.on{animation:afslash .38s ease-out}@keyframes afslash{0%{opacity:0;transform:scale(.5) rotate(-20deg)}30%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(5deg)}}
.af-dmg{position:absolute;z-index:5;font:800 26px var(--f-display);color:#FFD23F;-webkit-text-stroke:2px #2B1D3A;pointer-events:none;animation:afdmg .8s forwards}
.af-dmg.big{font-size:34px}
@keyframes afdmg{to{transform:translateY(-50px);opacity:0}}
.af-arena.shake{animation:afshk .35s}@keyframes afshk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}}
.af-red{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(transparent 40%,rgba(226,40,58,.55));opacity:0}
.af-red.on{animation:afrf .45s}@keyframes afrf{30%{opacity:1}}
.af-banner{position:absolute;left:0;right:0;top:38%;z-index:6;display:flex;justify-content:center;pointer-events:none;opacity:0}
.af-banner span{background:linear-gradient(#B06AE8,#5A1A9A);border:3px solid #2B1D3A;border-radius:14px;padding:8px 16px;font:800 18px var(--f-display);box-shadow:0 4px 0 #2B1D3A;text-shadow:0 2px 0 #2B1D3A}

.af-q{position:relative;z-index:5;margin:0 8px calc(10px + env(safe-area-inset-bottom,0px));border:4px solid #2B1D3A;border-radius:20px;background:#8A5A30;padding:7px;box-shadow:0 -3px 0 rgba(0,0,0,.3),inset 0 3px 0 #B07A48}

.af-qin{background:linear-gradient(#FFF8E4,#F3DFB2);color:#2B1D3A;border:3px solid #2B1D3A;border-radius:14px;padding:10px}
.af-meta{display:flex;justify-content:space-between;font:700 11.5px var(--f-mono);opacity:.85}
.af-hard{background:#E2283A;color:#fff;border-radius:6px;padding:0 6px;margin-left:4px}
.af-timer{height:9px;border-radius:99px;background:#E2CFA0;border:2px solid #2B1D3A;overflow:hidden;margin:6px 0 8px}
.af-timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3FCB6A,#FFD23F);transform-origin:left}
.af-text{font:700 16.5px/1.3 var(--f-body);min-height:2.6em;margin-bottom:9px}
.af-ans{display:grid;gap:7px}
.af-ans button{border:3px solid #2B1D3A;border-radius:12px;padding:10px 12px;background:#fff;color:#2B1D3A;font:700 15px var(--f-display);text-align:left;box-shadow:0 3px 0 #2B1D3A;cursor:pointer}

@media (max-height:700px){.af-text{font-size:15px;min-height:0}.af-ans button{padding:8px 10px;font-size:14px}.af-ans{gap:5px}}
.af-poster{position:absolute;inset:0;z-index:50;background:rgba(10,6,24,.72);display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}

.af-board{position:relative;width:100%;max-width:440px;margin:auto;border:4px solid #2B1D3A;border-radius:20px;background:repeating-linear-gradient(0deg,#9A6236 0 34px,#8A5630 34px 37px);padding:46px 12px 12px;box-shadow:0 8px 0 #2B1D3A,inset 0 0 0 5px #6A3A1E;animation:afpop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes afpop{from{transform:scale(.7);opacity:0}}
.af-bnr{position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:86%}.af-bnr svg{width:100%;display:block}
.af-paper{background:linear-gradient(#FFF8E4,#F0D9A6);border:3px solid #2B1D3A;border-radius:12px;color:#2B1D3A;padding:12px;text-align:center;transform:rotate(-1deg);box-shadow:0 4px 0 rgba(43,29,58,.5)}

.af-stars{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:2px 0 6px}

.af-stars svg.in{animation:afstar .5s cubic-bezier(.2,1.8,.4,1) forwards}@keyframes afstar{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:scale(1)}}
.af-score{font:800 26px/1 var(--f-display)}.af-score small{font:600 12px var(--f-mono);display:block;opacity:.75;margin-top:3px}

.af-rw{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.af-btns{display:flex;gap:10px;margin-top:12px}.af-btns .av-btn{flex:1}

<script>
/* ---------- Flacons de potions : 2 effets × 3 raretés, style « jouet » de Lumen ---------- */
const PotArt = (() => {
  const TD = "#2B1D3A";
  let U = 0; const uid = () => "po" + (U++);
  const LIQ = {xp:{c:["#E2C8FF", "#A070FF", "#5A2AC8"], glow:"#C9A2FF", t:"XP"}, coin:{c:["#FFF3A8", "#FFC83A", "#D88A0A"], glow:"#FFD23F", t:"×2"}};

  const lg = (id, stops, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a !== undefined ? ` stop-opacity="${a}"` : ""}/>`).join("")}<\/linearGradient>`;
  const rg = (id, c, o = 0) => `<radialGradient id="${id}"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity="${o}"/><\/radialGradient>`;
  const spark = (x, y, r, d, c = "#fff") => `<path class="po-spark" style="animation-delay:-${d}s" d="M${x} ${y - r} L${x + r * .25} ${y - r * .25} L${x + r} ${y} L${x + r * .25} ${y + r * .25} L${x} ${y + r} L${x - r * .25} ${y + r * .25} L${x - r} ${y} L${x - r * .25} ${y - r * .25}Z" fill="${c}"/>`;
  // Objet relief : copie sombre décalée + forme
  const relief = (d, fill, dy = 3, w = 3) => `<path d="${d}" fill="${TD}" transform="translate(0 ${dy})"/><path d="${d}" fill="${fill}" stroke="${TD}" stroke-width="${w}" stroke-linejoin="round"/>`;

  /* --- Commune : fiole ronde, bouchon de liège --- */
  function common(k){
    const L = LIQ[k], g = uid(), gl = uid(), cork = uid();
    const body = "M42 30 V44 Q20 52 20 74 Q20 104 50 104 Q80 104 80 74 Q80 52 58 44 V30Z";
    return `<defs>${lg(g, [[0, L.c[0]], [.5, L.c[1]], [1, L.c[2]]])}${lg(gl, [[0, "#FFFFFF", .55], [1, "#DDEBFF", .25]])}${lg(cork, [[0, "#E8B87A"], [1, "#A8703A"]])}<\/defs>
      ${relief(body, `url(#${gl})`, 4, 3.2)}
      <path d="M23 70 Q50 60 77 70 Q79 101 50 101 Q21 101 23 70Z" fill="url(#${g})"/>
      <path d="M26 74 Q50 66 74 74" stroke="#fff" stroke-width="2.4" fill="none" opacity=".55"/>
      <circle cx="60" cy="86" r="3" fill="#fff" opacity=".6" class="po-bub"/><circle cx="44" cy="92" r="2" fill="#fff" opacity=".5" class="po-bub" style="animation-delay:-1.2s"/>
      ${relief("M39 18 H61 V32 H39Z", `url(#${cork})`, 3, 2.8)}<path d="M43 22 H57" stroke="#fff" stroke-width="2" opacity=".4"/>
      <path d="M28 64 Q24 76 28 88" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
      <text x="50" y="91" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="900" font-size="17" fill="#fff" stroke="${TD}" stroke-width="4" paint-order="stroke">${L.t}<\/text>`;
  }
  /* --- Rare : flacon de cristal à facettes, monture d'argent, halo --- */
  function rare(k){
    const L = LIQ[k], g = uid(), gl = uid(), ag = uid(), h = uid(), gem = uid();
    const body = "M50 34 L76 52 L80 84 L50 108 L20 84 L24 52Z";
    return `<defs>${lg(g, [[0, L.c[0]], [.45, L.c[1]], [1, L.c[2]]])}${lg(gl, [[0, "#FFFFFF", .7], [1, "#CFE4FF", .3]])}${lg(ag, [[0, "#FFFFFF"], [.5, "#C8D4E8"], [1, "#7A88A8"]])}${rg(h, L.glow)}${lg(gem, [[0, "#FFFFFF"], [1, RAR.r.col]])}<\/defs>
      <circle cx="50" cy="72" r="50" fill="url(#${h})" class="po-breathe" opacity=".75"/>
      ${relief(body, `url(#${gl})`, 4, 3.2)}
      <path d="M22 70 L50 62 L78 70 L80 84 L50 106 L20 84Z" fill="url(#${g})"/>
      <path d="M50 34 V108 M24 52 L50 62 L76 52 M20 84 L50 76 L80 84" stroke="#fff" stroke-width="1.6" fill="none" opacity=".45"/>
      <path d="M28 56 L32 80" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
      ${relief("M36 46 Q50 38 64 46 L62 52 Q50 46 38 52Z", `url(#${ag})`, 2, 2.4)}
      ${relief("M30 92 Q50 104 70 92 L72 98 Q50 112 28 98Z", `url(#${ag})`, 2, 2.4)}
      ${relief("M43 22 H57 L59 34 H41Z", `url(#${ag})`, 2, 2.6)}
      ${relief("M50 6 L58 14 L50 24 L42 14Z", `url(#${gem})`, 2, 2.4)}<path d="M46 12 L50 9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

      <text x="50" y="92" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="900" font-size="18" fill="#fff" stroke="${TD}" stroke-width="4" paint-order="stroke">${L.t}<\/text>`;
  }
  /* --- Épique : flacon royal en or, ailes, couronne, runes, aura qui tourne --- */
  function epic(k){
    const L = LIQ[k], g = uid(), gl = uid(), au = uid(), h = uid(), gem = uid(), wg = uid();
    const body = "M50 34 Q70 40 74 60 Q80 86 50 110 Q20 86 26 60 Q30 40 50 34Z";
    const rays = Array.from({length:12}, (_, i) => { const a = i / 12 * Math.PI * 2; return `M50 70 L${(50 + Math.cos(a - .08) * 62).toFixed(1)} ${(70 + Math.sin(a - .08) * 62).toFixed(1)} L${(50 + Math.cos(a + .08) * 62).toFixed(1)} ${(70 + Math.sin(a + .08) * 62).toFixed(1)}Z`; }).join(" ");
    const wing = sd => { const x = sd < 0 ? 0 : 100; const f = (dx, dy) => `${50 + sd * dx} ${dy}`;
      return relief(`M${f(22, 58)} Q${f(44, 40)} ${f(50, 30)} Q${f(48, 50)} ${f(40, 56)} Q${f(50, 58)} ${f(48, 68)} Q${f(38, 70)} ${f(30, 70)} Q${f(40, 76)} ${f(36, 84)} Q${f(28, 80)} ${f(24, 74)}Z`, `url(#${wg})`, 2, 2.6); };
    return `<defs>${lg(g, [[0, L.c[0]], [.4, L.c[1]], [1, L.c[2]]])}${lg(gl, [[0, "#FFFFFF", .75], [1, "#FFE8F8", .35]])}${lg(au, [[0, "#FFF6C8"], [.45, "#FFD23F"], [1, "#B8780E"]])}${rg(h, L.glow)}${lg(gem, [[0, "#FFD0F4"], [1, "#E0249C"]])}${lg(wg, [[0, "#FFFFFF"], [1, "#FFE0F6"]])}<\/defs>
      <circle cx="50" cy="70" r="58" fill="url(#${h})" class="po-breathe" opacity=".9"/>
      <g class="po-spin" style="transform-origin:50px 70px"><path d="${rays}" fill="${L.glow}" opacity=".35"/><\/g>
      ${wing(-1)}${wing(1)}
      ${relief(body, `url(#${gl})`, 4, 3.2)}
      <path d="M27 66 Q50 58 73 66 Q78 88 50 108 Q22 88 27 66Z" fill="url(#${g})"/>
      <g class="po-rune" fill="none" stroke="#FFF6C8" stroke-width="2" stroke-linecap="round"><path d="M38 80 l4 -6 l4 6 M54 78 h8 M58 74 v8 M44 94 q6 -4 12 0"/><\/g>
      <path d="M33 54 Q30 70 34 84" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85"/>
      <path d="M50 34 Q66 40 70 56 M50 34 Q34 40 30 56" stroke="url(#${au})" stroke-width="4" fill="none"/>
      ${relief("M26 62 Q50 54 74 62 L74 68 Q50 60 26 68Z", `url(#${au})`, 2, 2.4)}
      ${relief("M36 98 Q50 106 64 98 L62 106 Q50 114 38 106Z", `url(#${au})`, 2, 2.4)}
      ${relief("M42 22 H58 L60 36 H40Z", `url(#${au})`, 2, 2.6)}
      ${relief("M36 22 L40 8 L46 16 L50 4 L54 16 L60 8 L64 22Z", `url(#${au})`, 2, 2.6)}
      ${relief("M50 12 L54 17 L50 22 L46 17Z", `url(#${gem})`, 1.5, 2)}
      ${spark(10, 28, 7, 0)}${spark(90, 34, 6, .7)}${spark(6, 92, 5, 1.3)}${spark(94, 100, 6, 2)}${spark(50, -2, 5, 1)}
      <text x="50" y="92" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="900" font-size="19" fill="#fff" stroke="${TD}" stroke-width="4" paint-order="stroke">${L.t}<\/text>`;
  }
  function svg(k, r, z, cls){ const inner = r === "e" ? epic(k) : r === "r" ? rare(k) : common(k);
    return `<svg viewBox="-12 -10 124 132" width="${z}" height="${Math.round(z * 132 / 124)}" class="po po-${r} ${cls || ""}" aria-hidden="true">${inner}<\/svg>`; }
  return {svg, RAR, LIQ};
})();

/* ---------- Maquette « Potions » : flacons, en-tête, sac, trouvaille, paliers, calendrier ---------- */
const app = document.getElementById("app");
const A = PotArt, R = A.RAR;
const NAME = {xp:"Double XP", coin:"Double pièces"};
const MIN = {c:30, r:60, e:120}, CAP = 180;
const COL = {xp:"#A070FF", coin:"#FFC83A"};
const st = {inv:{xp:{c:3, r:1, e:0}, coin:{c:2, r:0, e:1}}, act:{xp:24, coin:0}, sel:["xp", "r"]};
const fmtM = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
const coin = () => `<span class="coin"><\/span>`;

function ring(k, m){ const p = Math.min(1, m / CAP), c = 2 * Math.PI * 14;
  return `<span class="ring"><svg class="rg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><circle cx="16" cy="16" r="14" fill="none" stroke="${COL[k]}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}"/><\/svg>${A.svg(k, "c", 24, "still")}<\/span>`; }
function pill(){ const on = ["xp", "coin"].filter(k => st.act[k] > 0);
  if (!on.length) return `<button class="ppill empty" data-go="s-sac">${A.svg("xp", "c", 26, "still")}<span class="t">${total()}<\/span><\/button>`;
  return `<button class="ppill" data-go="s-sac">${on.map(k => `${ring(k, st.act[k])}<span class="t">${st.act[k] >= 60 ? Math.floor(st.act[k] / 60) + "h" + String(st.act[k] % 60).padStart(2, "0") : st.act[k] + "′"}<small>${k === "xp" ? "XP" : "pièces"}<\/small><\/span>`).join("")}<\/button>`; }
const total = () => ["xp", "coin"].reduce((s, k) => s + st.inv[k].c + st.inv[k].r + st.inv[k].e, 0);
function header(){ return `<div class="ph"><div class="who"><span class="ava"><\/span>Erwan<\/div><span class="ph-coins">${coin()} 2 480<\/span>${pill()}<\/div>`; }

function gallery(){ return `<div class="pg">${["xp", "coin"].map(k => ["c", "r", "e"].map(r => `<div class="pg-c r-${r}">${A.svg(k, r, 92, "po-float")}<b>${NAME[k]}<\/b><span class="rar ${r}">${R[r].n}<\/span><i>${R[r].dur}<\/i><\/div>`).join("")).join("")}<\/div>`; }

function bag(){
  const [k, r] = st.sel, n = st.inv[k][r], cur = st.act[k], after = Math.min(CAP, cur + MIN[r]), lost = cur + MIN[r] - after;
  const act = ["xp", "coin"].map(x => `<div class="act">${A.svg(x, "c", 26, "still")}<b>${NAME[x]}<\/b><span class="bar"><i style="width:${st.act[x] / CAP * 100}%;background:${COL[x]}"><\/i><\/span><em>${st.act[x] ? fmtM(st.act[x]) : "—"}<\/em><\/div>`).join("");
  const grid = ["xp", "coin"].map(x => `<div class="bag-row">${NAME[x]}<\/div><div class="bag-g">${["c", "r", "e"].map(y => `<button class="slot r-${y} ${st.sel[0] === x && st.sel[1] === y ? "sel" : ""} ${st.inv[x][y] ? "" : "zero"}" data-sl="${x},${y}">${A.svg(x, y, 58, "still")}<span class="q">×${st.inv[x][y]}<\/span><span class="rar ${y}">${R[y].n}<\/span><span class="d">${R[y].dur}<\/span><\/button>`).join("")}<\/div>`).join("");
  return `<div class="bag"><div class="bag-h"><b>🎒 Mes potions<\/b><span>${total()} / 20 par case<\/span><\/div>
    <div class="bag-act">${act}<\/div>${grid}
    <div class="bag-go"><p><b>${NAME[k]} · ${R[r].n}<\/b> : ${cur ? `il reste ${fmtM(cur)}, ça passera à <b>${fmtM(after)}<\/b>` : `<b>${fmtM(MIN[r])}<\/b> à partir de maintenant`}.<\/p>
    <button class="btn3" data-use ${n ? "" : "disabled"}>${n ? `Activer (${fmtM(MIN[r])})` : "Aucune potion de ce type"}<\/button>
    ${lost > 0 && n ? `<div class="cap">⚠ Maximum 3 h d'avance : ${fmtM(lost)} seraient perdues.<\/div>` : ""}<\/div>
    <div class="bag-src">Une potion ne s'abîme jamais dans le sac. Le temps ne compte qu'une fois activée. Double XP et Double pièces peuvent tourner en même temps.<\/div><\/div>`; }

function drop(r, k){
  const titles = {c:"Potion trouvée !", r:"Potion rare !", e:"POTION ÉPIQUE !"};
  const cf = r === "c" ? "" : `<div class="confetti">${Array.from({length:r === "e" ? 36 : 18}, (_, i) => `<i style="background:${["#FFD23F", "#FF5FD2", "#4AA8FF", "#3DDC84", "#fff"][i % 5]};--x:${Math.round(Math.cos(i) * (90 + i * 5))}px;--y:${Math.round(Math.sin(i * 1.7) * 140 - 40)}px;--r:${i * 47}deg"><\/i>`).join("")}<\/div>`;
  const v = document.createElement("div"); v.className = "drop-v";
  v.innerHTML = `<div class="drop ${r}">${cf}<div class="k">${r === "e" ? "★ Extrêmement rare ★" : "Bonne réponse · bonus"}<\/div><h3>${titles[r]}<\/h3>
    <div class="fl">${A.svg(k, r, r === "e" ? 150 : 128)}<\/div>
    <span class="rar ${r}">${R[r].n} · ${R[r].dur}<\/span><p>${NAME[k]} rangée dans ton sac. Tu l'actives quand tu veux.<\/p>
    <div class="row2"><button class="btn3 ghost" data-close>Plus tard<\/button><button class="btn3" data-close data-now="${k},${r}">Activer<\/button><\/div><\/div>`;
  document.body.appendChild(v); st.inv[k][r]++; }

function tierLine(steps, val, max){ const pos = x => x / max * 100;
  const fill = Math.min(100, pos(val)), nextI = steps.findIndex(s => s.at > val);
  return `<div class="tl"><div class="rail"><\/div><div class="fill" style="width:${fill}%"><\/div>${steps.map((s, i) => `<div class="st ${s.at <= val ? "got" : i === nextI ? "next" : ""}" style="left:${pos(s.at)}%"><div class="ic">${s.p ? A.svg(s.p[0], s.p[1], 30, "still") : `<span class="cn">${coin()}${s.c}<\/span>`}<\/div><span>${s.at}<\/span><\/div>`).join("")}<\/div>`; }
const ST = (at, p, c) => ({at, p:p && p.split(","), c});
function tiers(){
  return `<div class="ingame">${A.svg("coin", "r", 34, "still")}<div><b>Survie · série de 18<\/b><small>Prochain palier : 20 → potion rare<\/small><div class="mbar"><i style="width:90%"><\/i><\/div><\/div><\/div>
  <div class="tier"><div class="tier-h"><b>💀 Survie (par partie)<\/b><span>record du jour 18<\/span><\/div>
    ${tierLine([ST(5, 0, 20), ST(10, "xp,c"), ST(15, 0, 50), ST(20, "coin,r"), ST(30, "xp,e")], 18, 32)}
    <div class="tier-f">Potions sur <b>3 parties par jour<\/b> · épique <b>1 fois par semaine<\/b>.<\/div><\/div>
  <div class="tier"><div class="tier-h"><b>🐉 Boss du jour (dégâts)<\/b><span>11 PV infligés<\/span><\/div>
    ${tierLine([ST(5, "coin,c"), ST(10, "xp,c"), ST(15, 0, 200)], 11, 17)}
    <div class="tier-f">Compté sur le combat du jour, réinitialisé demain.<\/div><\/div>
  <div class="tier"><div class="tier-h"><b>🗼 Tour (étages)<\/b><span>étage 41<\/span><\/div>
    ${tierLine([ST(10, "xp,c"), ST(25, "coin,c"), ST(50, "xp,r"), ST(75, "coin,r"), ST(100, "xp,e")], 41, 106)}
    <div class="tier-f">Une seule fois par palier, pour toujours. L'étage 25 donne aussi 150 pièces.<\/div><\/div>
  <div class="tier"><div class="tier-h"><b>🌍 Atlas · pays<\/b><span>84 / 197<\/span><\/div>
    ${tierLine([ST(10, 0, 50), ST(25, "xp,c"), ST(50, "coin,c"), ST(100, "xp,r"), ST(150, "coin,r"), ST(197, "xp,e")], 84, 205)}
    <div class="tier-h" style="margin-top:12px"><b>🏛️ Atlas · capitales<\/b><span>61 / 196<\/span><\/div>
    ${tierLine([ST(10, 0, 50), ST(25, "coin,c"), ST(50, "xp,r"), ST(100, "coin,r"), ST(150, "xp,r"), ST(196, "coin,e")], 61, 204)}
    <div class="tier-f">Deux progressions séparées. Les paliers déjà dépassés seront donnés à la mise à jour.<\/div><\/div>`; }

const CAL = [[100], ["xp", "c"], [150], ["coin", "c"], [150], ["xp", "r"], [400], ["coin", "c"], [150], ["xp", "c"], [200], ["coin", "r"], [250], ["xp", "e", 500]];
function cal(){ const today = 5;
  return `<div class="cal"><div class="cal-h"><b>📅 Calendrier de connexion<\/b><span>Jour ${today} / 14 · une case par jour<\/span><\/div><div class="cal-g">${CAL.map((d, i) => { const n = i + 1, pot = typeof d[0] === "string";
    const cls = [n < today ? "got" : "", n === today ? "today" : "", pot && d[1] === "r" ? "rare" : "", n === 14 ? "big" : ""].join(" ");
    const pz = pot ? `${A.svg(d[0], d[1], n === 14 ? 50 : 38, n === 14 ? "" : "still")}${d[2] ? `<span class="coins3"><i><\/i><i><\/i><i><\/i><\/span>` : ""}` : `<span class="coins3"><i><\/i><i><\/i><i><\/i><\/span>`;
    const v = pot ? (d[2] ? `Épique + ${d[2]}` : `${R[d[1]].n}`) : `${d[0]}`;
    return `<div class="day ${cls}"><span class="n">J${n}<\/span><div class="pz">${pz}<\/div><span class="v">${v}<\/span><\/div>`; }).join("")}<\/div>
    <button class="btn3">Récupérer le jour ${today}<\/button>
    <div class="leg"><span>Pièces : J1 J3 J5 J7 J9 J11 J13<\/span><span>Potions : J2 J4 J6 J8 J10 J12 J14<\/span><\/div><\/div>`; }

function render(){
  app.innerHTML = `<div class="pp">
    <nav class="pp-nav"><a href="#s-fl">Flacons<\/a><a href="#s-hd">En-tête<\/a><a href="#s-sac">Sac<\/a><a href="#s-dr">Trouvaille<\/a><a href="#s-pa">Paliers<\/a><a href="#s-ca">Calendrier<\/a><\/nav>
    <h2 id="s-fl">Les 6 potions<\/h2><p class="sub">Toujours ×2. Seule la durée change avec la rareté.<\/p>${gallery()}
    <h2 id="s-hd">En haut de l'écran<\/h2><p class="sub">Un anneau par effet actif : il se vide avec le temps.<\/p>${header()}
    <p class="ph-note">Sans potion active, la pastille montre juste le nombre de potions dans le sac.<\/p>
    <h2 id="s-sac">Le sac à potions<\/h2><p class="sub">Touche une potion, puis « Activer ». Essaie !<\/p>${bag()}
    <h2 id="s-dr">Potion trouvée !<\/h2><p class="sub">2 % de chance par bonne réponse (3 par jour maximum), plus les récompenses.<\/p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn3 ghost" style="flex:1" data-dr="c,xp">Commune<\/button><button class="btn3 ghost" style="flex:1" data-dr="r,coin">Rare<\/button><button class="btn3 ghost" style="flex:1" data-dr="e,xp">Épique<\/button><\/div>
    <p class="ph-note">En pleine partie, pas de fenêtre : juste un petit bandeau qui ne gêne pas.<\/p>
    <div style="text-align:center;margin-top:6px"><span class="mini-toast">${A.svg("coin", "c", 30, "still")} Potion trouvée · Double pièces<\/span><\/div>
    <h2 id="s-pa">Les paliers<\/h2><p class="sub">Même barre partout : coche verte = gagné, cercle doré = prochain.<\/p>${tiers()}
    <h2 id="s-ca">Le nouveau calendrier<\/h2><p class="sub">14 jours, pièces et potions en alternance, l'épique au bout.<\/p>${cal()}
  <\/div>`; }
render();
document.addEventListener("click", e => {
  const t = e.target.closest("[data-sl],[data-use],[data-dr],[data-close],[data-go]"); if (!t) return; const d = t.dataset;
  if (d.go) { document.getElementById(d.go).scrollIntoView({behavior:"smooth"}); return; }
  if (d.sl) { st.sel = d.sl.split(","); return keep(); }
  if (d.use !== undefined) { const [k, r] = st.sel; if (!st.inv[k][r]) return; st.inv[k][r]--; st.act[k] = Math.min(CAP, st.act[k] + MIN[r]); return keep(); }
  if (d.dr) { const [r, k] = d.dr.split(","); return drop(r, k); }
  if (d.close !== undefined) { if (d.now) { const [k, r] = d.now.split(","); st.inv[k][r]--; st.act[k] = Math.min(CAP, st.act[k] + MIN[r]); } document.querySelector(".drop-v").remove(); keep(); }
});
function keep(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

</script></body></html>
