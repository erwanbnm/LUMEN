<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumen · Aventure (maquette)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500;700&family=Literata:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B0F33;--ink:#2B1D3A;--lamp:#FF5FA2;--gold:#FFD23F;--f-d:"Bricolage Grotesque",system-ui,sans-serif;--f-m:"IBM Plex Mono",monospace;--f-t:"Literata",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0E0820;color:#fff;font-family:var(--f-d)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:440px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
/*__CSS__*/
/* ---------- Boutons en relief ---------- */
.b3{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:14px;padding:9px 14px;font-weight:800;background:linear-gradient(#FFFFFF,#E9E2F4);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.b3:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.b3.pink{background:linear-gradient(#FF8AC0,#FF4F9A);color:#fff;text-shadow:0 2px 0 rgba(43,29,58,.55)}
.b3.green{background:linear-gradient(#8BE36A,#3FA83E);color:#fff;text-shadow:0 2px 0 rgba(43,29,58,.55)}
.b3.wood{background:linear-gradient(#C68A52,#8A5A30);color:#FFF4DA;text-shadow:0 2px 0 rgba(43,29,58,.6)}
.b3.round{width:46px;height:46px;padding:0;border-radius:50%}
.b3[disabled]{filter:grayscale(.8) brightness(.8);cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:2.5px solid var(--ink);background:#FFF6E0;color:var(--ink);font:700 12.5px var(--f-m);box-shadow:0 2px 0 var(--ink)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF0A8,#FFC93A 55%,#D88A1A);border:2px solid var(--ink);flex:none}
.star-i{width:16px;height:16px;flex:none}
/* Barre de la maquette */
.proto{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:4px;background:rgba(14,8,32,.86);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:4px;font:600 11px var(--f-m)}
.proto button{padding:5px 9px;border-radius:99px;color:#CFC6F0}
.proto button.on{background:var(--lamp);color:#fff}
/* ---------- Écran des îles ---------- */
#isl{background:#0E3A78}
.isl-top{position:relative;z-index:2;padding:calc(12px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(#0B2C5E,rgba(11,44,94,0))}
.isl-top h1{margin:0;font-size:26px;letter-spacing:-.02em;text-shadow:0 3px 0 var(--ink);flex:1}
.isl-scroll{flex:1;overflow:auto;margin-top:-58px}
.isl-scroll svg{display:block;width:100%;height:auto}
.wv{animation:wv 3.2s ease-in-out infinite}
@keyframes wv{50%{transform:translateX(7px)}}
.isl-g{cursor:pointer;transition:transform .2s;transform-box:fill-box;transform-origin:center}
.isl-g:active{transform:scale(.97)}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.45;transform:scale(1.12)}}
.lava{animation:lava 1.8s ease-in-out infinite}
@keyframes lava{50%{opacity:.55}}
.fog{animation:fog 7s ease-in-out infinite}
@keyframes fog{50%{transform:translateX(10px);opacity:.8}}
.friends{position:absolute;left:12px;right:12px;bottom:calc(52px + env(safe-area-inset-bottom));z-index:3;border:3px solid var(--ink);border-radius:18px;background:linear-gradient(#FFF8E6,#F5E2B8);color:var(--ink);padding:10px 12px;box-shadow:0 5px 0 var(--ink);display:none}
.friends.on{display:block}
.friends h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.fr-row{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:6px 4px;border-top:2px dashed rgba(43,29,58,.18);font-size:14px}
.fr-row b{font-weight:800}.fr-row .m{font:600 12px var(--f-m);opacity:.75}
.fr-row.me{background:rgba(255,95,162,.16);border-radius:10px}
/* ---------- Carte d'un monde : thème Forêt ---------- */
#map{--w1:#3E8A3A;--w2:#24582A;--wood:#7A4A26}
.m-top{position:relative;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;display:flex;align-items:center;gap:8px;background:linear-gradient(#3A7A36,#2A5A2E);border-bottom:4px solid var(--ink);box-shadow:inset 0 -6px 0 #6E4428}
.m-top .t{flex:1;min-width:0;line-height:1.05}
.m-top .t b{display:block;font-size:18px;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-top .t span{font:600 11.5px var(--f-m);opacity:.9}
.m-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.m-scroll svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node:hover .nd{filter:brightness(1.08)}
.cur-ring{animation:ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.6);opacity:0}}
.ff{animation:ff 4s ease-in-out infinite}
@keyframes ff{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:1;transform:translate(6px,-10px)}}
.flow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-40}}
.fall{animation:fall .7s linear infinite}
@keyframes fall{to{stroke-dashoffset:-30}}
.flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flame{to{transform:scale(1.1,.88)}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.twinkle{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.dock{position:absolute;right:10px;bottom:calc(56px + env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.dock .b3{position:relative;background:linear-gradient(#FFF6E0,#EBD3A0)}
.dock .lk{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#5A5870;border:2px solid var(--ink);display:grid;place-items:center}
.dock .lab{position:absolute;right:54px;top:50%;transform:translateY(-50%);white-space:nowrap;font:700 11px var(--f-m);background:rgba(20,40,20,.85);padding:3px 8px;border-radius:8px;pointer-events:none}
/* Panneau d'un niveau */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,1.2,.4,1);padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet-in{position:relative;border:4px solid var(--ink);border-radius:22px;background:#8A5A30;padding:9px;box-shadow:0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 #B07A48}
.parch{background:linear-gradient(#FFF8E4,#F3DFB2);color:var(--ink);border:3px solid var(--ink);border-radius:15px;padding:14px 14px 12px;position:relative}
.ribbon{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:linear-gradient(#6CD04A,#2E8A32);border:3px solid var(--ink);border-radius:10px;padding:3px 16px;font:800 13px var(--f-m);color:#fff;text-shadow:0 2px 0 var(--ink);white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.ribbon.boss{background:linear-gradient(#B06AE8,#6A2AA8)}
.sh-x{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:#FFF;color:var(--ink);font-weight:800;box-shadow:0 3px 0 var(--ink);z-index:2}
.sh-h{display:flex;gap:12px;align-items:center;margin-top:4px}
.sh-h h2{margin:0;font-size:22px;line-height:1.05}
.sh-h .art{flex:none;width:76px;height:76px;border-radius:16px;border:3px solid var(--ink);background:radial-gradient(circle at 50% 40%,#C8F0A0,#5AAA4A);display:grid;place-items:center;overflow:hidden}
.sh-h .art.boss{background:radial-gradient(circle at 50% 40%,#C9A0FF,#3A1A5A)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip.mode{background:#2B1D3A;color:#fff}
.chip.mode.chrono{background:#2A7AD8}.chip.mode.surv{background:#E2283A}.chip.mode.boss{background:#7A2AB8}
.objs{margin:12px 0 8px;display:flex;flex-direction:column;gap:6px}
.obj{display:flex;align-items:center;gap:9px;font:500 14px var(--f-t)}
.obj svg{flex:none}
.obj.got{font-weight:700}
.mons{display:flex;align-items:center;gap:4px;margin-top:8px;font:600 12px var(--f-m);opacity:.9}
.mons svg{flex:none}
.sh-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.sh-foot .rw{flex:1;font:600 12.5px var(--f-m);display:flex;flex-direction:column;gap:3px}
.sh-foot .rw span{display:flex;align-items:center;gap:5px}
.sh-foot .b3{font-size:19px;padding:12px 26px}
.lockmsg{margin:10px 0 0;font:500 14px var(--f-t);display:flex;gap:8px;align-items:center}
/* Taverne-Casino */
.ovl{position:absolute;inset:0;z-index:40;background:rgba(10,6,24,.66);display:none;align-items:center;justify-content:center;padding:16px}
.ovl.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.tav{width:100%;border:4px solid var(--ink);border-radius:22px;background:linear-gradient(#7A3A1E,#4A1E12);padding:10px;box-shadow:0 6px 0 var(--ink);animation:popin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.tav-h{text-align:center;padding:4px 0 10px}
.tav-h b{display:block;font-size:22px;color:#FFD23F;text-shadow:0 3px 0 var(--ink)}
.tav-h span{font:600 12px var(--f-m);color:#FFE2B8}
.tav-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tav-c{border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#2E8A4E,#1A5A32);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--ink);text-align:center}
.tav-c b{font-size:15px}.tav-c span{font:500 11px var(--f-m);opacity:.85}
.tav-c.wheel{background:linear-gradient(#B04AD8,#6A1A9A)}
.tav-note{margin:10px 2px 0;font:500 12px var(--f-m);color:#FFE2B8;text-align:center}
/* Petit message */
.toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:70;background:#FFF6E0;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:.25s;pointer-events:none;width:max-content;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- Combat d'un niveau ---------- */
#fight{background:#14301E}
.f-top{position:relative;z-index:5;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;gap:8px;background:rgba(18,40,24,.92);border-bottom:3px solid var(--ink)}
.f-top .t{flex:1;line-height:1.05}.f-top .t b{font-size:16px;display:block}.f-top .t span{font:600 11px var(--f-m);opacity:.85}
.arena{position:relative;flex:1;min-height:260px;overflow:hidden}
.arena .bg{position:absolute;inset:0;width:100%;height:100%}
.hero{position:absolute;left:3%;bottom:8%;width:40%;transition:transform .18s}
.hero .pet{position:absolute;left:-14%;bottom:-2%;width:46%}
.mon{position:absolute;right:3%;bottom:9%;width:45%;transition:transform .18s}
.mon.chief{width:54%;right:0}
.mon-svg{animation:mbob 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes mbob{50%{transform:scale(1.04,.95)}}
.hp{position:absolute;right:4%;top:6%;width:52%;background:rgba(14,8,32,.78);border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px 7px;z-index:3}
.hp .n{display:flex;justify-content:space-between;font:700 12px var(--f-m);margin-bottom:4px}
.hp .bar{height:12px;border-radius:99px;background:#3A2440;border:2px solid var(--ink);overflow:hidden}
.hp .bar i{display:block;height:100%;background:linear-gradient(#FF8A7A,#E2283A);transition:width .35s;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.waves{position:absolute;left:4%;top:6%;display:flex;gap:5px;z-index:3;background:rgba(14,8,32,.6);padding:5px 8px;border-radius:99px;border:2px solid var(--ink)}
.waves i{width:13px;height:13px;border-radius:50%;background:#5A5870;border:2px solid var(--ink)}
.waves i.dead{background:#3FCB6A}.waves i.now{background:#FFD23F;box-shadow:0 0 8px #FFD23F}
.waves i.chief{border-radius:3px;transform:rotate(45deg) scale(.9)}
.hero.atk{animation:hatk .42s ease-out}
@keyframes hatk{40%{transform:translateX(95%) translateY(-6%) rotate(8deg)}}
.hero.hurt{animation:hurt .45s}
@keyframes hurt{20%,60%{transform:translateX(-6%);filter:drop-shadow(0 0 0 #f00) brightness(1.6) sepia(1) hue-rotate(-50deg) saturate(5)}40%{transform:translateX(3%)}}
.mon.hit{animation:mhit .4s}
@keyframes mhit{25%{transform:translateX(7%) rotate(5deg);filter:brightness(3)}60%{transform:translateX(-3%)}}
.mon.atk{animation:matk .45s ease-in}
@keyframes matk{45%{transform:translateX(-80%) scale(1.06)}}
.mon.die{animation:mdie .55s forwards}
@keyframes mdie{30%{transform:scale(1.15);filter:brightness(3)}100%{transform:scale(.1) translateY(30%);opacity:0}}
.mon.enter{animation:menter .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes menter{from{transform:translateX(120%)}}
.mon.flee{animation:mflee .8s forwards}
@keyframes mflee{to{transform:translateX(160%) rotate(10deg)}}
.slash{position:absolute;right:10%;bottom:22%;width:38%;pointer-events:none;opacity:0;z-index:4}
.slash.on{animation:slash .38s ease-out}
@keyframes slash{0%{opacity:0;transform:scale(.5) rotate(-20deg)}30%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(5deg)}}
.dmg{position:absolute;z-index:5;font:800 26px var(--f-d);color:#FFD23F;-webkit-text-stroke:2px var(--ink);pointer-events:none;animation:dmg .8s forwards}
@keyframes dmg{to{transform:translateY(-50px);opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}}
.redflash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(transparent 40%,rgba(226,40,58,.55));opacity:0}
.redflash.on{animation:rf .45s}
@keyframes rf{30%{opacity:1}}
.qpanel{position:relative;z-index:5;margin:0 8px calc(46px + env(safe-area-inset-bottom));border:4px solid var(--ink);border-radius:20px;background:#8A5A30;padding:7px;box-shadow:0 -3px 0 rgba(0,0,0,.3),inset 0 3px 0 #B07A48}
.qin{background:linear-gradient(#FFF8E4,#F3DFB2);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 10px 10px}
.qmeta{display:flex;justify-content:space-between;font:700 11.5px var(--f-m);opacity:.8}
.timer{height:9px;border-radius:99px;background:#E2CFA0;border:2px solid var(--ink);overflow:hidden;margin:6px 0 8px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3FCB6A,#FFD23F);transform-origin:left}
.qtext{font:700 16.5px/1.3 var(--f-t);min-height:2.6em;margin-bottom:9px}
.ans{display:grid;gap:7px}
.ans button{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);font:700 15px var(--f-d);text-align:left;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.ans button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ans button.ok{background:#3FCB6A;color:#fff}
.ans button.ko{background:#FF5A6A;color:#fff}
.ans button[disabled]{cursor:default}
/* Affiche de fin */
.poster{position:absolute;inset:0;z-index:50;background:rgba(10,6,24,.72);display:none;align-items:center;justify-content:center;padding:18px}
.poster.on{display:flex;animation:fade .25s}
.board{position:relative;width:100%;border:4px solid var(--ink);border-radius:20px;background:repeating-linear-gradient(0deg,#9A6236 0 34px,#8A5630 34px 37px);padding:46px 12px 12px;box-shadow:0 8px 0 var(--ink),inset 0 0 0 5px #6A3A1E;animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
.banner{position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:86%}
.banner svg{width:100%;display:block}
.p-paper{background:linear-gradient(#FFF8E4,#F0D9A6);border:3px solid var(--ink);border-radius:12px;color:var(--ink);padding:12px;text-align:center;transform:rotate(-1deg);box-shadow:0 4px 0 rgba(43,29,58,.5)}
.p-stars{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:2px 0 6px}
.p-stars svg{opacity:0;transform:scale(0)}
.p-stars svg.in{animation:starin .5s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes starin{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:scale(1)}}
.p-stars svg.mid{margin-bottom:12px}
.p-score{font-size:28px;font-weight:800;line-height:1}
.p-score small{font:600 12px var(--f-m);display:block;opacity:.75;margin-top:2px}
.p-objs{text-align:left;margin:10px 0 8px;display:flex;flex-direction:column;gap:5px}
.p-rw{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.p-heroes{display:flex;justify-content:center;align-items:flex-end;margin:-6px 0 2px}
.p-heroes .w{animation:jump .6s ease-in-out infinite alternate}
.p-heroes .w2{animation-delay:.3s}
@keyframes jump{to{transform:translateY(-10px)}}
.p-btns{display:flex;gap:10px;margin-top:12px}
.p-btns .b3{flex:1}
.p-flee{font:500 13px var(--f-t);margin:4px 0 0;opacity:.85}
</style></head>
<body>
<div id="app">
  <!-- ===== Écran 1 : les îles ===== -->
  <section class="scr on" id="isl">
    <div class="isl-top"><button class="b3 round" aria-label="Retour">←</button><h1>Aventure</h1>
      <span class="chip"><svg class="star-i" viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.5 6 .7-4.4 4.1 1.1 6-5.3-3-5.3 3 1.1-6L1.4 7.7l6-.7z" fill="#FFD23F" stroke="#2B1D3A" stroke-width="1.8" stroke-linejoin="round"/></svg><b id="st-isl">5</b>/105</span>
      <button class="b3 round" data-act="friends" aria-label="Classement des amis">🏆</button></div>
    <div class="isl-scroll"><svg id="isl-svg" viewBox="0 0 400 800"></svg></div>
    <div class="friends" id="friends"><h3>🏆 Classement des amis <span style="flex:1"></span><button class="b3" style="padding:2px 9px;font-size:13px" data-act="friends">✕</button></h3>
      <div class="fr-row"><b>1</b><span><b>Ami A</b> <span class="m">· Monde 2</span></span><span class="m">Niv. 5</span><span class="chip">★ 31 · 38 %</span></div>
      <div class="fr-row me"><b>2</b><span><b>Toi</b> <span class="m">· Monde 1</span></span><span class="m">Niv. 3</span><span class="chip">★ 5 · 14 %</span></div>
      <div class="fr-row"><b>3</b><span><b>Ami B</b> <span class="m">· Monde 1</span></span><span class="m">Niv. 2</span><span class="chip">★ 3 · 9 %</span></div>
    </div>
  </section>

  <!-- ===== Écran 2 : la carte de la Forêt ===== -->
  <section class="scr" id="map">
    <div class="m-top"><button class="b3 round wood" data-go="isl" aria-label="Retour aux îles">←</button>
      <div class="t"><b>La Forêt des Anciens</b><span>Monde 1 · complété à 14 %</span></div>
      <span class="chip"><svg class="star-i" viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.5 6 .7-4.4 4.1 1.1 6-5.3-3-5.3 3 1.1-6L1.4 7.7l6-.7z" fill="#FFD23F" stroke="#2B1D3A" stroke-width="1.8" stroke-linejoin="round"/></svg><b id="st-map">5</b>/21</span>
      <button class="b3 round wood" id="mus" aria-label="Musique">♪</button></div>
    <div class="m-scroll" id="m-scroll"><svg id="map-svg" viewBox="0 0 400 1580"></svg></div>
    <div class="dock" id="dock">

<script>/*__ART__*/</script>
<script>
const Q = /*__Q__*/[];
const $ = id => document.getElementById(id);
const TDc = "#2B1D3A";
/* ---------- Outils de dessin ---------- */
function rnd(seed){ seed = seed % 2147483647; if (seed <= 0) seed += 2147483646; return () => (seed = seed * 16807 % 2147483647) / 2147483647; }
function smooth(p, closed){
  const n = p.length, f = v => v.toFixed(1); let d = `M${f(p[0][0])} ${f(p[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++){
    const p0 = closed ? p[(i - 1 + n) % n] : p[Math.max(0, i - 1)], p1 = p[i], p2 = p[(i + 1) % n], p3 = closed ? p[(i + 2) % n] : p[Math.min(n - 1, i + 2)];
    d += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + (closed ? "Z" : "");
}
function sample(p, k = 24){ // points le long d'une courbe de Catmull-Rom ouverte
  const out = [], n = p.length;
  for (let i = 0; i < n - 1; i++){ const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(n - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    for (let j = 0; j < k; j++){ const t = j / k, u = 1 - t;
      out.push([u*u*u*p1[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p2[0], u*u*u*p1[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p2[1]]); } }
  out.push(p[n - 1]); return out;
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const near = (pt, list) => Math.min(...list.map(q => dist(pt, q)));
function blob(cx, cy, rx, ry, seed, k = 10, amp = .14){ const r = rnd(seed), p = [];
  for (let i = 0; i < k; i++){ const a = i / k * Math.PI * 2, m = 1 + (r() - .5) * 2 * amp; p.push([cx + Math.cos(a) * rx * m, cy + Math.sin(a) * ry * m]); }
  return smooth(p, true); }
function bumpy(cx, cy, rx, ry, k, seed){ const r = rnd(seed), p = [];
  for (let i = 0; i < k * 2; i++){ const a = i / (k * 2) * Math.PI * 2 - Math.PI / 2, m = i % 2 ? .9 : 1 + r() * .06; p.push([cx + Math.cos(a) * rx * m, cy + Math.sin(a) * ry * m]); }
  return smooth(p, true); }
// Remplissage « jouet » avec un dégradé partagé : copie sombre décalée + dégradé + contour
const tf = (d, g, dark, dy = 3, w = 2.6) => `${dy ? `<path d="${d}" transform="translate(0 ${dy})" fill="${dark}" stroke="${TDc}" stroke-width="${w}" stroke-linejoin="round"/>` : ""}<path d="${d}" fill="url(#${g})" stroke="${TDc}" stroke-width="${w}" stroke-linejoin="round"/>`;
const lg = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const rg = (id, a, b, o = 0) => `<radialGradient id="${id}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}" stop-opacity="${o}"/></radialGradient>`;
const starP = (x, y, r) => { let d = ""; for (let i = 0; i < 10; i++){ const a = Math.PI * i / 5 - Math.PI / 2, rr = i % 2 ? r * .46 : r; d += (i ? "L" : "M") + (x + rr * Math.cos(a)).toFixed(1) + " " + (y + rr * Math.sin(a)).toFixed(1); } return d + "Z"; };
const starSVG = (on, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><path d="${starP(10, 10.6, 9)}" fill="${on ? "#FFD23F" : "#CDBF9E"}" stroke="${TDc}" stroke-width="1.8" stroke-linejoin="round"/>${on ? `<path d="M7 6.5 L9 5.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>` : ""}</svg>`;
const nest = (svg, x, y) => svg.replace("<svg ", `<svg x="${x}" y="${y}" `);
const HERO = CREATURES.find(c => c.n === "Voile") || CREATURES[0];
const PET = typeof petOf === "function" ? petOf("pet_foudre") : null;

/* ---------- Arbres et décor de la Forêt ---------- */
const TREE_PAL = [["tA", "#A6EA72", "#4FA83E", "#2E6A2A"], ["tB", "#86DA5E", "#3A8E3E", "#21542A"], ["tC", "#7DE0A8", "#2F9A6A", "#1C5A42"], ["tP", "#FFC4E2", "#E66AAE", "#9A3A78"]];
const forestDefs = () => TREE_PAL.map(p => lg(p[0], p[1], p[2])).join("") + lg("trunk", "#A87444", "#6E4428") + lg("pine", "#5FC27A", "#1F6A44") + lg("stone", "#E4E0EC", "#9C98AE") + lg("rock", "#B8B0A8", "#6E6660")
  + lg("sand", "#F8E2AE", "#E2BE7A") + lg("water", "#7FD8FF", "#2E9AD8") + lg("redcap", "#FF6A6A", "#C02838") + lg("wall", "#FFF0D2", "#D6B080") + lg("roof", "#B07AE0", "#6A3AA8") + lg("woodg", "#C88A50", "#7A4A26") + lg("gold", "#FFE07A", "#E09A1A")
  + rg("glowY", "#FFF4A0", "#FFD23F") + rg("glowC", "#B8FFFF", "#4AE0FF") + rg("glowP", "#E8C8FF", "#A060FF") + rg("glowW", "#FFFFFF", "#FFFFFF");
function tree(x, y, s, kind, seed){
  if (kind === "pine"){ const h = 58 * s, w = 22 * s;
    const d = `M${x} ${y - h} L${x + w * .5} ${y - h * .7} L${x + w * .3} ${y - h * .7} L${x + w * .8} ${y - h * .4} L${x + w * .5} ${y - h * .4} L${x + w} ${y - h * .12} L${x - w} ${y - h * .12} L${x - w * .5} ${y - h * .4} L${x - w * .8} ${y - h * .4} L${x - w * .3} ${y - h * .7} L${x - w * .5} ${y - h * .7}Z`;
    return `<ellipse cx="${x}" cy="${y}" rx="${16 * s}" ry="${5 * s}" fill="rgba(20,40,10,.25)"/><rect x="${x - 3.5 * s}" y="${y - 10 * s}" width="${7 * s}" height="${10 * s}" fill="url(#trunk)" stroke="${TDc}" stroke-width="2.2"/>` + tf(d, "pine", "#164A30", 3 * s, 2.4) + `<path d="M${x - 2 * s} ${y - h * .86} L${x - w * .35} ${y - h * .62}" stroke="#fff" stroke-width="${2.4 * s}" stroke-linecap="round" opacity=".5"/>`;
  }
  const p = TREE_PAL[kind] || TREE_PAL[0];
  const trunk = `M${x - 5 * s} ${y} Q${x - 4 * s} ${y - 12 * s} ${x - 4 * s} ${y - 24 * s} L${x + 4 * s} ${y - 24 * s} Q${x + 4 * s} ${y - 12 * s} ${x + 5 * s} ${y}Z`;
  const can = bumpy(x, y - 36 * s, 23 * s, 19 * s, 7 + (seed % 2), seed);
  return `<ellipse cx="${x}" cy="${y}" rx="${18 * s}" ry="${5.5 * s}" fill="rgba(20,40,10,.25)"/>` + tf(trunk, "trunk", "#4A2C18", 0, 2.2) + tf(can, p[0], p[3], 4 * s, 2.6)
    + `<path d="M${x - 13 * s} ${y - 41 * s} Q${x - 8 * s} ${y - 50 * s} ${x} ${y - 51 * s}" stroke="#fff" stroke-width="${3 * s}" fill="none" stroke-linecap="round" opacity=".55"/>`
    + (kind === 3 ? "" : `<circle cx="${x + 9 * s}" cy="${y - 32 * s}" r="${2 * s}" fill="${["#FF6A8A", "#FFD23F", "#fff"][seed % 3]}" stroke="${TDc}" stroke-width="1"/>`);
}
const bush = (x, y, s, seed) => `<ellipse cx="${x}" cy="${y}" rx="${16 * s}" ry="${4 * s}" fill="rgba(20,40,10,.25)"/>` + tf(bumpy(x, y - 9 * s, 17 * s, 11 * s, 4, seed), "tB", "#21542A", 2.5, 2.3);
const mush = (x, y, s) => `<rect x="${x - 2.5 * s}" y="${y - 8 * s}" width="${5 * s}" height="${8 * s}" rx="2" fill="#FFF0D2" stroke="${TDc}" stroke-width="1.8"/>` + tf(`M${x - 8 * s} ${y - 7 * s} Q${x} ${y - 20 * s} ${x + 8 * s} ${y - 7 * s}Z`, "redcap", "#7A1A24", 1.5, 1.8) + `<circle cx="${x - 2 * s}" cy="${y - 12 * s}" r="${1.6 * s}" fill="#fff"/>`;
const flower = (x, y, c) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${c}" stroke="${TDc}" stroke-width="1"/><circle cx="${x}" cy="${y}" r=".9" fill="#FFF6B0"/>`;

// Maison champignon (Village des Lucioles)
function hut(x, y, s = 1, seed = 1){
  const wall = `M${x - 18 * s} ${y} L${x - 16 * s} ${y - 26 * s} L${x + 16 * s} ${y - 26 * s} L${x + 18 * s} ${y}Z`;
  const cap = `M${x - 32 * s} ${y - 22 * s} Q${x - 30 * s} ${y - 62 * s} ${x} ${y - 64 * s} Q${x + 30 * s} ${y - 62 * s} ${x + 32 * s} ${y - 22 * s} Q${x} ${y - 14 * s} ${x - 32 * s} ${y - 22 * s}Z`;
  return `<ellipse cx="${x}" cy="${y + 1}" rx="${30 * s}" ry="${6 * s}" fill="rgba(20,40,10,.3)"/>` + tf(wall, "wall", "#8A6A44", 0, 2.4)
    + `<path d="M${x - 6 * s} ${y} L${x - 6 * s} ${y - 11 * s} Q${x} ${y - 18 * s} ${x + 6 * s} ${y - 11 * s} L${x + 6 * s} ${y}Z" fill="#6E4428" stroke="${TDc}" stroke-width="2"/>`
    + `<circle cx="${x + 11 * s}" cy="${y - 15 * s}" r="${4 * s}" fill="url(#glowY)" stroke="${TDc}" stroke-width="1.8" class="pulse" style="animation-delay:-${seed * .3}s"/>`
    + tf(cap, seed % 2 ? "redcap" : "roof", seed % 2 ? "#7A1A24" : "#3A1A6A", 3.5, 2.6)
    + [[-16, -40, 5], [4, -52, 6], [18, -36, 4], [-2, -34, 3.5]].map(([dx, dy, r]) => `<ellipse cx="${x + dx * s}" cy="${y + dy * s}" rx="${r * s}" ry="${r * .8 * s}" fill="#FFF6E8" stroke="${TDc}" stroke-width="1.5"/>`).join("")
    + `<path d="M${x - 22 * s} ${y - 46 * s} Q${x - 14 * s} ${y - 58 * s} ${x - 2 * s} ${y - 59 * s}" stroke="#fff" stroke-width="${2.6 * s}" fill="none" stroke-linecap="round" opacity=".6"/>`;
}
function column(x, y, h, broken, s = 1){
  const top = broken ? `L${x + 8 * s} ${y - h + 6} L${x + 3 * s} ${y - h - 2} L${x - 2 * s} ${y - h + 5} L${x - 8 * s} ${y - h}` : `L${x + 8 * s} ${y - h} L${x - 8 * s} ${y - h}`;
  return `<ellipse cx="${x}" cy="${y}" rx="${14 * s}" ry="${4 * s}" fill="rgba(20,40,10,.3)"/>` + tf(`M${x - 8 * s} ${y} L${x + 8 * s} ${y} ${top}Z`, "stone", "#6A667A", 3, 2.3)
    + `<rect x="${x - 11 * s}" y="${y - 5}" width="${22 * s}" height="6" rx="2" fill="url(#stone)" stroke="${TDc}" stroke-width="2"/>`
    + (broken ? "" : `<rect x="${x - 11 * s}" y="${y - h - 5}" width="${22 * s}" height="7" rx="2" fill="url(#stone)" stroke="${TDc}" stroke-width="2"/>`)
    + `<path d="M${x - 3 * s} ${y - 6} L${x - 3 * s} ${y - h + 10}" stroke="#fff" stroke-width="2" opacity=".5"/>`
    + `<path d="${bumpy(x - 4 * s, y - h * .45, 8 * s, 5, 3, h)}" fill="#5AB04A" stroke="${TDc}" stroke-width="1.6"/>`;
}
function arch(x, y){
  const d = `M${x - 34} ${y} L${x - 34} ${y - 44} Q${x} ${y - 84} ${x + 34} ${y - 44} L${x + 34} ${y} L${x + 20} ${y} L${x + 20} ${y - 40} Q${x} ${y - 64} ${x - 20} ${y - 40} L${x - 20} ${y}Z`;
  return `<ellipse cx="${x}" cy="${y}" rx="40" ry="7" fill="rgba(20,40,10,.3)"/>` + tf(d, "stone", "#6A667A", 4, 2.6)
    + `<path d="M${x - 10} ${y - 56} l4 -4 l4 4 l-4 4z M${x + 4} ${y - 58} h6" stroke="#8A60FF" stroke-width="2" fill="none" class="pulse"/>`
    + `<path d="${bumpy(x + 24, y - 56, 12, 7, 4, 9)}" fill="#5AB04A" stroke="${TDc}" stroke-width="1.6"/><path d="M${x + 30} ${y - 50} q2 12 -2 20" stroke="#3E8A3A" stroke-width="2.4" fill="none"/>`;
}
function cave(x, y){
  const rock = blob(x, y - 40, 62, 50, 77, 11, .12);
  return `<ellipse cx="${x}" cy="${y + 4}" rx="66" ry="12" fill="rgba(20,40,10,.3)"/>` + tf(rock, "rock", "#4A4440", 5, 2.8)
    + `<path d="${bumpy(x + 10, y - 82, 40, 12, 5, 4)}" fill="#5AB04A" stroke="${TDc}" stroke-width="2"/>`
    + `<path d="M${x - 26} ${y} Q${x - 26} ${y - 46} ${x} ${y - 48} Q${x + 26} ${y - 46} ${x + 26} ${y}Z" fill="#1A1020" stroke="${TDc}" stroke-width="2.6"/>`
    + `<circle cx="${x - 6}" cy="${y - 26}" r="3" fill="#FFE07A" class="pulse"/><circle cx="${x + 7}" cy="${y - 26}" r="3" fill="#FFE07A" class="pulse"/>`
    + [[-44, 2], [-36, -4], [40, 2], [48, -6]].map(([dx, dy], i) => `<circle cx="${x + dx}" cy="${y + dy - 8}" r="11" fill="url(#glowC)" class="pulse" style="animation-delay:-${i * .4}s"/><rect x="${x + dx - 1.6}" y="${y + dy - 6}" width="3.2" height="7" fill="#E8FFFF" stroke="${TDc}" stroke-width="1.2"/><path d="M${x + dx - 6} ${y + dy - 5} Q${x + dx} ${y + dy - 15} ${x + dx + 6} ${y + dy - 5}Z" fill="#6AF0FF" stroke="${TDc}" stroke-width="1.4"/>`).join("")
    + `<path d="M${x - 40} ${y - 62} Q${x - 24} ${y - 84} ${x} ${y - 86}" stroke="#fff" stroke-width="3" fill="none" opacity=".45" stroke-linecap="round"/>`;
}
function sanctuary(x, y){
  return `<circle cx="${x}" cy="${y}" r="56" fill="url(#glowC)" opacity=".55" class="pulse"/>`
    + `<ellipse cx="${x}" cy="${y}" rx="44" ry="20" fill="url(#stone)" stroke="${TDc}" stroke-width="2.6"/><ellipse cx="${x}" cy="${y - 2}" rx="34" ry="13" fill="url(#water)" stroke="${TDc}" stroke-width="2.2"/>`
    + `<ellipse cx="${x - 8}" cy="${y - 5}" rx="12" ry="3" fill="#E8FFFF" opacity=".75" class="fog"/>`
    + [[-52, -6], [-30, -26], [30, -26], [52, -6]].map(([dx, dy], i) => tf(`M${x + dx - 7} ${y + dy} L${x + dx - 6} ${y + dy - 30} Q${x + dx} ${y + dy - 38} ${x + dx + 6} ${y + dy - 30} L${x + dx + 7} ${y + dy}Z`, "stone", "#6A667A", 3, 2.2) + `<path d="M${x + dx - 2} ${y + dy - 22} l2 -4 l2 4 l-2 4z" fill="#7AF0FF" class="pulse" style="animation-delay:-${i * .3}s"/>`).join("");
}
function taverne(x, y){
  const body = `M${x - 46} ${y} L${x - 44} ${y - 50} L${x + 44} ${y - 50} L${x + 46} ${y}Z`;
  const roof = `M${x - 58} ${y - 44} L${x - 30} ${y - 92} L${x + 30} ${y - 92} L${x + 58} ${y - 44}Z`;
  return `<ellipse cx="${x}" cy="${y + 2}" rx="62" ry="11" fill="rgba(20,40,10,.32)"/>`
    + `<circle cx="${x}" cy="${y - 40}" r="80" fill="url(#glowY)" opacity=".28" class="pulse"/>`
    + tf(body, "woodg", "#4A2C18", 0, 2.8)
    + [-30, -10, 10, 30].map(dx => `<path d="M${x + dx} ${y - 48} L${x + dx} ${y - 2}" stroke="#5A3418" stroke-width="2" opacity=".6"/>`).join("")
    + tf(roof, "tB", "#21542A", 5, 2.8) + `<path d="M${x - 40} ${y - 56} L${x - 22} ${y - 86}" stroke="#fff" stroke-width="3" opacity=".45" stroke-linecap="round"/>`
    + `<path d="${bumpy(x - 30, y - 90, 14, 6, 3, 5)}" fill="#3E8A3A" stroke="${TDc}" stroke-width="1.8"/>`
    + `<rect x="${x + 22}" y="${y - 112}" width="12" height="24" fill="#8A6A5A" stroke="${TDc}" stroke-width="2.2"/><circle cx="${x + 28}" cy="${y - 120}" r="5" fill="#E8E0F0" opacity=".7" class="fog"/>`
    + `<path d="M${x - 12} ${y} L${x - 12} ${y - 26} Q${x} ${y - 38} ${x + 12} ${y - 26} L${x + 12} ${y}Z" fill="url(#glowY)" stroke="${TDc}" stroke-width="2.4"/><path d="M${x} ${y - 32} L${x} ${y}" stroke="${TDc}" stroke-width="2"/>`
    + [-31, 31].map(dx => `<rect x="${x + dx - 9}" y="${y - 40}" width="18" height="15" rx="3" fill="url(#glowY)" stroke="${TDc}" stroke-width="2.2"/><path d="M${x + dx} ${y - 40} v15 M${x + dx - 9} ${y - 32} h18" stroke="${TDc}" stroke-width="1.6"/>`).join("")
    // enseigne au trèfle
    + `<rect x="${x - 38}" y="${y - 76}" width="76" height="22" rx="6" fill="#2B1A12" stroke="#FFD23F" stroke-width="2.4"/>`
    + `<text x="${x + 6}" y="${y - 60.5}" text-anchor="middle" style="font:800 11px 'Bricolage Grotesque',sans-serif" fill="#FFD23F">CASINO</text>`
    + `<g transform="translate(${x - 26} ${y - 65})"><circle cx="0" cy="-4" r="3.4" fill="#5AE07A"/><circle cx="-3.6" cy="1" r="3.4" fill="#5AE07A"/><circle cx="3.6" cy="1" r="3.4" fill="#5AE07A"/><path d="M0 2 L1 8" stroke="#5AE07A" stroke-width="1.6"/></g>`
    // lanternes
    + [-50, 50].map((dx, i) => `<path d="M${x + dx} ${y - 50} v6" stroke="${TDc}" stroke-width="1.8"/><circle cx="${x + dx}" cy="${y - 38}" r="12" fill="url(#glowP)" class="pulse" style="animation-delay:-${i * .5}s"/><rect x="${x + dx - 4.5}" y="${y - 44}" width="9" height="12" rx="3" fill="#FF8AC8" stroke="${TDc}" stroke-width="1.8"/>`).join("")
    // tonneau et dés
    + `<rect x="${x + 50}" y="${y - 18}" width="16" height="18" rx="4" fill="url(#woodg)" stroke="${TDc}" stroke-width="2"/><path d="M${x + 50} ${y - 12} h16 M${x + 50} ${y - 5} h16" stroke="${TDc}" stroke-width="1.4"/>`

      if (m.hp <= 0){ $("mon").classList.add("die"); setTimeout(() => { if (F.m < F.mons.length - 1) { F.m++; showMon(true); } else { $("mon").innerHTML = ""; $("waves").innerHTML = F.mons.map(x => `<i class="dead ${x.chief ? "chief" : ""}"></i>`).join(""); } }, 560); } }, 170);
    setTimeout(nextQ, 1250);
  } else {
    F.streak = 0;
    fx($("mon"), "atk", 460);
    setTimeout(() => { fx($("hero"), "hurt", 460); fx($("redflash"), "on", 460); fx($("arena"), "shake", 360); }, 200);
    setTimeout(nextQ, 1900);
  }
}
function dmg(t){ const d = document.createElement("div"); d.className = "dmg"; d.textContent = t; d.style.right = (18 + Math.random() * 14) + "%"; d.style.bottom = "48%"; $("arena").appendChild(d); setTimeout(() => d.remove(), 820); }
function endFight(demo){
  clearInterval(F.timer);
  const win = F.ok >= 6, i = F.lv, L = LV[i];
  const got = [F.ok >= 6, F.ok >= 8, F.best >= 5];
  const nst = got.filter(Boolean).length, before = PROG.stars[i];
  if (win) { PROG.stars[i] = Math.max(before, nst); PROG.best[i] = Math.max(PROG.best[i] || 0, F.ok); if (i === PROG.cur) PROG.cur = Math.min(6, i + 1); }
  const newStars = Math.max(0, nst - before), firstWin = win && before === 0;
  const coins = (firstWin ? 30 : 0) + newStars * 10 + Math.round(F.ok * .7);
  const alive = F.mons.filter(m => m.hp > 0);
  const objs = ["Réussir le niveau (6/10)", "Maîtrise : 8/10 ou plus", L.sp];
  const banner = `<svg viewBox="0 0 300 70"><path d="M8 22 L40 22 L40 58 L22 50 L4 58 L14 40Z" fill="${win ? "#B02A3A" : "#4A4466"}" stroke="${TDc}" stroke-width="3" stroke-linejoin="round"/><path d="M292 22 L260 22 L260 58 L278 50 L296 58 L286 40Z" fill="${win ? "#B02A3A" : "#4A4466"}" stroke="${TDc}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 8 L270 8 Q276 30 270 52 L30 52 Q24 30 30 8Z" fill="${win ? "url(#bnr)" : "#6A6680"}" stroke="${TDc}" stroke-width="3.4"/><defs>${lg("bnr", "#FF6A7A", "#C8243A")}</defs><path d="M40 16 L260 16" stroke="#fff" stroke-width="3" opacity=".35" stroke-linecap="round"/>
    <text x="150" y="41" text-anchor="middle" style="font:800 30px 'Bricolage Grotesque',sans-serif;letter-spacing:.04em" fill="#FFD23F" stroke="${TDc}" stroke-width="5" paint-order="stroke">${win ? "VICTOIRE !" : "DÉFAITE…"}</text></svg>`;
  const bigStar = (on, k) => `<svg class="${k === 1 ? "mid" : ""}" width="${k === 1 ? 64 : 52}" height="${k === 1 ? 64 : 52}" viewBox="0 0 40 40"><path d="${starP(20, 21, 18)}" fill="${on ? "#FFD23F" : "#CDBF9E"}" stroke="${TDc}" stroke-width="2.6" stroke-linejoin="round"/>${on ? `<path d="M13 13 L17 11" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>` : ""}</svg>`;
  $("poster").innerHTML = `<div class="board"><div class="banner">${banner}</div><div class="p-paper">
    ${win ? `<div class="p-heroes"><span class="w">${creatureSVG(HERO, 74)}</span>${PET ? `<span class="w w2">${creatureSVG(PET, 40)}</span>` : ""}</div>` : ""}
    <div class="p-stars">${got.map((g, k) => bigStar(win && g, k)).join("")}</div>
    <div class="p-score">${F.ok} / 10<small>bonnes réponses · ${L.n}</small></div>
    ${win && alive.length ? `<p class="p-flee">${alive.some(m => m.chief) ? "Le chef de bande s'enfuit dans les fourrés…" : "Les derniers monstres s'enfuient !"}</p>` : win ? `<p class="p-flee">Toute la bande est vaincue, même le chef !</p>` : `<p class="p-flee">Il faut 6 bonnes réponses pour passer. Retente ta chance !</p>`}
    <div class="p-objs">${objs.map((o, k) => `<div class="obj ${win && got[k] ? "got" : ""}">${starSVG(win && got[k], 18)}<span>${o}</span></div>`).join("")}</div>
    ${win ? `<div class="p-rw"><span class="chip"><span class="coin"></span>+${coins} pièces</span><span class="chip">+${F.ok * 12} XP</span>${newStars ? `<span class="chip">+${newStars} ★ nouvelle${newStars > 1 ? "s" : ""}</span>` : ""}</div>` : ""}
  </div><div class="p-btns"><button class="b3 wood" data-act="replay">Rejouer</button><button class="b3 ${win ? "green" : "pink"}" data-act="tomap">${win ? "Continuer" : "Retour à la carte"}</button></div></div>`;
  $("poster").classList.add("on");
  if (win) [...$("poster").querySelectorAll(".p-stars svg")].forEach((s, k) => setTimeout(() => s.classList.add("in"), 350 + k * 380));
  else [...$("poster").querySelectorAll(".p-stars svg")].forEach(s => s.classList.add("in"));
}

/* ---------- Navigation ---------- */
function go(id){
  document.querySelectorAll(".scr").forEach(s => s.classList.toggle("on", s.id === id));
  document.querySelectorAll(".proto button").forEach(b => b.classList.toggle("on", b.dataset.go === id));
  if (id === "map"){ closeSheet(); drawMap(); const sc = $("m-scroll"), k = sc.clientWidth / 400; sc.scrollTop = NODES[PROG.cur][1] * k - sc.clientHeight * .6; }
  if (id !== "fight" && F) clearInterval(F.timer);
  const tot = PROG.stars.reduce((a, b) => a + b, 0); $("st-map").textContent = tot; $("st-isl").textContent = tot;
}
let tt; function toast(t){ const e = $("toast"); e.innerHTML = t; e.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("on"), 2400); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go],[data-act],[data-node],[data-world],[data-chest],[data-sec],[data-ans]"); if (!b) return;
  const d = b.dataset;
  if (d.ans !== undefined) return pick(decodeURIComponent(d.ans));
  if (d.go) { if (d.go === "fight") return startFight(PROG.cur > 5 ? 0 : (LV[PROG.cur].mode === "c" ? PROG.cur : 0)); return go(d.go); }
  if (d.world) return d.world === "1" ? go("map") : toast("🔒 Bats le boss du monde précédent pour ouvrir cette île.");
  if (d.node !== undefined) return openSheet(+d.node);
  if (d.chest){ if (opened[d.chest]) return toast("Coffre déjà ouvert."); opened[d.chest] = 1; const p = b.querySelector("path.twinkle"); if (p) p.remove();
    const bb = b.getBBox(); b.insertAdjacentHTML("beforeend", chest(bb.x + bb.width / 2, bb.y + 4, true)); return toast(`Coffre caché trouvé ! <span class="coin" style="vertical-align:-2px"></span> +${[0, 80, 120, 60][d.chest]} pièces · ${Object.keys(opened).length}/3`); }
  if (d.sec) return toast("Chemin secret : fais 3 étoiles au niveau 4 pour dissiper la brume.");
  const a = d.act;
  if (a === "close-sheet") return closeSheet();
  if (a === "play") return startFight(+d.i);
  if (a === "friends") return $("friends").classList.toggle("on");
  if (a === "friends2") { go("isl"); return $("friends").classList.add("on"); }
  if (a === "journal") return toast("📜 Journal de quêtes : il s'ouvre après le niveau 4.");
  if (a === "info") return toast("Monde 1 · 7 niveaux · 3 coffres cachés · 1 chemin secret · 1 relique");
  if (a === "close-tav") return $("tav").classList.remove("on");
  if (a === "game") return toast("Maquette : ici s'ouvrira le jeu actuel du Casino.");
  if (a === "quit") { clearInterval(F && F.timer); return go("map"); }
  if (a === "replay") return startFight(F.lv);
  if (a === "tomap") return go("map");
  if (a === "demo-win") { PROG.stars[0] = 0; startFight(0); F.ok = 8; F.best = 5; F.n = 10; F.mons.forEach((m, j) => { if (j < 3) m.hp = 0; }); return endFight(); }
});
document.getElementById("map-svg").addEventListener("click", e => { if (e.target.closest("[data-node],[data-chest],[data-sec]")) return; const p = e.target.closest("svg"); const pt = p.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const m = pt.matrixTransform(p.getScreenCTM().inverse()); if (dist([m.x, m.y], [318, 1320]) < 60) openTav(); });
$("mus").addEventListener("click", () => { const on = $("mus").classList.toggle("off"); $("mus").textContent = on ? "🔇" : "♪"; toast(on ? "Musique coupée" : "Musique de la Forêt (fichier à fournir)"); });
drawIslands();
</script>
