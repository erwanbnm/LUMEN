# Notifications de Lumen : défi du jour (~8 h), rappel (~16 h), défis des amis.
# GitHub lance ce travail toutes les 10 minutes (avec parfois quelques minutes de retard).
# Lancement à la main : onglet Actions > Notifications > Run workflow (mode « test » pour essayer).
name: Notifications
on:
  schedule:
    - cron: "*/10 * * * *"
  # Modifier notifs/test.txt et l'envoyer sur GitHub lance une notification de test
  push:
    paths: ["notifs/test.txt", "notifs/annonce.txt", "main.js"]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (normal) ou test (envoie une notification de test)"
        default: "test"
concurrency: notifs
jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notifs/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: notifs
      # Envoi sur GitHub de notifs/annonce.txt : annonce à tout le monde ; de notifs/test.txt : notification de test
      - id: quoi
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CH=$(git diff --name-only HEAD~1 HEAD)
            if echo "$CH" | grep -q "notifs/annonce.txt"; then echo "mode=annonce" >> $GITHUB_OUTPUT; elif echo "$CH" | grep -q "notifs/test.txt"; then echo "mode=test" >> $GITHUB_OUTPUT; else echo "mode=auto" >> $GITHUB_OUTPUT; fi
          else echo "mode=${{ github.event.inputs.mode || 'auto' }}" >> $GITHUB_OUTPUT; fi
      - run: node send.js "${{ steps.quoi.outputs.mode }}"
        working-directory: notifs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
